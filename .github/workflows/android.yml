name: Android APK

# apk.json değişip main dalına gönderildiğinde APK derlenir ve "Releases" sayfasında yayınlanır.
# (Uygulama içeriği güncellemeleri APK gerektirmez; version.json + Pages ile telefona kendiliğinden iner.)
on:
  push:
    branches: [main]
    paths: [apk.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # Android SDK hazır kurulu gelen imaj
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK kontrolü
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: İmza anahtarı kontrolü
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret tanımlı değil. Kurulum talimatındaki 4 secret'ı ekleyin."
            exit 1
          fi

      - name: Paketleri kur
        run: npm install

      - name: Web dosyalarını hazırla
        run: npm run build

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor "#10231e" --iconBackgroundColorDark "#10231e" --splashBackgroundColor "#10231e" --splashBackgroundColorDark "#10231e"
          node scripts/android-patch.mjs
          npx cap sync android

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: APK imzala
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > nur.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk hizali.apk
          "$BT/apksigner" sign --ks nur.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out NurRehberi.apk hizali.apk
          "$BT/apksigner" verify NurRehberi.apk
          rm -f nur.jks

      - name: Sürüm bilgisi
        id: v
        run: |
          echo "surum=$(node -p "require('./apk.json').surum")" >> "$GITHUB_OUTPUT"
          node -p "require('./version.json').notlar || ''" > notlar.txt

      - name: Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.surum }}
          name: Nur Rehberi ${{ steps.v.outputs.surum }}
          body_path: notlar.txt
          files: NurRehberi.apk
          make_latest: true
