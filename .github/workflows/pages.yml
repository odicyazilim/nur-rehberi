name: Web uygulaması ve güncelleme bilgisi

# main dalına her gönderimde iPhone/web uygulaması ile version.json ve icerik.json GitHub Pages'te yayınlanır.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/build-www.mjs
      - name: Uygulama içi güncelleme paketi
        run: |
          KOD=$(node -p "require('./version.json').kod")
          (cd www && zip -qr ../nur-$KOD.zip . -x 'guncelleme/*')
          mkdir -p www/guncelleme && mv nur-$KOD.zip www/guncelleme/
          ls -la www/guncelleme
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
