const HIKAYE=[
{t:"Hz. Âdem'in Yaratılışı",k:"Peygamberler",src:"Bakara 30-37; A'râf 11-25; Tâhâ 115-122",ders:"Kibir insanı Allah'ın rahmetinden uzaklaştırır; hata yapan kul tövbe ederse Allah onu bağışlar.",
p:["Allah, yeryüzünde bir halife yaratacağını meleklere bildirdi. Sonra Hz. Âdem'i topraktan yarattı, ona ruh verdi ve bütün varlıkların isimlerini öğretti.",
"Allah meleklere, Âdem'e saygı için secde etmelerini emretti. Bütün melekler hemen secde etti. Yalnız İblis, ben ateşten yaratıldım, o ise topraktan diyerek kibirlendi ve secde etmedi. Bu kibri yüzünden Allah'ın rahmetinden kovuldu.",
"Hz. Âdem ve eşi Havva cennete yerleştirildi. Allah onlara cennetin bütün nimetlerinden yiyebileceklerini, yalnız bir ağaca yaklaşmamalarını söyledi. Şeytan ise onları kandırmak için fısıldayıp durdu ve sonunda o ağaçtan yemelerini sağladı.",
"Hz. Âdem ve Havva yaptıkları hatayı anlayınca çok pişman oldular ve şöyle dua ettiler: Rabbimiz, biz kendimize zulmettik. Eğer bizi bağışlamaz ve bize merhamet etmezsen, mutlaka kaybedenlerden oluruz.",
"Allah, Âdem'e öğrettiği sözlerle tövbesini kabul etti. Çünkü O, tövbeleri çokça kabul eden ve çok merhametli olandır. Sonra onlar yeryüzüne indirildi ve insanlığın hayatı böylece yeryüzünde başladı."]},
{t:"Hz. Nûh ve Büyük Gemi",k:"Peygamberler",src:"Hûd 25-48; Ankebût 14; Nûh suresi",ders:"Doğru yolda sabırla ve kararlılıkla durmak gerekir; kurtuluş soyla değil, iman ve salih amelle olur.",
p:["Hz. Nûh, kavmini yalnız Allah'a ibadet etmeye çağıran bir peygamberdi. Kur'an, onun kavmi arasında dokuz yüz elli yıl kaldığını bildirir. Bu uzun zaman boyunca gece gündüz, açıktan ve gizliden insanları hakka davet etti.",
"Kavminin ileri gelenleri ona inanmadı, alay ettiler. Ona sadece en zayıf ve yoksul insanların uyduğunu söyleyip küçümsediler. Pek az kişi iman etti.",
"Allah, Hz. Nûh'a kendi gözetimi altında bir gemi yapmasını emretti. Hz. Nûh gemiyi yaparken kavminin ileri gelenleri yanından geçtikçe onunla alay ediyorlardı. O ise sabırla işine devam etti.",
"Allah'ın emri gelince gökten sağanak yağmurlar yağdı, yerden sular fışkırdı. Hz. Nûh, iman edenleri ve her canlıdan birer çifti gemiye aldı. Gemi dağlar gibi dalgalar arasında yüzüyordu.",
"Hz. Nûh'un oğlu gemiye binmedi; ben beni sudan koruyacak bir dağa sığınırım dedi. Babası ona, bugün Allah'ın emrinden koruyacak hiçbir şey yoktur dedi. Aralarına dalga girdi ve oğlu boğulanlardan oldu.",
"Sonunda sular çekildi ve gemi Cûdî dağının üzerine oturdu. Hz. Nûh ve onunla birlikte iman edenler esenlik ve bereketle gemiden indiler."]},
{t:"Hz. İbrâhim ve Ateş",k:"Peygamberler",src:"Enbiyâ 51-70; Sâffât 83-98",ders:"Hak uğruna cesur olmak ve her durumda Allah'a güvenmek gerekir; Allah'ın izni olmadan hiçbir şey zarar veremez.",
p:["Hz. İbrâhim, putlara tapan bir toplumun içinde büyüdü. Gençliğinde babasına ve kavmine, tapmakta olduğunuz bu heykeller de ne oluyor diye sordu. Onlar da babalarını bunlara tapar bulduklarını söylediler.",
"Bir gün kavmi şehrin dışına çıkınca Hz. İbrâhim tapınağa girdi ve büyükleri dışındaki bütün putları kırdı.",
"Kavmi dönünce tanrılarına bunu kimin yaptığını sordu. Hz. İbrâhim getirildi ve ona, bunu sen mi yaptın dediler. O da, eğer konuşabiliyorlarsa bunu şu büyükleri yapmış olmalı, onlara sorun dedi.",
"Kavmi bir an durup düşündü; putların konuşamayacağını biliyorlardı. Hz. İbrâhim onlara, Allah'ı bırakıp size ne fayda ne de zarar verebilecek şeylere mi tapıyorsunuz dedi.",
"Buna rağmen kibirlerinden vazgeçmediler ve onu yakmaya karar verdiler. Büyük bir ateş yakıp Hz. İbrâhim'i içine attılar. O anda Allah, ey ateş, İbrâhim'e karşı serin ve selametli ol buyurdu.",
"Ateş, Hz. İbrâhim'i yakmadı. Onu tuzağa düşürmek isteyenler, büyük bir hüsrana uğrayanlar oldular."]},
{t:"Hz. İbrâhim, Hz. İsmâil ve Kurban",k:"Peygamberler",src:"Sâffât 99-111",ders:"Allah'a tam teslimiyet ve O'nun emrine sabır; kurban ibadetinin özü budur.",
p:["Hz. İbrâhim, Allah'tan salih bir evlat istemişti. Allah ona yumuşak huylu bir oğul, Hz. İsmâil'i müjdeledi.",
"Hz. İsmâil babasıyla birlikte koşup yürüyecek yaşa gelince, Hz. İbrâhim ona şöyle dedi: Yavrum, rüyamda seni kurban ettiğimi görüyorum. Bir düşün, ne dersin?",
"Hz. İsmâil teslimiyetle cevap verdi: Babacığım, sana ne emrediliyorsa onu yap. İnşallah beni sabredenlerden bulacaksın.",
"İkisi de Allah'ın emrine boyun eğdi. Hz. İbrâhim oğlunu alnı üzerine yatırdığında Allah ona seslendi: Ey İbrâhim, rüyana sadakat gösterdin. İşte biz iyileri böyle mükâfatlandırırız. Bu gerçekten açık bir imtihandı.",
"Allah, Hz. İsmâil'in yerine büyük bir kurbanlık gönderdi. Bu olay, sonraki nesiller arasında güzel bir hatıra olarak bırakıldı. Kurban Bayramı'nda kesilen kurbanlar, bu teslimiyeti hatırlatır."]},
{t:"Hz. Yûsuf'un Sabrı",k:"Peygamberler",src:"Yûsuf suresi",ders:"Sabır, iffet ve affedicilik; Allah sabredenlerin sonunu güzel kılar.",
p:["Hz. Yûsuf küçük bir çocukken rüyasında on bir yıldızın, güneşin ve ayın kendisine secde ettiğini gördü. Babası Hz. Yâkub, bu rüyayı kardeşlerine anlatmamasını söyledi.",
"Kardeşleri, babalarının Yûsuf'u daha çok sevdiğini düşünerek onu kıskandılar. Bir gün onu oyun bahanesiyle dışarı götürüp bir kuyuya bıraktılar. Akşam ağlayarak babalarına gelip onu kurdun yediğini söylediler. Hz. Yâkub ise, bana düşen güzel bir sabırdır dedi.",
"Oradan geçen bir kervan Hz. Yûsuf'u kuyudan çıkardı ve Mısır'da sattı. Onu satın alan vezir, eşine ona iyi bakmasını söyledi. Hz. Yûsuf büyüyünce vezirin eşi ona kötülük teklif etti; o ise Allah'a sığınarak bunu reddetti.",
"Suçsuz olduğu hâlde zindana atıldı. Zindanda arkadaşlarının rüyalarını yorumladı ve onlara Allah'ın birliğini anlattı. Yıllar sonra Mısır hükümdarı bir rüya gördü: yedi zayıf ineğin yedi semiz ineği yediğini. Bu rüyayı Hz. Yûsuf yorumladı: yedi bolluk yılından sonra yedi kıtlık yılı gelecekti.",
"Hükümdar onu zindandan çıkardı ve ülkenin hazinelerinin başına getirdi. Kıtlık yıllarında kardeşleri yiyecek almak için Mısır'a geldi. Hz. Yûsuf onları tanıdı ama onlar onu tanımadı.",
"Sonunda Hz. Yûsuf kendini tanıttı. Kardeşleri utanıp özür dilediler. O ise, bugün size hiçbir kınama yok, Allah sizi bağışlasın dedi. Ailesi Mısır'a geldi ve çocukken gördüğü rüya böylece gerçek oldu."]},
{t:"Hz. Mûsâ ve Denizin Yarılması",k:"Peygamberler",src:"Kasas 7-13; Tâhâ 9-79; Şuarâ 52-68",ders:"Allah'a tevekkül eden kimseyi Allah yalnız bırakmaz; zulüm sonunda yıkılır.",
p:["Firavun, İsrailoğullarına zulmediyor, doğan erkek çocukları öldürtüyordu. Hz. Mûsâ doğunca Allah annesine, onu emzir; başına bir şey gelmesinden korkarsan onu suya bırak ve üzülme diye ilham etti.",
"Annesi onu bir sandığa koyup nehre bıraktı. Sandık Firavun'un sarayına ulaştı. Firavun'un eşi onu evlat edinmek istedi. Hz. Mûsâ hiçbir sütanneyi kabul etmedi; sonunda Allah'ın takdiriyle kendi annesine geri verildi.",
"Hz. Mûsâ büyüdü. Yıllar sonra Tûr dağının yanında Allah onunla konuştu ve onu peygamber olarak seçti. Elindeki asâ yere atınca yılana dönüşüyor, eli koynundan bembeyaz çıkıyordu. Allah onu kardeşi Hz. Hârûn ile birlikte Firavun'a gönderdi.",
"Firavun, açık mucizeleri görmesine rağmen inanmadı ve büyüklük tasladı. Hz. Mûsâ, Allah'ın emriyle İsrailoğullarını geceleyin Mısır'dan çıkardı. Firavun ve ordusu onları takip etti.",
"Denizin kıyısına geldiklerinde İsrailoğulları, yakalandık dediler. Hz. Mûsâ ise, asla, Rabbim benimledir, bana yol gösterecektir dedi. Allah ona asâsını denize vurmasını emretti. Deniz ikiye yarıldı ve her parçası büyük bir dağ gibi oldu.",
"Hz. Mûsâ ve beraberindekiler kurtuldu. Peşlerinden denize giren Firavun ve ordusu ise sular kapanınca boğuldu."]},
{t:"Hz. Yûnus ve Balık",k:"Peygamberler",src:"Enbiyâ 87-88; Sâffât 139-148; Kalem 48-50",ders:"Zor anda Allah'a yönelip hatayı kabul etmek kurtuluşa vesile olur; Allah samimi duaya cevap verir.",
p:["Hz. Yûnus, Ninova halkına gönderilmiş bir peygamberdi. Kavmi uzun süre ona inanmayınca, öfkeyle onları bırakıp yola çıktı.",
"Bir gemiye bindi. Gemi denizin ortasında tehlikeye düştü ve yolcular arasında kura çekildi. Kura Hz. Yûnus'a çıktı ve o denize atıldı.",
"Allah'ın emriyle büyük bir balık onu yuttu. Hz. Yûnus, balığın karnının karanlığında Rabbine şöyle yalvardı: Lâ ilâhe illâ ente sübhâneke innî küntü mine'z-zâlimîn. Yani: Senden başka ilah yoktur. Seni bütün eksikliklerden tenzih ederim. Ben gerçekten kendine yazık edenlerden oldum.",
"Allah onun duasını kabul etti ve onu sıkıntıdan kurtardı. Balık onu kıyıya bıraktı. Hz. Yûnus hasta ve bitkin hâldeydi. Allah onun yanında bir kabak bitkisi bitirdi ve gölgesinde dinlendi.",
"Bu arada kavmi de iman etmişti. Hz. Yûnus onların yanına döndü. Kur'an, işte biz müminleri böyle kurtarırız buyurur."]},
{t:"Hz. Eyyûb'un Sabrı",k:"Peygamberler",src:"Enbiyâ 83-84; Sâd 41-44",ders:"Musibet anında şikâyet etmeden sabretmek ve yalnız Allah'a yalvarmak; sabrın sonu rahmettir.",
p:["Hz. Eyyûb, Allah'ın kendisine bol mal ve evlat verdiği salih bir peygamberdi. Bir gün ağır bir imtihanla karşılaştı: malını ve evlatlarını kaybetti, uzun süren bir hastalığa yakalandı.",
"Bütün bu sıkıntılara rağmen Hz. Eyyûb isyan etmedi. Sabretti ve yalnızca Rabbine yöneldi.",
"Sonunda edeple şöyle dua etti: Bu dert beni sardı. Sen merhametlilerin en merhametlisisin.",
"Allah onun duasını kabul etti ve ona, ayağını yere vur dedi. Oradan serin bir su çıktı; bu su hem yıkanacak hem içilecek bir şifaydı. Hz. Eyyûb bu suyla iyileşti.",
"Allah ona ailesini ve onların bir mislini daha verdi. Kur'an, onu ne güzel bir kul, daima Allah'a yönelen biri olarak över ve sabrın örneği olarak anar."]},
{t:"Ashâb-ı Kehf: Mağara Arkadaşları",k:"Kur'an Kıssaları",src:"Kehf 9-26",ders:"İnancı korumak için Allah'a sığınan gençleri Allah korur; geleceğe dair işlerde inşallah demeyi unutmamak gerekir.",
p:["Bir zamanlar, insanların putlara taptığı bir şehirde, Rablerine iman etmiş bir grup genç vardı. Kavimleri onları inançlarından döndürmek isteyince bir mağaraya sığındılar ve şöyle dua ettiler: Rabbimiz, bize katından bir rahmet ver ve işimizde bize doğru yolu kolaylaştır.",
"Allah onları mağarada uzun yıllar uyuttu. Güneş doğarken mağaralarının sağından, batarken solundan geçiyor, onlara dokunmuyordu. Köpekleri de mağaranın girişinde ön ayaklarını uzatmış yatıyordu.",
"Yıllar sonra Allah onları uyandırdı. Birbirlerine ne kadar uyuduklarını sordular. Bir gün ya da günün bir kısmı kadar dediler. İçlerinden birini parayla şehre yiyecek almaya gönderdiler ve dikkatli olmasını tembihlediler.",
"Böylece insanlar, Allah'ın vaadinin gerçek olduğunu ve kıyametin geleceğinde şüphe olmadığını öğrendiler. Kur'an, onların mağarada üç yüz yıl kaldığını ve buna dokuz yıl eklediklerini bildirir.",
"Bu kıssanın sonunda Allah, Peygamberimize ve bize şunu öğütler: Hiçbir şey için, bunu yarın yapacağım deme; ancak Allah dilerse de."]},
{t:"Fil Ordusu",k:"Kur'an Kıssaları",src:"Fîl suresi; Kureyş suresi",ders:"Allah, evini ve kullarını korur; güç ve kalabalık Allah'ın iradesine karşı bir şey ifade etmez.",
p:["Peygamberimizin doğduğu yıl, Yemen'i yöneten Ebrehe adında bir komutan, Kâbe'yi yıkmak için büyük bir orduyla Mekke'ye doğru yola çıktı. Ordusunun önünde filler vardı.",
"Mekke halkı bu büyük orduya karşı koyacak güçte değildi. Kâbe'nin sahibinin onu koruyacağını söyleyerek şehrin çevresindeki dağlara çekildiler.",
"Ordu Mekke'ye yaklaştığında Allah onların üzerine sürü sürü kuşlar gönderdi. Bu kuşlar onlara pişirilmiş çamurdan taşlar atıyordu.",
"Kur'an, Allah'ın onları yenilmiş ekin yaprağı gibi yaptığını bildirir. Kâbe'yi yıkmaya gelen ordu, hiçbir şey yapamadan yok oldu.",
"Bu olayın yaşandığı yıla Fil Yılı denir. Aynı yıl Mekke'de Peygamberimiz Hz. Muhammed dünyaya geldi."]},
{t:"Hicret: Mekke'den Medine'ye",k:"Peygamberimizin Hayatı",src:"Tevbe 40; Enfâl 30; Buhârî, Menâkıbü'l-Ensâr",ders:"Tevekkül, sadakat ve kardeşlik; Allah'a güvenen hiçbir zaman yalnız değildir.",
p:["Mekkeli müşrikler, Müslümanlara yıllarca baskı yaptılar. Sonunda Peygamberimizi öldürmek için bir plan kurdular. Allah bu tuzağı Peygamberine bildirdi ve ona hicret izni verdi.",
"Peygamberimiz, en yakın arkadaşı Hz. Ebû Bekir ile birlikte gece Mekke'den ayrıldı. Takipçilerden korunmak için Sevr dağındaki bir mağarada üç gün kaldılar.",
"Müşrikler mağaranın ağzına kadar geldiler. Hz. Ebû Bekir, Peygamberimiz için endişelendi. Peygamberimiz ona şöyle dedi: Üzülme, şüphesiz Allah bizimledir. Allah onlara huzur indirdi ve takipçiler onları göremeden geri döndü.",
"Yolculuk zorlu bir çöl yolunda günlerce sürdü. Medineliler her sabah şehrin dışına çıkıp yolunu gözlüyordu. Peygamberimiz Medine'ye ulaştığında büyük bir sevinçle karşılandı.",
"Medine'de Mekke'den göç eden muhacirlerle onlara kucak açan ensar kardeş ilan edildi. Bu hicret, 622 yılında gerçekleşti ve İslam takviminin başlangıcı oldu."]},
{t:"Ağlayan Hurma Kütüğü",k:"Peygamberimizin Hayatı",src:"Buhârî, Menâkıb; Buhârî, Cuma",ders:"Peygamberimize duyulan sevgi; onun merhameti her şeyi kuşatır.",
p:["Mescid-i Nebevî'nin ilk yıllarında bir minber yoktu. Peygamberimiz hutbe okurken bir hurma kütüğüne yaslanırdı.",
"Cemaat çoğalınca Peygamberimiz için ahşaptan bir minber yapıldı. Bir Cuma günü Peygamberimiz hutbe okumak için minbere çıktı.",
"O anda yaslandığı hurma kütüğünden, ayrılık acısı çeken bir yavrunun sesi gibi bir inleme duyuldu. Mescitteki sahâbîler bu sesi duydular.",
"Peygamberimiz minberden indi, kütüğün yanına gelip elini üzerine koydu ve onu kucakladı. Kütük, susturulan bir çocuk gibi yavaş yavaş sakinleşti.",
"Peygamberimiz, kütüğün eskiden yanında okunan zikri duyamadığı için ağladığını bildirdi. Bu olay, sahih hadis kaynaklarında anlatılır ve Peygamberimize duyulan sevginin güzel bir örneği olarak hatırlanır."]},
{t:"Hz. Süleyman ve Karınca",k:"Peygamberler",src:"Neml 15-19",ders:"Nimetlere şükretmek ve en küçük canlıya bile saygı göstermek; güç sahibi olmak alçak gönüllülüğü gerektirir.",
p:["Allah, Hz. Süleyman'a büyük bir saltanat ve ilim vermişti. O, kuşların dilini anlıyordu. İnsanlardan, cinlerden ve kuşlardan oluşan bir ordusu vardı.",
"Bir gün ordusuyla birlikte bir vadiden geçiyordu. O vadide yaşayan bir karınca, diğer karıncalara şöyle seslendi: Ey karıncalar, yuvalarınıza girin. Süleyman ve ordusu farkında olmadan sizi ezmesin.",
"Hz. Süleyman karıncanın sözünü duydu ve gülümsedi. Kendisine verilen bu nimetler karşısında şöyle dua etti:",
"Rabbim, bana ve anne babama verdiğin nimete şükretmemi ve razı olacağın salih ameller işlememi bana ilham et. Rahmetinle beni salih kullarının arasına kat.",
"Bu kıssa, büyük bir hükümdarın küçücük bir karıncanın sözüne kulak verdiğini ve bütün gücüne rağmen Allah'a şükürle yöneldiğini anlatır."]},
{"t": "Ashâb-ı Kehf (Mağara Arkadaşları)", "k": "Kur'an'da Adı Geçen Velî Şahsiyetler", "src": "Kehf 9-26; TDV İslâm Ansiklopedisi, \"Ashâb-ı Kehf\" maddesi", "ders": "İman uğruna gösterilen sabır ve sadakat karşılıksız kalmaz; Allah, kendisine sığınanları korur.", "p": ["Ashâb-ı Kehf, mağara arkadaşları demektir. Kur'an-ı Kerim'de Kehf sûresinde anlatılan bu gençler, putperest bir hükümdarın zulmü altında yaşayan ve tek olan Allah'a iman eden kimselerdi.", "Halkları putlara tapıyor, iman edenlere baskı yapıyordu. Gençler kavimlerinin karşısına dikilerek, Rabbimiz göklerin ve yerin Rabbidir, O'ndan başkasına asla ilah demeyiz dediler. Allah da onların kalplerini sağlamlaştırdı ve hidayetlerini artırdı.", "İnançlarını korumak için şehirden ayrılıp bir mağaraya sığındılar ve şöyle dua ettiler: Rabbimiz, bize katından bir rahmet ver ve içinde bulunduğumuz durumdan bize bir çıkış yolu hazırla.", "Allah onları mağarada uzun yıllar uyuttu. Kur'an'a göre mağarada üç yüz yıl kaldılar, buna dokuz yıl daha eklediler. Bu süre boyunca Allah onları sağa sola çeviriyor, köpekleri de mağaranın girişinde ön ayaklarını uzatmış bekliyordu.", "Uyandıklarında ancak bir gün ya da bir günün bir kısmı kadar uyuduklarını sandılar. İçlerinden birini gümüş parayla şehre yiyecek almaya gönderdiler. Böylece insanlar onları gördü ve Allah'ın vaadinin, yani öldükten sonra dirilişin gerçek olduğunu anladılar.", "Kur'an onların sayısını tartışmayı gereksiz bulur ve sayılarını en iyi Allah'ın bildiğini bildirir. Mağaranın yeri hakkında da Efes, Tarsus ve Afşin gibi farklı görüşler vardır."], "hiz": ["Zulme ve baskıya rağmen tevhid inancından taviz vermediler.", "Dinlerini korumak için yurtlarını terk etmeyi göze aldılar.", "Uyanışları, öldükten sonra dirilişin Allah için kolay olduğunun açık bir delili oldu."]},
{"t": "Hızır (a.s.)", "k": "Kur'an'da Adı Geçen Velî Şahsiyetler", "src": "Kehf 60-82; Buhârî, \"İlim\" ve \"Enbiyâ\" bölümleri; TDV İslâm Ansiklopedisi, \"Hızır\" maddesi", "ders": "Her olayın hikmetini hemen anlayamayabiliriz; Allah'ın takdirine güvenmek ve ilim öğrenirken sabırlı olmak gerekir.", "p": ["Kur'an-ı Kerim'de adı verilmeden, katımızdan kendisine bir rahmet verdiğimiz ve tarafımızdan bir ilim öğrettiğimiz kullarımızdan bir kul diye anılan zat, hadislerde Hızır olarak isimlendirilir. Kendisine verilen bu özel bilgiye ledün ilmi denir.", "Peygamberimiz, ona Hızır denmesinin sebebini şöyle açıklar: Kuru bir yere oturmuştu; kalktığında orası yemyeşil olmuştu. Hızır kelimesi de yeşillik anlamıyla ilgilidir.", "Hz. Mûsâ, Allah'ın kendisinden daha bilgili bir kulu olduğunu öğrenince onunla buluşmak için yola çıktı. İki denizin birleştiği yerde onu buldu ve ona öğretilenden kendisine de öğretmesi için ona uymak istediğini söyledi. Hızır, benimle beraber olmaya sabredemezsin dedi; Hz. Mûsâ ise sabredeceğine söz verdi.", "Yolculukta Hızır, bindikleri gemiyi deldi, karşılaştıkları bir çocuğu öldürdü ve kendilerine yiyecek vermeyen bir şehirde yıkılmak üzere olan bir duvarı karşılıksız olarak düzeltti. Hz. Mûsâ her seferinde dayanamayıp itiraz etti.", "Sonunda Hızır bunların hikmetini açıkladı: Gemi, sağlam gemilere zorla el koyan bir hükümdardan kurtulsun diye kusurlu hale getirilmişti. Çocuk büyüyünce mümin anne babasını azgınlığa ve inkâra sürükleyecekti. Duvarın altında ise iki yetim çocuğun hazinesi vardı ve babaları salih bir insandı. Hızır, bunları kendi isteğiyle yapmadığını söyledi.", "Âlimler, Hızır'ın peygamber mi yoksa velî mi olduğu konusunda farklı görüşler ileri sürmüştür. Hâlâ hayatta olup olmadığı da tartışılmıştır; bu konuda kesin bir delil yoktur."], "hiz": ["Allah'ın verdiği ilmi, Hz. Mûsâ gibi büyük bir peygambere öğretmekle görevlendirildi.", "Olayların görünen yüzünün ardında ilahi bir hikmet bulunduğunu yaşayarak gösterdi.", "Mazlumu korudu ve yetimin hakkını gözetti."]},
{"t": "Hz. Meryem", "k": "Kur'an'da Adı Geçen Velî Şahsiyetler", "dl": "Hayatından öğrendiklerimiz", "src": "Âl-i İmrân 35-47; Meryem 16-34; Tahrîm 12; Buhârî, \"Enbiyâ\"; Müslim, \"Fezâilü's-sahâbe\"", "ders": "Allah'a samimiyetle bağlanan kul, en zor anlarda bile O'nun yardımına ve rızkına kavuşur.", "p": ["Hz. Meryem, İmrân ailesinden gelir. Annesi, hamileyken karnındaki çocuğu Allah'a adamış, onu Beytülmakdis'te ibadete ve hizmete vermeyi dilemişti. Doğan kız çocuğuna Meryem adını verdi; onu ve soyunu kovulmuş şeytanın şerrinden Allah'a emanet etti.", "Allah, Meryem'i güzel bir şekilde kabul etti ve onun bakımını Hz. Zekeriyyâ'ya verdi. Hz. Zekeriyyâ, onun ibadet ettiği mihraba her girişinde yanında yiyecek bulurdu. Bunun nereden geldiğini sorunca Meryem, bu Allah katındandır; Allah dilediğine hesapsız rızık verir derdi.", "Melekler ona şöyle seslendi: Ey Meryem, Allah seni seçti, seni tertemiz kıldı ve seni dünya kadınlarına üstün kıldı. Ey Meryem, Rabbine itaat et, secde et ve rükû edenlerle birlikte rükû et.", "Sonra Allah ona bir melek gönderdi ve kendisine tertemiz bir oğul bağışlanacağını müjdeledi. Meryem, bana hiçbir insan dokunmamışken nasıl çocuğum olabilir diye sordu. Melek, Rabbin böyle buyurdu; bu O'nun için kolaydır dedi. Böylece Hz. İsa babasız olarak dünyaya geldi.", "Doğum sancısı onu bir hurma ağacının dibine götürdü. Allah, ayağının altından bir su akıttı ve hurma ağacını sarsınca üzerine taze hurmalar dökülmesini sağladı. Halkının ithamlarına karşı konuşmama orucu tuttu ve beşikteki bebeği işaret etti. Hz. İsa beşikte konuşarak, ben Allah'ın kuluyum dedi ve annesinin temizliğini ortaya koydu.", "Hz. Meryem, Kur'an-ı Kerim'de adı açıkça geçen tek kadındır ve bir sûre onun adını taşır. Peygamberimiz, dünya kadınlarının en hayırlıları arasında Hz. Meryem'i ve Hz. Hatice'yi saymıştır."], "hiz": ["Hayatını çocukluğundan itibaren ibadete ve Allah'a kulluğa adadı.", "İffeti ve teslimiyetiyle bütün müminlere örnek gösterildi.", "Ağır ithamlar karşısında sabretti ve Allah'a güvendi.", "Bir peygamber olan Hz. İsa'yı büyüttü."]},
{"t": "Zülkarneyn", "k": "Kur'an'da Adı Geçen Velî Şahsiyetler", "src": "Kehf 83-98; TDV İslâm Ansiklopedisi, \"Zülkarneyn\" maddesi", "ders": "Güç ve imkân Allah'ın emanetidir; onu adaletle ve tevazu içinde kullanan, Allah katında değer kazanır.", "p": ["Zülkarneyn, iki boynuz sahibi anlamına gelir. Kur'an-ı Kerim'de Kehf sûresinde anlatılan bu zat, Allah'ın yeryüzünde iktidar ve her şeye ulaşma imkânı verdiği, adaletle hükmeden salih bir hükümdardır. Bu ismin, doğu ile batıya ulaşmasından ya da başka sebeplerden dolayı verildiği söylenir.", "Zülkarneyn önce batıya doğru yola çıktı. Güneşin battığı yere varınca onu kara balçıklı bir suda batıyor gördü ve orada bir kavim buldu. Allah ona bu kavim hakkında serbestlik tanıdı. O da zulmedeni cezalandıracağını, iman edip salih amel işleyene ise iyilikle karşılık vereceğini ve ona kolaylık göstereceğini söyledi.", "Ardından doğuya yöneldi. Güneşin doğduğu yere varınca, güneşe karşı kendilerine bir siper yapılmamış bir kavimle karşılaştı.", "Sonra iki dağ arasına ulaştı. Orada neredeyse hiç söz anlamayan bir kavim buldu. Bu insanlar ona, Ye'cûc ve Me'cûc'un yeryüzünde bozgunculuk yaptığını söyleyerek kendileriyle onlar arasına bir set yapmasını istediler ve karşılığında vergi vermeyi teklif ettiler.", "Zülkarneyn, Rabbimin bana verdiği imkânlar sizin vereceğinizden daha hayırlıdır diyerek ücret almadı ve sadece iş gücüyle yardım etmelerini istedi. Demir kütlelerini iki dağın arasına yığdırdı, körüklerle kızdırdı ve üzerine erimiş bakır döktü. Ye'cûc ve Me'cûc bu seddi ne aşabildi ne de delebildi.", "Bu büyük işi tamamlayınca kendini övmedi ve şöyle dedi: Bu, Rabbimden bir rahmettir. Rabbimin vaadi gelince O, bunu yerle bir eder; Rabbimin vaadi haktır.", "Zülkarneyn'in kim olduğu ve peygamber olup olmadığı konusunda farklı görüşler vardır. Kur'an ise onun kimliğinden çok örnek ahlakını öne çıkarır."], "hiz": ["Kendisine verilen gücü zulüm için değil, adaleti sağlamak için kullandı.", "Zalimi cezalandırdı, iman edip iyilik yapanı ödüllendirdi.", "Zayıf bir kavmi korumak için karşılık beklemeden büyük bir set inşa etti.", "Başarısını kendine değil, Allah'ın rahmetine bağladı."]},
{"t": "Mevlânâ Celâleddîn-i Rûmî", "k": "Anadolu'nun Büyük Velîleri", "dl": "Hayatından öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Mevlânâ Celâleddîn-i Rûmî\" maddesi", "ders": "Gerçek ilim insanı tevazuya ve sevgiye götürür; ilahi aşk, Kur'an ve sünnet yolunda olgunlaşır.", "p": ["Mevlânâ Celâleddîn-i Rûmî, 1207 yılında bugünkü Afganistan sınırları içindeki Belh şehrinde doğdu. Babası, devrin büyük âlimlerinden olan ve Sultânü'l-ulemâ, yani âlimlerin sultanı diye anılan Bahâeddin Veled'dir.", "Moğol tehlikesi sebebiyle ailesi Belh'ten ayrıldı. Hac yolculuğunun ardından bir süre Lârende'de, yani bugünkü Karaman'da kaldılar. Mevlânâ burada Gevher Hatun ile evlendi. Selçuklu Sultanı Alâeddin Keykubad'ın daveti üzerine aile Konya'ya yerleşti.", "Babasının vefatından sonra onun talebesi Seyyid Burhâneddin Muhakkık-ı Tirmizî'den tasavvuf terbiyesi aldı. Halep ve Şam'da tahsilini ilerletti. Konya'ya dönerek medresede ders veren ve vaaz eden büyük bir âlim oldu.", "1244 yılında Şems-i Tebrîzî ile karşılaşması hayatında yeni bir dönemin başlangıcı oldu. Bu buluşmadan sonra derin bir ilahi aşkla şiirler söylemeye başladı. Şems'in ortadan kaybolmasından sonra da bu aşkı eserlerine yansıttı.", "En büyük eseri Mesnevî'dir. Altı ciltten ve yirmi beş binden fazla beyitten oluşan bu eser, Mevlânâ'nın söyleyip talebesi Hüsâmeddin Çelebi'nin yazmasıyla ortaya çıktı. Âyet ve hadislerden ilham alan hikâyelerle insanı nefsini terbiye etmeye ve Allah'a yaklaşmaya davet eder. Dîvân-ı Kebîr, Fîhi Mâ Fîh ve Mektûbât da onun eserleridir.", "Kendisine nispet edilen bir rubaide, yaşadıkça Kur'an'ın kulu ve Hz. Muhammed'in yolunun toprağı olduğunu söyler. Bu sözler, onun tasavvuf anlayışının Kur'an ve sünnete dayandığını gösterir.", "Mevlânâ, 17 Aralık 1273'te Konya'da vefat etti. Ölümü sevgiliye kavuşma olarak gördüğü için bu geceye Şeb-i Arûs, yani düğün gecesi denir. Vefatından sonra oğlu Sultan Veled, onun yolunu Mevlevîlik adıyla teşkilatlandırdı."], "hiz": ["Konya'da medrese hocalığı ve vaazlarıyla halkı dinî ilimlerle aydınlattı.", "Mesnevî ile Kur'an ve hadis hikmetlerini herkesin anlayacağı hikâyelere dönüştürdü.", "Sevgi, hoşgörü ve tevazuyu öne çıkararak farklı kesimlerden insanların gönlünü İslam'a ısındırdı.", "Yetiştirdiği talebeler ve Mevlevîlik geleneği yoluyla asırlar boyunca ilim, sanat ve edep kültürüne katkıda bulundu."]},
{"t": "Yunus Emre", "k": "Anadolu'nun Büyük Velîleri", "dl": "Hayatından öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Yunus Emre\" maddesi", "ders": "Gönül kırmamak, sevgiyle yaklaşmak ve dünyaya aldanmamak, Allah'a yakınlığın yoludur.", "p": ["Yunus Emre, 13. yüzyılın ikinci yarısı ile 14. yüzyılın başlarında Anadolu'da yaşamış büyük bir Türk mutasavvıf ve şairidir. Bir yazma eserdeki kayda göre 1320 yılında, seksen iki yaşında vefat etmiştir; buna göre 1240 civarında doğduğu düşünülür.", "Hayatı hakkındaki bilgiler sınırlıdır ve çoğu menkıbelere dayanır. Sakarya ırmağı çevresinde, özellikle Sivrihisar bölgesinde yaşadığı kabul edilir. Pek çok yerde onun adına türbe ve makam bulunması, halkın ona duyduğu sevginin bir göstergesidir.", "Bir menkıbeye göre Yunus, kıtlık yıllarında buğday istemek için Hacı Bektaş-ı Velî'nin dergâhına gitti. Buğday yerine manevi feyiz teklif edilince önce buğdayı tercih etti, sonra pişman olarak geri döndü. Kendisine Tapduk Emre'nin kapısı gösterildi ve yıllarca onun dergâhına odun taşıyarak hizmet etti. Bu anlatı tarihî bir belge değil, halk arasında yaşayan bir menkıbedir.", "Yunus Emre, şeyhi Tapduk Emre'nin yanında olgunlaştı. Şiirlerinde şeyhine olan bağlılığını sık sık dile getirir.", "Yunus'un en büyük farkı, ilahi aşkı ve tasavvufun derin anlamlarını, halkın konuştuğu sade Türkçe ile anlatmasıdır. Divan'ı ve 1307 yılında tamamladığı Risâletü'n-Nushiyye adlı öğüt kitabı günümüze ulaşmıştır.", "Şiirlerinde Allah sevgisini, insan sevgisini, gönül kırmamayı, dünyaya bağlanmamayı ve ölümü hatırlamayı işler. Onun ilahileri yüzyıllardır camilerde, tekkelerde ve evlerde okunmaktadır."], "hiz": ["Tasavvufi düşünceyi sade Türkçe ile halka ulaştırdı ve İslam'ın Anadolu'da gönüllere yerleşmesine katkıda bulundu.", "İlahileriyle Allah ve Peygamber sevgisini nesilden nesile aktardı.", "Risâletü'n-Nushiyye ile nefsin kötü huylarına karşı güzel ahlakı öğütledi.", "Türkçenin bir edebiyat ve din dili olarak gelişmesine büyük katkı sağladı."]},
{"t": "Hacı Bektaş-ı Velî", "k": "Anadolu'nun Büyük Velîleri", "dl": "Hayatından öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Hacı Bektaş-ı Velî\" maddesi", "ders": "Eline, diline ve beline sahip olmak; yani haram kazançtan, kötü sözden ve iffetsizlikten uzak durmak, olgun insanın alametidir.", "p": ["Hacı Bektaş-ı Velî, 13. yüzyılda Horasan'dan Anadolu'ya gelen Türkmen dervişlerinden biridir. Moğol istilası sırasında doğudan batıya göç eden dervişler arasında yer aldığı kabul edilir. Doğum tarihi bilinmemekle birlikte, 1271 yılı civarında vefat ettiği düşünülmektedir.", "Anadolu'ya geldikten sonra bugünkü Nevşehir'in Hacıbektaş ilçesi olan Sulucakarahöyük'e yerleşti. Burada Türkmen halkı arasında yaşadı ve onlara manevi rehberlik yaptı.", "Hayatı hakkında bilinenlerin büyük bölümü, vefatından yaklaşık iki yüz yıl sonra yazılan Vilâyetnâme adlı menkıbe kitabına dayanır. Bu eserde tarihî bilgilerle menkıbeler iç içedir.", "Kendisine atfedilen Makâlât adlı eser, insanın olgunlaşmasını dört kapı ve kırk makam şeklinde anlatır. Bu kapılar şeriat, tarikat, marifet ve hakikattir. Eserin ona ait olup olmadığı tartışmalı olsa da asırlardır onun öğretisi olarak okunmaktadır.", "Halk arasında ona nispet edilen eline, diline, beline sahip ol öğüdü; dürüstlüğü, sözüne dikkat etmeyi ve iffeti özetler.", "Onun adıyla anılan Bektaşîlik, kendisinden yaklaşık iki buçuk asır sonra, 16. yüzyılın başında Balım Sultan tarafından teşkilatlandırılmıştır. Türbesi bugün Hacıbektaş'ta ziyaret edilmektedir."], "hiz": ["Göçebe Türkmenler arasında yaşayarak onlara İslam'ın ahlak ilkelerini anlattı.", "Anadolu'da Türk halkının yurt tutması ve kaynaşmasında manevi bir önder oldu.", "Sevgiye, kardeşliğe ve nefis terbiyesine dayanan öğütler bıraktı."]},
{"t": "Hacı Bayrâm-ı Velî", "k": "Anadolu'nun Büyük Velîleri", "dl": "Hayatından öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Hacı Bayrâm-ı Velî\" maddesi", "ders": "İlim ile ahlak bir araya geldiğinde insan hem kendine hem topluma faydalı olur; helal kazanç, kulluğun temelidir.", "p": ["Hacı Bayrâm-ı Velî, 14. yüzyılın ilk yarısında Ankara'da, Çubuk çayı kenarındaki Solfasol köyünde doğdu. Kesin doğum tarihi bilinmez. Bazı kaynaklar asıl adının Numan olduğunu kaydeder.", "Dinî ilimleri tahsil etti. Bazı kaynaklara göre Ankara'daki Kara Medrese'de müderrislik yaptı. Daha sonra devrin büyük şeyhi Somuncu Baba'ya bağlanarak tasavvuf yoluna girdi.", "Rivayete göre şeyhine bir Kurban Bayramı'nda bağlandığı için kendisine Bayram adı verildi. Somuncu Baba ile birlikte hacca gitti ve dönüşünden sonra Hacı Bayram diye anılmaya başlandı.", "Şeyhinin vefatından sonra Ankara'ya döndü ve burada çiftçilik yaparak geçimini sağladı. Kendi alın teriyle kazandığı rızıkla yaşadı. Ankara ve çevresinde kurduğu Bayramiyye yolu kısa sürede geniş kitlelere yayıldı.", "Etkisi o kadar arttı ki Sultan İkinci Murad onu Edirne'ye davet etti. Görüşmeden sonra padişah ona ve dervişlerine saygı gösterdi; rivayete göre dervişleri vergiden muaf tutuldu.", "Yetiştirdiği talebeler arasında, Fatih Sultan Mehmed'in hocası Akşemseddin ve Muhammediye'nin yazarı Yazıcıoğlu Mehmed gibi büyük şahsiyetler sayılır. Sade Türkçe ile söylediği birkaç şiiri günümüze ulaşmıştır.", "1430 yılında Ankara'da vefat etti ve kendi adını taşıyan caminin yanına defnedildi. Türbesi bugün Ankara'nın en çok ziyaret edilen manevi mekânlarındandır."], "hiz": ["Medrese ilmini tasavvuf terbiyesiyle birleştirerek ilim ve ahlakı birlikte öğretti.", "Bayramiyye yolunu kurarak Anadolu'da manevi hayatı canlandırdı.", "Alın teriyle geçinmeyi ve halka hizmeti öğütledi.", "Akşemseddin gibi İstanbul'un fethine manevi katkı sağlayan talebeler yetiştirdi."]},
{"t": "Somuncu Baba (Şeyh Hâmid-i Velî)", "k": "Anadolu'nun Büyük Velîleri", "dl": "Hayatından öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Somuncu Baba\" maddesi", "ders": "Gerçek ilim ve fazilet gösterişe ihtiyaç duymaz; tevazu ve gizli hizmet, insanı Allah katında yüceltir.", "p": ["Somuncu Baba, Şeyh Hâmid-i Velî ya da Hamîdüddîn-i Aksarâyî olarak da bilinir. Kaynakların çoğu onu Kayserili olarak gösterir; Aksaray'da doğduğunu söyleyenler de vardır. Doğum tarihi kesin olarak bilinmemektedir.", "İlk manevi terbiyesini babası Şeyh Şemseddin Mûsâ'dan aldı. Şam'da dinî ilimleri öğrendi, ardından Erdebil'de Alâeddin Erdebîlî'nin yanında tasavvuf eğitimini tamamladı. Şeyhinin işaretiyle Anadolu'ya dönerek Bursa'ya yerleşti.", "Bursa'da kendini gizleyerek yaşadı. Ormandan topladığı odunlarla ekmek pişirir, bu ekmekleri eşeğine yükleyip sokak sokak dolaşarak halka dağıtırdı. Bu sırada somunlar müminler diye seslendiği rivayet edilir. Somuncu Baba lakabı buradan gelir.", "Yıldırım Bayezid'in yaptırdığı Bursa Ulu Camii açıldığında, Emir Sultan onu padişaha tanıttı ve ilk Cuma hutbesini okumasını önerdi. Somuncu Baba bu hutbede Fâtiha sûresini yedi farklı şekilde tefsir etti. Devrin büyük âlimi Molla Fenârî'nin bu ilim karşısında hayran kalarak ona bağlandığı rivayet edilir.", "Bu olaydan sonra tanınmaktan kaçınarak Bursa'dan ayrıldı. Kayseri ve Aksaray'da talebe yetiştirdi. En büyük halifesi Hacı Bayrâm-ı Velî'dir.", "1412 yılında vefat etti. Eski kaynaklar onun Aksaray'da vefat edip orada defnedildiğini yazar. Malatya'nın Darende ilçesinde de onun adıyla anılan bir türbe ve külliye bulunmaktadır."], "hiz": ["Bursa Ulu Camii'nde okuduğu ilk hutbe ile ilmin ve tevazunun birleştiği bir örnek oldu.", "Hacı Bayrâm-ı Velî gibi Anadolu'nun manevi hayatına yön veren talebeler yetiştirdi.", "Ekmek dağıtarak halka hizmet etti; şöhretten kaçmayı ve gizli iyiliği öğretti."]},
{"t": "Azîz Mahmud Hüdâyî", "k": "Anadolu'nun Büyük Velîleri", "dl": "Hayatından öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Azîz Mahmud Hüdâyî\" maddesi", "ders": "Makam ve mevki geçicidir; nefsini terbiye eden ve halka hizmet eden kişi, gönüllerde kalıcı bir yer edinir.", "p": ["Azîz Mahmud Hüdâyî, 1541 yılında Şereflikoçhisar'da doğdu. İlk tahsilini Sivrihisar'da yaptı. Ardından İstanbul'a giderek Küçük Ayasofya Medresesi'nde okudu ve hocası Nâzırzâde Ramazan Efendi'nin yardımcısı oldu.", "Bir süre Mısır'da bulundu ve orada tasavvuf terbiyesi de aldı. Dönüşte Bursa'da müderris ve kadı yardımcısı olarak görev yaptı. Ancak Bursa'da Üftâde Hazretleri ile tanışması hayatını değiştirdi.", "Resmî görevlerini bırakarak Üftâde'ye bağlandı. Menkıbeye göre nefsini terbiye etmek için Bursa çarşısında ciğer sattı. Yaklaşık üç yıl süren eğitimin sonunda şeyhi ona hilafet verdi.", "Üsküdar'a yerleşerek 1595 yılında tamamlanan dergâhını kurdu. Buradan Celvetiyye yolunu yaydı. İstanbul'un çeşitli camilerinde yıllarca vaaz verdi.", "Sultan Birinci Ahmed ona büyük saygı gösterir, mektuplarla öğütlerini alırdı. Sultanahmet Camii'nin 1616 yılındaki açılışında ilk hutbeyi o okudu.", "Câmiu'l-fezâil adlı eseri ile ilahilerini topladığı Divan'ı en bilinen eserleridir. Divan'ında iki yüz elliyi aşkın ilahi bulunur. 1628 yılında Üsküdar'da vefat etti ve dergâhının yanındaki türbesine defnedildi."], "hiz": ["Celvetiyye yolunu kurarak halkın arasında yaşayan, toplumdan kopmayan bir tasavvuf anlayışını yaydı.", "İstanbul camilerinde verdiği vaazlarla halkı yıllarca irşat etti.", "Padişaha öğütler vererek adaletin ve din hizmetinin korunmasına katkıda bulundu.", "Üsküdar'da kurduğu dergâh asırlarca ilim ve irfan merkezi oldu.", "İlahileriyle dinî musikiye ve edebiyata zengin bir miras bıraktı."]},
{"t": "Veysel Karânî (Üveys el-Karânî)", "k": "Büyük Tasavvuf Önderleri", "dl": "Hayatından öğrendiklerimiz", "src": "Müslim, \"Fezâilü's-sahâbe\" 223-225; TDV İslâm Ansiklopedisi, \"Veysel Karânî\" maddesi", "ders": "Anne babaya iyilik ve samimi bir kalp, insanı Allah ve Resulü katında yüceltir; Peygamberimizi görmeyen bile onun sevgisine kavuşabilir.", "p": ["Veysel Karânî'nin asıl adı Üveys b. Âmir'dir. Yemen'de, Murâd kabilesinin Karen koluna mensuptur. Peygamberimiz hayattayken Müslüman oldu, fakat onu göremedi.", "Peygamberimizi görmeyi çok istiyordu; ancak yaşlı annesine bakmak zorundaydı ve onu yalnız bırakamadı. Rivayete göre annesinden kısa bir izin alarak Medine'ye geldi; fakat Peygamberimiz o gün evinde değildi ve Üveys, annesine verdiği söz gereği onu göremeden geri döndü.", "Peygamberimiz, ashabına Üveys'i haber vermiştir. Müslim'in Sahih'inde yer alan rivayete göre şöyle buyurdu: Yemen'den Üveys b. Âmir adında biri gelecek. Onda bir hastalık vardı; bir dirhem kadar yer dışında iyileşti. Annesine çok iyilik eder. Allah adına yemin etse Allah onun yeminini yerine getirir. Eğer onun senin için bağışlanma dilemesini sağlayabilirsen bunu yap. Bir başka rivayette de tâbiîlerin en hayırlısının Üveys olduğunu bildirmiştir.", "Hz. Ömer, halifeliği döneminde Yemen'den gelen kafilelere Üveys'i sordu ve sonunda onu buldu. Peygamberimizin sözünü hatırlatarak ondan kendisi için dua etmesini istedi; o da dua etti. Hz. Ömer, Kûfe valisine onun için mektup yazmayı teklif etti; fakat Üveys, halkın arasında tanınmadan sade bir hayat yaşamayı tercih etti.", "Rivayete göre Peygamberimiz, vefatından önce hırkasının Üveys'e verilmesini istemiş, Hz. Ömer ile Hz. Ali de bu emaneti ona ulaştırmıştır. Bu hırka olarak kabul edilen Hırka-i Şerif, bugün İstanbul'daki Hırka-i Şerif Camii'nde muhafaza edilmekte ve Ramazan ayında ziyarete açılmaktadır.", "Veysel Karânî'nin 657 yılında Sıffîn Savaşı'nda Hz. Ali'nin safında şehit düştüğü kabul edilir. Kabrinin yeri kesin olarak bilinmemektedir; Siirt'in Baykan ilçesi başta olmak üzere birçok yerde onun adına makam bulunmaktadır."], "hiz": ["Annesine olan bağlılığıyla, anne babaya iyiliğin en güzel örneklerinden biri oldu.", "Peygamberimizi görmeden ona derin bir sevgiyle bağlandı ve Peygamber sevgisinin sembolü haline geldi.", "Hz. Ömer gibi büyük bir sahabinin bile duasını istediği takva sahibi bir kul oldu.", "Şöhretten kaçarak ihlas ve tevazu ile yaşadı."]},
{"t": "Abdülkādir-i Geylânî", "k": "Büyük Tasavvuf Önderleri", "dl": "Hayatından öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Abdülkādir-i Geylânî\" maddesi", "ders": "Doğruluk, insanın hem kendisini hem çevresini kurtarır; ilim ve takva bir araya geldiğinde kalpler ihya olur.", "p": ["Abdülkādir-i Geylânî, 1077 yılında Hazar Denizi'nin güneyindeki Geylan bölgesinde doğdu. Soyunun Hz. Hasan'a dayandığı kabul edilir. Gençliğinde ilim tahsili için dönemin en önemli ilim merkezi olan Bağdat'a gitti.", "Bir menkıbeye göre yolculuk sırasında kafilesi eşkıyanın saldırısına uğradı. Annesinin, asla yalan söyleme öğüdünü tutarak eşkıyaya üzerindeki parayı açıkça söyledi. Onun bu doğruluğu karşısında eşkıya reisinin ve adamlarının tövbe ettiği anlatılır.", "Bağdat'ta fıkıh, hadis ve tefsir okudu; Hanbelî mezhebinde büyük bir fakih oldu. Tasavvuf terbiyesini Hammâd ed-Debbâs'tan, hırkasını ise Ebû Saîd el-Muharrimî'den aldı. Hocası Muharrimî'nin medresesini devralarak burada ders vermeye başladı.", "Vaazları o kadar etkiliydi ki medrese genişletilmek zorunda kalındı. Rivayete göre birçok gayrimüslim onun sohbetlerinde Müslüman oldu, pek çok günahkâr da tövbe etti.", "el-Fethu'r-Rabbânî, Fütûhu'l-gayb ve el-Gunye adlı eserlerinde Kur'an ve sünnete bağlılığı, ihlası, tevekkülü ve nefis terbiyesini anlatır. Hayatı boyunca şeriata uymayı tasavvufun temeli saydı.", "1166 yılında Bağdat'ta vefat etti ve medresesine defnedildi. Onun yolu Kādiriyye adıyla bütün İslam dünyasına yayıldı. Kendisine Gavs-ı Âzam ve dini canlandıran anlamında Muhyiddin gibi lakaplar verilmiştir."], "hiz": ["Bağdat'taki medresesinde fıkıh, hadis ve tefsir okutarak binlerce talebe yetiştirdi.", "Etkili vaazlarıyla insanları tövbeye ve güzel ahlaka çağırdı.", "Tasavvufu Kur'an ve sünnete bağlı kalarak öğretti.", "Kendisinden sonra yayılan Kādiriyye yolu, İslam'ın Afrika'dan Asya'ya kadar geniş bölgelere ulaşmasına katkıda bulundu."]},
{"t": "İmam-ı Rabbânî", "k": "Büyük Tasavvuf Önderleri", "dl": "Hayatından öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"İmâm-ı Rabbânî\" maddesi", "ders": "Hakkı savunmak cesaret ister; ilim ve ihlasla yapılan mücadele, zor şartlarda bile dini aslına döndürebilir.", "p": ["İmam-ı Rabbânî'nin asıl adı Ahmed Fârûkī Sirhindî'dir. 1564 yılında Hindistan'ın Sirhind şehrinde doğdu. Soyu Hz. Ömer'e dayandığı için Fârûkī nisbesiyle anılır.", "İlk eğitimini âlim olan babası Abdülehad'dan aldı. Kur'an'ı ezberledi; tefsir, hadis, fıkıh ve kelam ilimlerinde derinleşti. Daha sonra Delhi'de Nakşibendî şeyhi Muhammed Bâkībillâh'a bağlandı ve kısa sürede onun halifesi oldu.", "Yaşadığı dönemde Bâbürlü hükümdarı Ekber Şah, farklı dinleri karıştırarak Dîn-i İlâhî adıyla yeni bir inanç oluşturmaya çalışıyordu. Bu durum İslam'ın özünü tehlikeye sokuyordu. İmam-ı Rabbânî, devlet adamlarına ve âlimlere yazdığı mektuplarla Kur'an ve sünnete dönülmesi için büyük bir mücadele başlattı.", "Hükümdar Cihangir döneminde, padişaha secde etmeyi reddettiği için Gwalior kalesinde hapsedildi. Hapiste de mahkûmlara İslam'ı anlattı. Serbest bırakıldıktan sonra da tebliğine devam etti ve sarayda bile etkili oldu.", "Onun mektupları Mektûbât adıyla üç cilt halinde toplanmıştır. Bu eser, Ehl-i sünnet inancını, şeriata bağlılığı ve tasavvufun sünnet ölçüsü içinde yaşanmasını anlatır ve İslam dünyasında asırlardır okunmaktadır.", "Hicrî ikinci bin yılın yenileyicisi anlamında Müceddid-i Elf-i Sânî diye anılır. Onun yolu Müceddidiyye adıyla yayıldı. 1624 yılında Sirhind'de vefat etti."], "hiz": ["Ekber Şah döneminde bozulmaya yüz tutan dinî hayatın yeniden Kur'an ve sünnete dönmesi için mücadele etti.", "Devlet adamlarına yazdığı mektuplarla yönetimde İslam'ın korunmasına çalıştı.", "Hapsedilmeyi göze alarak hak bildiği yoldan taviz vermedi.", "Mektûbât ile Ehl-i sünnet inancını ve sünnete bağlı tasavvuf anlayışını sonraki nesillere aktardı.", "Müceddidiyye yolu ile Hindistan'dan Osmanlı topraklarına kadar geniş bir coğrafyada etkili oldu."]},
{"t": "Evliya Çelebi'nin Hayatı ve Rüyası", "k": "Evliya Çelebi Seyahatnamesi", "dl": "Hayatından öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Evliya Çelebi\" maddesi", "ders": "Merak, ilim ve sebat bir araya gelince bir insanın emeği asırlar boyunca nesillere ışık tutar.", "p": ["Evliya Çelebi, kendi anlattığına göre 25 Mart 1611'de İstanbul'un Unkapanı semtinde doğdu. Babası, sarayın kuyumcubaşısı Derviş Mehmed Zıllî Efendi'dir. Annesi ise Abaza asıllıdır.", "Yaklaşık yedi yıl medresede okudu ve hocası Evliya Mehmed Efendi'den Kur'an'ı ezberledi. Babasından hat sanatını öğrendi, musiki dersleri aldı. Daha sonra Sultan Dördüncü Murad'a takdim edildi ve sarayda Enderun'da eğitimine devam etti.", "1630 yılının Aşure gecesi, İstanbul'daki Ahî Çelebi Camii'nde bir rüya gördü. Rüyasında Peygamberimizi gördü ve heyecanından şefaat yâ Resûlallah diyecekken seyahat yâ Resûlallah dedi. Peygamberimiz tebessüm ederek ona hem şefaati, hem seyahati, hem de ziyareti müjdeledi. Rüyada bulunan sahâbî Sa'd bin Ebû Vakkas da ona gördüklerini yazmasını tavsiye etti.", "Kasımpaşa Mevlevîhânesi şeyhi Abdullah Dede bu rüyayı yorumladı ve ona önce İstanbul'u gezip yazmasını öğütledi. Böylece hayatı boyunca sürecek büyük yolculuk başladı.", "Evliya Çelebi yaklaşık elli yıl boyunca Osmanlı topraklarını ve komşu ülkeleri dolaştı. Gördüğü şehirleri, camileri, türbeleri, insanları, dilleri ve gelenekleri on ciltlik Seyahatnâme'sinde anlattı. Ölüm tarihi ve yeri kesin olarak bilinmemektedir; 1684 yılı civarında vefat ettiği tahmin edilir.", "Seyahatnâme'nin asıl nüshaları bugün İstanbul'daki Topkapı Sarayı Müzesi Kütüphanesi'nde bulunur. Eser, on yedinci yüzyıl dünyasını anlatan en zengin kaynaklardan biridir."]},
{"t": "Seyahatname 1. Cilt: İstanbul", "k": "Evliya Çelebi Seyahatnamesi", "dl": "Bu ciltten öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Evliya Çelebi\" maddesi; Seyahatnâme, 1. cilt", "ders": "Bir şehri tanımak, onun insanını, emeğini ve manevi mirasını tanımakla mümkündür.", "p": ["Birinci cilt tamamen İstanbul'a ayrılmıştır. Evliya Çelebi, rüyasının yorumunda kendisine verilen öğüdü tutarak işe doğduğu şehirden başladı.", "Bu ciltte İstanbul'un tarihini, fethini, selâtin camilerini, türbelerini, medreselerini, çarşılarını ve semtlerini ayrıntılı biçimde anlatır. Eyüp Sultan başta olmak üzere şehrin manevi mekânlarını da tek tek tanıtır.", "Ciltte yer alan esnaf alayı bölümü özellikle meşhurdur. Burada İstanbul'daki yüzlerce meslek grubunu, esnafın pîrlerini ve geleneklerini sıralar. Bu bölüm, Osmanlı şehir hayatını anlamak için eşsiz bir kaynaktır."]},
{"t": "Seyahatname 2. Cilt: Bursa, Karadeniz, Girit ve Kafkasya", "k": "Evliya Çelebi Seyahatnamesi", "dl": "Bu ciltten öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Evliya Çelebi\" maddesi; Seyahatnâme, 2. cilt", "ders": "Yolculuk, insanın farklı coğrafyaları ve kültürleri tanıyarak ufkunu genişletmesini sağlar.", "p": ["İkinci ciltte Evliya Çelebi, İstanbul'dan çıkarak Bursa ve İzmit'i gezer. Ardından Karadeniz kıyısını takip ederek Bartın, Amasra, İnebolu, Sinop, Bafra, Samsun, Giresun ve Trabzon'u anlatır.", "Bu ciltte Gürcistan ve Abaza ülkesine yaptığı yolculuklar da yer alır. Ayrıca Girit seferine katılır ve Hanya'nın fethini kendi gözleriyle anlatır.", "Cildin son bölümlerinde Erzurum ve Amasya başta olmak üzere Orta ve Kuzey Anadolu'daki pek çok şehri tanıtır."]},
{"t": "Seyahatname 3. Cilt: Şam, Anadolu ve Rumeli", "k": "Evliya Çelebi Seyahatnamesi", "dl": "Bu ciltten öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Evliya Çelebi\" maddesi; Seyahatnâme, 3. cilt", "ders": "Şam'dan Edirne'ye uzanan bu yolculuk, Osmanlı coğrafyasının genişliğini ve çeşitliliğini gözler önüne serer.", "p": ["Üçüncü cilt İznik'ten başlar ve yolculuk Suriye'ye uzanır. Evliya Çelebi bu ciltte Şam'ı, Yafa'yı, Lût Gölü'nü ve Gazze'yi anlatır.", "Ardından Anadolu'ya döner; Kayseri, Sivas, Muş, Harput ve Bingöl gibi şehirleri tanıtır.", "Cildin son kısmında Balkanlara ve Tuna boyundaki şehirlere geçer ve yolculuğunu Edirne'de tamamlar."]},
{"t": "Seyahatname 4. Cilt: Doğu Anadolu ve İran", "k": "Evliya Çelebi Seyahatnamesi", "dl": "Bu ciltten öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Evliya Çelebi\" maddesi; Seyahatnâme, 4. cilt", "ders": "Farklı halkların gelenekleri, ortak bir medeniyetin zenginliğini oluşturur.", "p": ["Dördüncü ciltte Evliya Çelebi, Diyarbekir, Mardin, Bitlis ve Van gibi Doğu ve Güneydoğu Anadolu şehirlerini anlatır.", "Bitlis'te uzun süre kalır ve buranın yöneticisi Abdal Han ile ilgili gözlemlerini aktarır. Van'ın kalesini, camilerini ve halkını da ayrıntılı biçimde tanıtır.", "Cildin devamında İran'a geçer; Tebriz, Hemedan ve Kirmanşah gibi şehirleri anlatır."]},
{"t": "Seyahatname 5. Cilt: Bağdat'tan Lehistan'a", "k": "Evliya Çelebi Seyahatnamesi", "dl": "Bu ciltten öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Evliya Çelebi\" maddesi; Seyahatnâme, 5. cilt", "ders": "Tarih, olayları yaşayan ve kaydeden insanların tanıklığıyla günümüze ulaşır.", "p": ["Beşinci ciltte Evliya Çelebi, İran'dan Bağdat'a gider ve Siirt ile Tokat üzerinden geri döner.", "Ardından Karadeniz ve Tuna boyundaki şehirleri dolaşır, Lehistan seferine katılır. Ukrayna ve Prut bölgesini de bu ciltte anlatır.", "Sultan Dördüncü Mehmed ile birlikte bir Anadolu yolculuğuna çıkar. Bu ciltte dönemin Celâlî olaylarına, Ege ve Balkan şehirlerine dair gözlemleri de yer alır."]},
{"t": "Seyahatname 6. Cilt: Erdel, Macaristan ve Balkanlar", "k": "Evliya Çelebi Seyahatnamesi", "dl": "Bu ciltten öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Evliya Çelebi\" maddesi; Seyahatnâme, 6. cilt", "ders": "Bir milletin geçmişini anlamak için bıraktığı eserleri ve izleri tanımak gerekir.", "p": ["Altıncı cilt, Köse Ali Paşa komutasındaki Erdel seferi ile başlar.", "Evliya Çelebi bu ciltte Sırbistan, Macaristan ve Romanya topraklarındaki şehirleri, kaleleri ve halkları anlatır.", "Seferlerdeki gözlemlerinin yanında bu bölgelerdeki cami, köprü ve kale gibi Osmanlı eserlerini de kaydeder."]},
{"t": "Seyahatname 7. Cilt: Viyana, Kırım ve Kafkasya", "k": "Evliya Çelebi Seyahatnamesi", "dl": "Bu ciltten öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Evliya Çelebi\" maddesi; Seyahatnâme, 7. cilt", "ders": "Farklı dilleri ve kültürleri merakla öğrenmek, insanlar arasında köprüler kurar.", "p": ["Yedinci ciltte Evliya Çelebi, Kanije ve Belgrad'ı anlattıktan sonra Kara Mehmed Paşa'nın elçilik heyetiyle Viyana'ya gider ve şehri ayrıntılı biçimde tanıtır.", "Ardından Budin, Temeşvar, Eflak ve Boğdan üzerinden yolculuğuna devam eder.", "Cildin son bölümlerinde Kazak ülkesi, Kırım, Dağıstan ve Kafkas halkları yer alır. Bu halkların dillerinden örnekler de kaydeder."]},
{"t": "Seyahatname 8. Cilt: Kırım, Girit ve Arnavutluk", "k": "Evliya Çelebi Seyahatnamesi", "dl": "Bu ciltten öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Evliya Çelebi\" maddesi; Seyahatnâme, 8. cilt", "ders": "Sabırla sürdürülen bir gayret, uzun yıllar sonra bile meyvesini verir.", "p": ["Sekizinci ciltte Evliya Çelebi, Azak'tan Kefe'ye ve Bahçesaray'a gider, oradan İstanbul'a döner.", "Ardından Girit seferine katılır ve Kandiye'nin fethini anlatır.", "Cildin devamında Arnavutluk ve Makedonya şehirlerini dolaşır ve Edirne üzerinden geri döner."]},
{"t": "Seyahatname 9. Cilt: Hac Yolculuğu", "k": "Evliya Çelebi Seyahatnamesi", "dl": "Bu ciltten öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Evliya Çelebi\" maddesi; Seyahatnâme, 9. cilt", "ders": "Hac, Müslümanların her yerden gelerek Allah'ın huzurunda kardeşçe buluştuğu büyük bir ibadettir.", "p": ["Dokuzuncu cilt, Evliya Çelebi'nin hac yolculuğunu anlatır. Hacca çıkmadan önce Eyüp Sultan'ı ziyaret ettiğini kaydeder.", "İstanbul'dan Mekke ve Medine'ye uzanan bu yolculukta Batı ve Güney Anadolu şehirlerini, ardından Suriye'yi anlatır.", "Yolculuğunun sonunda Mekke'ye ve Medine'ye ulaşır. Kâbe'yi ve Peygamberimizin kabrinin bulunduğu Mescid-i Nebevî'yi ziyaret eder, hac ibadetini ve kutsal mekânları anlatır."]},
{"t": "Seyahatname 10. Cilt: Mısır, Sudan ve Habeşistan", "k": "Evliya Çelebi Seyahatnamesi", "dl": "Bu ciltten öğrendiklerimiz", "src": "TDV İslâm Ansiklopedisi, \"Evliya Çelebi\" maddesi; Seyahatnâme, 10. cilt", "ders": "Bir ömür boyu süren emek, insanlığa kalıcı bir miras bırakır.", "p": ["Onuncu ve son cilt tamamen Mısır'a, Nil kıyılarına, Sudan'a ve Habeşistan'a ayrılmıştır.", "Evliya Çelebi bu ciltte Kahire'yi, camilerini, medreselerini, Nil nehrini ve çevresindeki şehirleri ayrıntılı biçimde anlatır.", "Hayatının son yıllarını Mısır'da geçirdiği düşünülür. Bu cilt, büyük seyyahın uzun yolculuğunun son durağıdır."]},
{"t": "Mağaraya Kapanan Üç Kişi", "k": "Peygamberimizin Anlattığı İbretli Rivayetler", "src": "Buhârî, Edeb; Buhârî, Enbiyâ; Müslim, Zikir", "ders": "Sıkıntı anında samimiyetle yapılmış salih ameller vesilesiyle Allah'a dua etmek meşrudur. Anne babaya iyilik, iffet ve emanete sadakat kurtuluşa vesiledir.", "p": ["Peygamberimiz, önceki ümmetlerden üç kişinin başından geçen bir olayı anlattı. Bu üç kişi yolculuk sırasında yağmura yakalandı ve bir mağaraya sığındı. Dağdan yuvarlanan büyük bir kaya mağaranın ağzını kapattı.", "Birbirlerine, sadece Allah rızası için yaptığımız salih amellerimizi anarak dua edelim, dediler.", "Birincisi şöyle dua etti: Allah'ım! Yaşlı anne babam vardı. Her akşam sütü önce onlara içirirdim. Bir gece geç kaldım, onları uyumuş buldum. Çocuklarım ayaklarımın dibinde açlıktan ağlarken, anne babamdan önce kimseye içirmek istemedim. Elimde süt kabıyla sabaha kadar uyanmalarını bekledim. Bunu senin rızan için yaptıysam bu kayayı aç. Kaya biraz aralandı, fakat çıkılacak kadar değil.", "İkincisi şöyle dua etti: Allah'ım! Çok sevdiğim bir amcamın kızı vardı. Ondan haram bir istekte bulundum, kabul etmedi. Darlığa düştüğü bir yıl bana geldi, ona para verdim. Tam istediğime kavuşacakken bana, Allah'tan kork, dedi. Ben de ondan ve verdiğim altınlardan vazgeçip uzaklaştım. Bunu senin rızan için yaptıysam bu sıkıntıyı gider. Kaya biraz daha aralandı.", "Üçüncüsü şöyle dua etti: Allah'ım! İşçiler çalıştırmıştım. Biri ücretini almadan gitti. Ben onun ücretini işlettim, çoğaldı ve büyük bir servete dönüştü. Yıllar sonra geldi ve ücretini istedi. Gördüğün bu develer, sığırlar, koyunlar ve çobanlar senin ücretindendir, dedim. Hepsini alıp götürdü, hiçbir şey bırakmadı. Bunu senin rızan için yaptıysam bizi kurtar. Kaya tamamen açıldı ve üçü de mağaradan çıktılar."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Yüz Kişiyi Öldüren Adamın Tövbesi", "k": "Peygamberimizin Anlattığı İbretli Rivayetler", "src": "Buhârî, Enbiyâ; Müslim, Tevbe", "ders": "Allah'ın rahmetinden ümit kesilmez. Samimi tövbe eden ve kötü çevresinden uzaklaşıp iyilerin arasına yönelen kul, Allah'ın bağışlamasına kavuşur.", "p": ["Peygamberimiz, önceki ümmetlerden doksan dokuz kişiyi öldürmüş bir adamın kıssasını anlattı. Bu adam pişman oldu ve yeryüzünün en bilgili kişisini sordu. Ona bir âbidi gösterdiler.", "Âbide, doksan dokuz kişiyi öldürdüğünü, tövbesinin kabul edilip edilmeyeceğini sordu. Âbid, hayır, dedi. Adam onu da öldürerek sayıyı yüze tamamladı.", "Sonra yine yeryüzünün en bilgili kişisini sordu. Bu defa ona bir âlimi gösterdiler. Âlim şöyle dedi: Evet, tövbe edebilirsin. Seninle tövbe arasına kim girebilir? Falan yere git. Orada Allah'a ibadet eden insanlar var, onlarla birlikte Allah'a ibadet et. Kendi memleketine dönme, çünkü orası kötü bir yerdir.", "Adam yola çıktı. Yolun yarısına geldiğinde ölüm onu yakaladı. Rahmet melekleri ile azap melekleri onun hakkında tartıştı. Rahmet melekleri, tövbe ederek ve kalbiyle Allah'a yönelerek geldi, dediler. Azap melekleri ise, hiç iyilik yapmadı, dediler.", "İnsan suretinde bir melek geldi ve aralarında hakem oldu: İki yer arasındaki mesafeyi ölçün; hangisine daha yakınsa ondandır. Ölçtüler ve onu gitmek istediği iyi insanların yurduna daha yakın buldular. Böylece rahmet melekleri onu aldı."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Hayvanlara Merhamet: Susuz Köpek ve Hapsedilen Kedi", "k": "Peygamberimizin Anlattığı İbretli Rivayetler", "src": "Buhârî, Müsâkât; Buhârî, Edeb; Müslim, Selâm", "ders": "Her canlıya merhamet etmek ibadettir. Küçük görünen bir iyilik insanı bağışlanmaya, küçük görünen bir zulüm ise azaba götürebilir.", "p": ["Peygamberimiz şöyle anlattı: Bir adam yolda yürürken çok susadı. Bir kuyu buldu, içine inip su içti. Çıktığında bir köpeğin susuzluktan dilini çıkarmış, nemli toprağı yaladığını gördü.", "Adam, bu köpek de benim gibi susamış, dedi. Tekrar kuyuya indi, mestini suyla doldurdu, ağzıyla tutarak yukarı çıktı ve köpeğe su içirdi. Allah onun bu davranışından razı oldu ve onu bağışladı.", "Sahabiler, ey Allah'ın Resulü, hayvanlar için de bize sevap var mı, diye sordular. Peygamberimiz, her canlıya yapılan iyilikte sevap vardır, buyurdu.", "Peygamberimiz bir başka hadisinde de bir kadının, hapsettiği bir kedi yüzünden azaba uğradığını bildirdi. Kadın kediyi bağlamış, ne kendisi yiyecek vermiş ne de onu yeryüzündeki böceklerden yiyip beslenmesi için salıvermişti."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Alaca Hastalıklı, Kel ve Kör", "k": "Peygamberimizin Anlattığı İbretli Rivayetler", "src": "Buhârî, Enbiyâ; Müslim, Zühd", "ders": "Nimetler bir imtihandır. Nimeti verenin Allah olduğunu unutmayan ve ihtiyaç sahibiyle paylaşan kul kazanır; nankörlük ise nimetin elden gitmesine sebep olur.", "p": ["Peygamberimiz, İsrailoğulları'ndan üç kişinin imtihan edildiğini anlattı. Biri alaca hastalığına yakalanmış, biri kel, biri de kördü. Allah onlara bir melek gönderdi.", "Melek önce alacalıya geldi ve en çok neyi istediğini sordu. Güzel bir renk ve güzel bir deri, insanların benden tiksindiği şeyin gitmesi, dedi. Melek onu sıvazladı, hastalığı gitti. Hangi malı istediğini sorunca deve dedi; ona gebe bir deve verildi. Kele de aynı şekilde güzel saç verildi ve gebe bir inek; köre ise gözleri ve gebe bir koyun verildi.", "Zamanla hayvanlar çoğaldı. Birinin bir vadi dolusu devesi, birinin bir vadi dolusu sığırı, birinin de bir vadi dolusu koyunu oldu.", "Melek bu defa eski görünüşlerinde, yolda kalmış fakir bir adam kılığında her birine geldi. Alacalı ve kel olana, sana bu güzel rengi veren Allah adına, yoluma devam etmek için bir deve istiyorum, dedi. İkisi de, haklar çok, diyerek reddetti. Melek, ben seni tanıyor gibiyim, sen fakir ve insanların tiksindiği biri değil miydin, dedi. Bu malı atalarımızdan miras aldık, dediler. Melek, yalan söylüyorsan Allah seni eski hâline döndürsün, dedi.", "Melek en son köre geldi. Kör şöyle dedi: Ben kördüm, Allah gözümü geri verdi; fakirdim, Allah beni zengin etti. Dilediğini al, dilediğini bırak. Allah için aldığın hiçbir şeyde sana zorluk çıkarmayacağım. Melek, malın sende kalsın; siz sadece imtihan edildiniz. Allah senden razı oldu, iki arkadaşına ise gazap etti, dedi."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Âbid Cüreyc", "k": "Peygamberimizin Anlattığı İbretli Rivayetler", "src": "Buhârî, Enbiyâ; Müslim, Birr", "ders": "Anne babanın çağrısına önem vermek gerekir. İffetini koruyan ve Allah'a güvenen kişiyi Allah, iftiralardan temize çıkarır.", "p": ["Peygamberimiz, İsrailoğulları'ndan Cüreyc adında bir âbidi anlattı. Cüreyc ibadet ettiği bir yerde yaşardı. Bir gün o namaz kılarken annesi gelip ona seslendi. Cüreyc, Rabbim, annem mi namazım mı, dedi ve namazına devam etti. Annesi geri döndü.", "Ertesi gün ve daha sonraki gün de aynı şey oldu. Bunun üzerine annesi, Allah'ım, kötü kadınların yüzünü görmeden onu öldürme, diye dua etti.", "İsrailoğulları arasında kötü yola düşmüş bir kadın Cüreyc'i ayartmak istedi; Cüreyc ona yüz vermedi. Kadın bir çobanla birlikte oldu ve bir çocuk doğurdu. Sonra çocuğun Cüreyc'ten olduğunu iddia etti.", "Halk gelip Cüreyc'in ibadet yerini yıktı ve onu dövdü. Cüreyc ne olduğunu sordu, anlattılar. Abdest alıp namaz kıldı. Sonra çocuğun yanına gelip ona, ey çocuk, baban kim, diye sordu. Çocuk, falan çoban, diye cevap verdi.", "Halk pişman oldu, Cüreyc'ten özür diledi ve ibadet yerini altından yapmayı teklif etti. Cüreyc, hayır, eskisi gibi topraktan yapın, dedi."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Bahçesini Bulutun Suladığı Adam", "k": "Peygamberimizin Anlattığı İbretli Rivayetler", "src": "Müslim, Zühd", "ders": "Sadaka malı eksiltmez, aksine bereketlendirir. Kazancını adaletle paylaşan kişiye Allah beklemediği yerden yardım eder.", "p": ["Peygamberimiz şöyle anlattı: Bir adam çölde yürürken bir buluttan, falanın bahçesini sula, diye bir ses işitti.", "Bulut oradan uzaklaşıp taşlık bir yere yağmurunu boşalttı. Suyun bir arkta toplanıp aktığını gördü ve suyu takip etti. Su, bahçesinde küreğiyle suyu yönlendiren bir adamın bahçesine akıyordu.", "Adama adını sordu. Adam, buluttan işittiği ismi söyledi. Bahçe sahibi, neden adımı soruyorsun, dedi. Adam, şu suyu yağdıran bulutta senin adını söyleyen bir ses işittim; bahçende ne yapıyorsun, diye sordu.", "Bahçe sahibi şöyle cevap verdi: Madem bunu söyledin, anlatayım. Bahçeden çıkan ürüne bakarım. Üçte birini sadaka olarak veririm. Üçte birini ailemle birlikte yerim. Üçte birini de bahçeye geri yatırırım."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Hükümdar, Sihirbaz ve İman Eden Genç", "k": "Peygamberimizin Anlattığı İbretli Rivayetler", "src": "Müslim, Zühd; Burûc 4-8", "ders": "Gerçek iman, her türlü baskıya rağmen sebat etmektir. Şifayı veren ve her şeye gücü yeten yalnızca Allah'tır.", "p": ["Peygamberimiz, önceki ümmetlerden bir hükümdarın sihirbazı olduğunu anlattı. Sihirbaz yaşlanınca, bana bir genç gönder de ona sihri öğreteyim, dedi. Hükümdar ona bir genç gönderdi.", "Gencin yolu üzerinde Allah'a ibadet eden bir zat vardı. Genç onun yanına uğramaya, sözlerini dinlemeye başladı ve onlardan çok etkilendi.", "Bir gün büyük bir hayvan insanların yolunu kesti. Genç bir taş alıp, Allah'ım, o zatın yolu sana sihirbazınkinden daha sevimliyse bu hayvanı öldür ki insanlar geçebilsin, dedi ve taşı attı. Hayvan öldü, insanlar geçti. Genç, Allah'ın izniyle hastaları iyileştirmeye başladı ve her seferinde, ben kimseyi iyileştiremem, şifayı veren Allah'tır, derdi.", "Hükümdar bunu duyunca gence işkence etti ve onu öldürmek istedi. Önce dağdan atılmasını emretti; genç dua etti, dağ sarsıldı ve onu götürenler düştü. Sonra denize atılmasını emretti; genç dua etti, gemi alabora oldu, o kurtularak geri döndü.", "Genç hükümdara şöyle dedi: Beni ancak şöyle yaparsan öldürebilirsin: Halkı bir meydanda topla, okumdan bir ok al ve bu gencin Rabbi olan Allah'ın adıyla, diyerek at. Hükümdar böyle yaptı ve genç şehit oldu. Bunu gören halk, gencin Rabbine iman ettik, dedi.", "Hükümdar, iman edenler için hendekler kazdırıp ateş yaktırdı. Mü'minler imanlarından dönmediler. Kur'an-ı Kerim'de Burûc sûresinde hendek sahiplerinin bu zulmü anlatılır."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Bin Dinar ve Denize Atılan Tahta", "k": "Peygamberimizin Anlattığı İbretli Rivayetler", "src": "Buhârî, Kefâlet", "ders": "Allah'ı şahit ve kefil tutarak verilen söz mutlaka yerine getirilmelidir. Emanete sadakat gösterene Allah yardım eder.", "p": ["Peygamberimiz şöyle anlattı: İsrailoğulları'ndan bir adam, bir başkasından bin dinar borç istedi. Borç verecek kişi, şahit getir, dedi. Adam, şahit olarak Allah yeter, dedi. Kefil getir, dedi. Kefil olarak da Allah yeter, dedi. Borç veren, doğru söyledin, diyerek parayı belirli bir süreliğine verdi.", "Borçlu, denize açılıp işini gördü. Borcun vadesi gelince geri dönmek için gemi aradı, fakat bulamadı.", "Bunun üzerine bir tahta aldı, içini oydu. Bin dinarı ve alacaklıya yazdığı bir mektubu içine koydu, ağzını kapattı ve denize gelip şöyle dua etti: Allah'ım, kefil olarak sen yetersin dedim, o da razı oldu; şahit olarak sen yetersin dedim, o da razı oldu. Gemi bulmak için çok uğraştım, bulamadım. Bunu sana emanet ediyorum. Sonra tahtayı denize attı.", "Alacaklı, parasını getirecek bir gemi gelir mi diye sahile çıktı. Gemi yerine dalgaların getirdiği bir tahta buldu ve ailesine yakacak olsun diye aldı. Tahtayı kırınca içinden parayı ve mektubu çıkardı.", "Bir süre sonra borçlu da yanında bin dinarla geldi ve gecikmesinin sebebini anlatarak özür diledi. Alacaklı, bana bir şey gönderdin mi, diye sordu. Borçlu durumu anlatınca alacaklı, Allah senin tahtayla gönderdiğini yerine ulaştırdı, dedi. Borçlu da bin dinarını alarak doğru yolla geri döndü."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "İlk Vahiy: Hira Mağarası", "k": "Peygamberimizin Hayatından", "src": "Buhârî, Bed'ü'l-vahy; Müslim, Îmân; Alak 1-5", "ders": "İslam'ın ilk emri okumaktır. Güzel ahlak sahibi olan, akrabasını gözeten ve muhtaca yardım eden kişiyi Allah utandırmaz.", "p": ["Hz. Âişe'nin anlattığına göre Peygamberimize vahyin başlangıcı, sabah aydınlığı gibi çıkan doğru rüyalarla oldu. Sonra yalnızlık ona sevdirildi. Hira mağarasına çekilir, günlerce orada ibadet ederdi.", "Bir gün mağaradayken melek geldi ve ona, oku, dedi. Peygamberimiz, ben okuma bilmem, diye cevap verdi. Melek onu kucaklayıp sıktı ve bıraktı; bu üç defa tekrarlandı. Sonra şöyle dedi: Yaratan Rabbinin adıyla oku. O, insanı alaktan yarattı. Oku, Rabbin en cömert olandır. O, kalemle öğretendir. İnsana bilmediğini öğretendir.", "Peygamberimiz kalbi titreyerek eşi Hz. Hatice'nin yanına döndü ve, beni örtün, beni örtün, dedi. Korkusu geçince olanı anlattı ve, kendimden korktum, dedi.", "Hz. Hatice ona şöyle dedi: Hayır, vallahi Allah seni asla utandırmaz. Çünkü sen akrabanı gözetirsin, yükü ağır olanın yükünü taşırsın, yoksula verirsin, misafiri ağırlarsın ve hak yolunda karşılaşılan sıkıntılarda yardım edersin.", "Hz. Hatice onu amcasının oğlu Varaka bin Nevfel'e götürdü. Varaka anlatılanları dinleyince, bu, Mûsâ'ya gelen vahiy meleğidir, dedi ve kavminin onu yurdundan çıkaracağı günlerde genç olmayı ne kadar istediğini söyledi."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Taif Dönüşü ve Dağlar Meleği", "k": "Peygamberimizin Hayatından", "src": "Buhârî, Bed'ü'l-halk; Müslim, Cihâd", "ders": "Davette sabır ve merhamet esastır. Peygamberimiz, kendisine eziyet edenler için bile helak değil hidayet dilemiştir.", "p": ["Hz. Âişe bir gün Peygamberimize, Uhud gününden daha ağır bir gün geçirdin mi, diye sordu. Peygamberimiz, kavminden çok sıkıntı çektiğini, en ağırının da Akabe günü olduğunu anlattı.", "O gün Taif'in ileri gelenlerinden İbn Abdiyâlîl'e kendini tanıtıp onu İslam'a davet etmiş, fakat istediği karşılığı bulamamıştı. Büyük bir üzüntüyle yola koyuldu ve ancak Karnü's-seâlib denilen yere varınca kendine geldi.", "Başını kaldırdığında bir bulutun kendisini gölgelediğini gördü. Orada Cebrâil vardı. Cebrâil, Allah'ın kavminin sözlerini işittiğini ve emrine dağlar meleğini gönderdiğini bildirdi.", "Dağlar meleği ona selam verip şöyle dedi: Ey Muhammed, dilersen Mekke'nin iki yanındaki dağları onların üzerine kapatayım.", "Peygamberimiz şöyle cevap verdi: Hayır, ben Allah'ın onların soyundan yalnız Allah'a ibadet eden ve O'na hiçbir şeyi ortak koşmayan kimseler çıkarmasını umarım."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Mescitteki Bedevi", "k": "Peygamberimizin Hayatından", "src": "Buhârî, Vudû; Müslim, Tahâret", "ders": "Öğretirken kolaylaştırmak, sert davranmak yerine yumuşaklıkla yaklaşmak Peygamber ahlakıdır.", "p": ["Bir gün bir bedevi Mescid-i Nebevî'ye geldi ve bilmediği için mescidin bir köşesine küçük abdestini yaptı. Sahabiler hemen ona müdahale etmek için ayağa kalktılar.", "Peygamberimiz, onu bırakın, işini bitirsin, buyurdu. Bedevi işini bitirince bir kova su getirilip oraya dökülmesini emretti.", "Sonra sahabilerine şöyle dedi: Siz kolaylaştırıcı olarak gönderildiniz, zorlaştırıcı olarak gönderilmediniz.", "Peygamberimiz bedeviyi yanına çağırdı ve ona yumuşak bir dille mescitlerin bu tür şeyler için değil, Allah'ı anmak, namaz kılmak ve Kur'an okumak için olduğunu öğretti."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Peygamberimizin Vefatı", "k": "Peygamberimizin Hayatından", "src": "Buhârî, Megâzî; Buhârî, Fezâilü's-sahâbe; Âl-i İmrân 144", "ders": "Her canlı ölümü tadacaktır. Bağlılık, Allah'a ve O'nun dinine olmalıdır; Allah diridir, asla ölmez.", "p": ["Peygamberimiz hastalığının son günlerini Hz. Âişe'nin odasında geçirdi. Hz. Âişe, vefatı sırasında onun başının kendi göğsüne dayalı olduğunu anlatır.", "O sırada Hz. Âişe'nin kardeşi elinde bir misvakla içeri girdi. Peygamberimizin misvaka baktığını gören Hz. Âişe, misvakı yumuşatıp ona verdi; Peygamberimiz de onunla dişlerini temizledi.", "Yanında bir su kabı vardı. Elini suya daldırıp yüzüne sürüyor ve, Lâ ilâhe illallah, ölümün gerçekten sıkıntıları vardır, diyordu. Sonra elini kaldırıp, en yüce dosta, dedi ve ruhunu teslim etti.", "Vefat haberi duyulunca sahabiler büyük bir şaşkınlık yaşadı. Hz. Ebû Bekir gelip şöyle dedi: Kim Muhammed'e ibadet ediyorsa bilsin ki Muhammed vefat etmiştir. Kim Allah'a ibadet ediyorsa bilsin ki Allah diridir, ölmez.", "Ardından şu âyeti okudu: Muhammed ancak bir peygamberdir. Ondan önce de peygamberler gelip geçmiştir. Şimdi o ölür ya da öldürülürse gerisin geri mi döneceksiniz? Sahabiler, bu âyeti sanki ilk defa duyuyormuş gibi dinlediler."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Misafirini Kendine Tercih Eden Aile", "k": "Sahabe ve Ehl-i Beyt'ten", "src": "Buhârî, Menâkıbü'l-Ensâr; Müslim, Eşribe; Haşr 9", "ders": "Kendisi ihtiyaç içinde olsa bile başkasını kendine tercih etmek, Allah'ın sevdiği yüce bir ahlaktır.", "p": ["Bir gün aç bir adam Peygamberimize geldi. Peygamberimiz eşlerinin yanına haber gönderdi; hepsi evde sudan başka bir şey olmadığını bildirdi.", "Peygamberimiz, bu gece bu adamı kim misafir eder, diye sordu. Ensar'dan bir sahabi, ben, ya Resûlallah, dedi ve onu evine götürdü.", "Eşine, Resûlullah'ın misafirine ikram et, dedi. Eşi, çocuklarımızın yiyeceğinden başka bir şeyimiz yok, dedi. Sahabi şöyle dedi: Çocukları bir şeyle oyala, akşam yemeği isterlerse uyut. Misafir gelince lambayı düzeltir gibi yapıp söndür ve ona yiyormuşuz gibi görünelim.", "Böyle yaptılar. Misafir doyuncaya kadar yedi, onlar ise o geceyi aç geçirdiler.", "Sabah olunca sahabi Peygamberimizin yanına gitti. Peygamberimiz, Allah bu gece misafirinize yaptığınızdan hoşnut oldu, buyurdu. Bu olay üzerine Haşr sûresindeki şu âyet indi: Kendileri ihtiyaç içinde olsalar bile onları kendilerine tercih ederler."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Hz. Ebû Bekir'in Bütün Malını Getirmesi", "k": "Sahabe ve Ehl-i Beyt'ten", "src": "Tirmizî, Menâkıb; Ebû Dâvûd, Zekât", "ders": "Allah yolunda cömertlik, Allah'a ve Resulüne güvenin bir göstergesidir. Hayırda yarışmak güzeldir.", "p": ["Hz. Ömer şöyle anlatır: Peygamberimiz bir gün bizlere sadaka vermemizi emretti. O sırada benim malım vardı. Kendi kendime, eğer bir gün Ebû Bekir'i geçeceksem işte o gün bugündür, dedim.", "Malımın yarısını getirdim. Peygamberimiz, ailene ne bıraktın, diye sordu. Bunun kadarını, dedim.", "Hz. Ebû Bekir ise elinde ne varsa hepsini getirdi. Peygamberimiz ona da, ailene ne bıraktın, diye sordu. Hz. Ebû Bekir, onlara Allah'ı ve Resulünü bıraktım, diye cevap verdi.", "Bunun üzerine Hz. Ömer, ben onu hiçbir konuda asla geçemeyeceğim, dedi."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Kâ'b bin Mâlik'in Doğruluğu ve Tövbesi", "k": "Sahabe ve Ehl-i Beyt'ten", "src": "Buhârî, Megâzî; Müslim, Tevbe; Tevbe 117-119", "ders": "Doğruluk kurtuluşa götürür. Hatasını samimiyetle itiraf edip tövbe eden kulun tövbesini Allah kabul eder.", "p": ["Tebük seferi zamanı gelince Kâ'b bin Mâlik hazırlanmayı sürekli erteledi. Nasıl olsa yetişirim, diyordu. Sonunda ordu yola çıktı ve Kâ'b, hiçbir mazereti olmadığı hâlde Medine'de kaldı.", "Peygamberimiz seferden dönünce, geri kalan münafıklar gelip yalan mazeretler söylediler. Kâ'b ise Peygamberimizin huzuruna çıkıp doğruyu söyledi: Vallahi hiçbir mazeretim yoktu.", "Peygamberimiz, bu doğru söyledi; Allah senin hakkında hüküm verinceye kadar kalk, buyurdu. Kâ'b'ın yanında doğruyu söyleyen iki sahabi daha vardı: Mürâre bin Rebî ve Hilâl bin Ümeyye.", "Müslümanların bu üç kişiyle konuşması yasaklandı. Kâ'b için dünya bütün genişliğine rağmen daraldı. Bu sırada Gassan hükümdarından, seni kendi yanımıza davet ediyoruz, diyen bir mektup geldi. Kâ'b, bu da bir imtihan, diyerek mektubu ateşe attı.", "Elli gün sonra bir sabah, sabah namazından sonra Sel' dağının üstünden biri, ey Kâ'b bin Mâlik, müjde, diye seslendi. Allah onların tövbesini kabul etmiş, Tevbe sûresinin âyetleri inmişti.", "Kâ'b şöyle dedi: Allah beni ancak doğru söylediğim için kurtardı. Tövbemin bir parçası olarak, yaşadığım sürece doğrudan başka söz söylemeyeceğim."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
{"t": "Ümmü Süleym'in Sabrı", "k": "Sahabe ve Ehl-i Beyt'ten", "src": "Buhârî, Cenâiz; Müslim, Fezâilü's-sahâbe", "ders": "Evlat da dahil her şey Allah'ın emanetidir. Musibete sabreden ve Allah'a teslim olana Allah daha hayırlısını verir.", "p": ["Ebû Talha ile Ümmü Süleym'in küçük bir oğulları vardı. Çocuk hastalandı. Ebû Talha dışarıdayken çocuk vefat etti.", "Ümmü Süleym, evdekilere, Ebû Talha'ya oğlunun haberini ben söyleyinceye kadar siz söylemeyin, dedi. Ebû Talha eve gelince ona yemek hazırladı ve onu güzelce ağırladı.", "Sonra ona şöyle sordu: Ey Ebû Talha, bir topluluk bir aileye bir emanet verse, sonra emanetini geri istese, onlar bunu vermemezlik edebilir mi? Ebû Talha, hayır, dedi. Ümmü Süleym, öyleyse oğlunu Allah'a emanet bil, dedi.", "Ebû Talha durumu Peygamberimize anlattı. Peygamberimiz, Allah bu gecenizi sizin için mübarek kılsın, diye dua etti.", "Daha sonra onların Abdullah adında bir oğulları oldu. Rivayete göre Abdullah'ın çocuklarının hepsi Kur'an'ı okuyan kimseler oldu."], "dl": "Bu rivayetten öğrendiklerimiz", "r": 1},
