<title>Nur Rehberi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#10231e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Marcellus&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: tek sütun mobil uygulama — üstte sabit başlık, altta sekme çubuğu, ortada kaydırılan içerik */
:root{
  --bg:#f4f6f3; --surface:#ffffff; --surface2:#e9eee9; --line:#d5ddd6;
  --fg:#17231f; --muted:#5d6b65; --accent:#1d6b55; --accent-fg:#ffffff; --gold:#9a7a2c;
  --ok:#2f7d4f; --warn:#b5651d;
  --f-display:"Marcellus","Palatino Linotype",Georgia,serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,system-ui,sans-serif;
  --f-ar:"Amiri Quran","Noto Naskh Arabic","Scheherazade New","Traditional Arabic",serif;
  --ar-size:28px; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1d19; --surface:#152a24; --surface2:#1c352e; --line:#26443b;
  --fg:#ebe6d6; --muted:#9db0a8; --accent:#d4b062; --accent-fg:#14231e; --gold:#d4b062;
  --ok:#7cc79a; --warn:#e3a25e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1d19; --surface:#152a24; --surface2:#1c352e; --line:#26443b;
  --fg:#ebe6d6; --muted:#9db0a8; --accent:#d4b062; --accent-fg:#14231e; --gold:#d4b062;
  --ok:#7cc79a; --warn:#e3a25e; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
header.top h1{font:400 22px var(--f-display);margin:0;flex:1;letter-spacing:.02em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:0;padding:8px;border-radius:10px;display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{background:var(--surface2)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
nav.tabs a[aria-current="page"]{color:var(--accent)}
h2{font:400 21px var(--f-display);margin:22px 0 10px;text-wrap:balance}
h3{font-size:16px;margin:16px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{border:0;background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:10px 16px;font-weight:600}
.btn.ghost{background:var(--surface2);color:var(--fg)}
input[type=search],input[type=text],select{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.tnum{font-variant-numeric:tabular-nums}

/* Vakitler */
.hero{border-radius:20px;padding:20px 18px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid var(--gold);opacity:.25;box-shadow:0 0 0 22px transparent,0 0 0 23px var(--gold)}
.hero .loc{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.hero .next{font:400 18px var(--f-display);margin-top:10px}
.hero .cd{font:600 46px/1.1 var(--f-body);letter-spacing:.01em;margin:4px 0 2px}
.hero .dates{font-size:14px;color:var(--muted)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.time{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.time .n{font-size:13px;color:var(--muted);font-weight:600}
.time .t{font:600 22px var(--f-body)}
.time.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.time.now .n{color:var(--accent)}
.time.past{opacity:.55}
@media (max-width:360px){.times{grid-template-columns:repeat(2,1fr)}}
.quote{font-size:17px}
.src{font-size:13px;color:var(--gold);margin-top:6px;font-weight:600}

/* Kur'an */
.slist{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.sitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.sitem:last-child{border-bottom:0}
.sitem:hover{background:var(--surface2)}
.snum{width:36px;height:36px;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--gold);border:1.5px solid var(--gold);border-radius:10px;transform:rotate(45deg)}
.snum span{transform:rotate(-45deg)}
.sitem .mid{flex:1;min-width:0}
.sitem .nm{font-weight:700}
.sitem .ar{font:24px var(--f-ar);color:var(--fg)}
.ayah{padding:16px 0;border-bottom:1px solid var(--line);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 150px)}
.ayah.mark{background:linear-gradient(90deg,transparent,var(--surface2) 20%,var(--surface2) 80%,transparent)}
.ayah .a{font:var(--ar-size)/2.1 var(--f-ar);direction:rtl;text-align:right}
.ayah .o{font-style:italic;color:var(--accent);margin-top:6px}
.ayah .m{margin-top:6px}
.ayah .no{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.ayah .no .bmk{margin-left:auto}
.aplay{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;padding:0}
.aplay svg.i{width:14px;height:14px;fill:currentColor}
.aplay:hover{border-color:var(--accent)}
.ayah.playing{background:linear-gradient(90deg,transparent,var(--surface2) 15%,var(--surface2) 85%,transparent)}
.w.said{color:var(--accent)}
.w.now{color:var(--gold);background:var(--surface2)}
.player{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 20px rgba(0,0,0,.08);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.player .pin{max-width:720px;margin:0 auto;display:grid;gap:6px}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pplay{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.pplay svg.i{fill:currentColor}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.pinfo b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player select{width:auto;flex:1;min-width:150px;padding:6px 10px;font-size:14px}
body.playing .wrap{padding-bottom:240px}
.endmark{color:var(--gold);font-size:.8em}
.besmele{font:32px/2 var(--f-ar);text-align:center;color:var(--gold);margin:8px 0}
.reader-tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:4;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}

/* Namaz rehberi */
.steps{counter-reset:s;display:grid;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--accent)}
.steps li>div{min-width:0}
.say{display:inline-block;margin-top:4px;font-size:14px;color:var(--gold);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
table.rk{width:100%;border-collapse:collapse;font-size:14px}
table.rk th,table.rk td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
table.rk th:first-child,table.rk td:first-child{text-align:left}
table.rk thead th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.scroll-x{overflow-x:auto}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px}
details+details{margin-top:8px}
summary{padding:13px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";color:var(--gold);font-size:20px;line-height:1}
details[open] summary::after{content:"−"}
details>div{padding-bottom:14px}
.dua .a{font:26px/2.1 var(--f-ar);direction:rtl;text-align:right}
.dua .o{font-style:italic;color:var(--accent);margin-top:6px}
.dua .m{margin-top:8px}
.note{border-left:3px solid var(--gold);padding:6px 12px;background:var(--surface2);border-radius:0 10px 10px 0;font-size:14px}

/* Tesbih & kıble */
.counter{display:grid;place-items:center;gap:12px;padding:20px 0}
.bead{width:200px;height:200px;border-radius:50%;border:2px solid var(--gold);background:var(--surface);font:600 56px var(--f-body);display:grid;place-items:center;color:var(--fg);user-select:none}
.bead:active{transform:scale(.97)}
.dial{width:240px;height:240px;margin:10px auto;border-radius:50%;border:2px solid var(--line);position:relative;background:var(--surface)}
.dial .n{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-weight:700;color:var(--muted);font-size:13px}
.needle{position:absolute;inset:0;transition:transform .25s}
.needle::before{content:"";position:absolute;left:50%;top:22px;width:4px;height:98px;margin-left:-2px;background:var(--accent);border-radius:2px}
.needle::after{content:"";position:absolute;left:50%;top:14px;width:16px;height:16px;margin-left:-8px;background:var(--gold);transform:rotate(45deg)}
.dial .c{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.more{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.more button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.more button b{font-size:15px}
.prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.strip-wrap{overflow-x:auto;margin:12px 0;padding-top:10px;scrollbar-width:thin}
.strip{position:relative;display:flex;gap:6px;direction:rtl;width:max-content;padding:0 2px 6px}
.cell{font:26px/1 var(--f-ar);min-width:52px;height:56px;padding:0 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);direction:rtl}
.cell.ok{color:var(--ok);border-color:var(--ok)}
.cell.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cursor{position:absolute;top:-9px;left:0;height:5px;border-radius:3px;background:var(--gold);transition:transform .35s cubic-bezier(.3,.7,.2,1),width .35s;pointer-events:none}
.lesson{text-align:center}
.lesson .big{font:96px/1.9 var(--f-ar);direction:rtl;transition:color .2s;padding-bottom:6px}
.lesson .big.ok{color:var(--ok)}
.lesson .okn{font:600 26px/1.3 var(--f-body);color:var(--accent);margin-top:14px;position:relative;z-index:1}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px;direction:rtl}
.forms .f{font:34px/2.1 var(--f-ar);padding-bottom:4px}
.btn.mic.live{background:var(--warn);color:#fff;animation:pulse 1.4s infinite}
.chip.voice.live{background:var(--warn);border-color:var(--warn);color:#fff}
@keyframes pulse{50%{opacity:.75}}
.fb{text-align:center;min-height:1.5em;margin:10px 0}
.fb.good{color:var(--ok);font-weight:600}.fb.bad{color:var(--warn)}
.reader-tools .fb{text-align:left;margin:6px 0 0}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#ayahs{position:relative}
.rbar{position:absolute;left:0;top:0;width:18px;height:13px;background:var(--gold);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));transition:transform .45s cubic-bezier(.3,.7,.2,1);pointer-events:none;z-index:2}
.w{border-radius:6px;transition:color .2s,background .2s;cursor:pointer}
.w.read{color:var(--ok)}
.w.cur{background:var(--surface2)}
.count{font:600 13px var(--f-body);color:var(--accent-fg);background:var(--accent);border-radius:999px;padding:2px 9px;vertical-align:3px}
@media (prefers-reduced-motion:reduce){.btn.mic.live{animation:none}}
button.time{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
button.time:hover{border-color:var(--accent)}
.time .n{display:flex;align-items:center;justify-content:space-between;gap:4px}
.ezic{width:15px!important;height:15px!important;color:var(--gold)}
.time .mk{font-size:11px;color:var(--gold);font-weight:600;letter-spacing:.03em}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(10,20,17,.55);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ezlines{display:grid;gap:4px}
.ezl{padding:8px 0;border-bottom:1px solid var(--line);text-align:center}
.ezl .a{font:26px/1.9 var(--f-ar);direction:rtl}
.ezl .o{font-weight:600;color:var(--accent)}
.warnc{color:var(--warn)}
.sesrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sesrow input[type=checkbox]{width:18px;height:18px;flex:none}
.btn.small{padding:7px 12px;font-size:14px}
.sik{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sikc{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);text-decoration:none}
.sikc b{font-size:15px}.sikc span{font-size:12px;color:var(--muted)}
.sikc:hover{border-color:var(--accent)}
.sikc.wide{flex-direction:row;justify-content:space-between;align-items:center;border-color:var(--accent)}
.sikc.wide span{color:var(--accent);font-weight:700}
.ayah.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,40%{background:var(--surface2)}100%{background:transparent}}
.opening{text-align:center;padding:4px 0 12px;margin-bottom:12px;border-bottom:1px dashed var(--line)}
.opening .a{font:24px/2 var(--f-ar);color:var(--gold);direction:rtl;text-align:center}
.opening .o{font-style:italic;color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-top:12px;background:var(--surface2);border-radius:12px}
.seg a{text-align:center;padding:9px;border-radius:9px;color:var(--muted);font-weight:700;text-decoration:none}
.seg a[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lesson .big.bad{color:var(--warn)}
.cell.bad{color:var(--warn);border-color:var(--warn)}
div.cell{display:grid;place-items:center}
.exam .reveal{min-height:1.3em}
.hak{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:6px}
.hak .dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.hak .dot.used{background:var(--line)}
.result .stars{font-size:40px;letter-spacing:6px;color:var(--line);margin:6px 0 0}
.result .stars .on{color:var(--gold)}
.result .score{font:600 64px/1 var(--f-body);color:var(--accent)}
.result .score span{font-size:22px;color:var(--muted)}
.good{color:var(--ok)}
.missgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.miss{border:1px solid var(--warn);border-radius:12px;padding:8px;text-align:center;background:var(--surface)}
.miss .a{font:30px/1.9 var(--f-ar)}.miss .o{font-weight:700;color:var(--accent)}
.hcard .hhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.hcard .hhead b{color:var(--gold);font-size:14px}
.htext{white-space:pre-wrap;overflow-wrap:anywhere}
.hact{margin-top:8px}
.gchip{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid currentColor;white-space:nowrap}
.g-ok{color:var(--ok)}.g-hs{color:var(--accent)}.g-wk{color:var(--warn)}.g-bad{color:#c0392b}
mark{background:var(--surface2);color:var(--fg);border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--gold)}
.chips-x{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:thin}
.chips-x .chip{white-space:nowrap;flex:none}
.chip .cn{font-size:11px;opacity:.7}
details.sss summary span{display:flex;flex-direction:column;gap:2px}
.sk{font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.03em}
.dayanak{font-size:12.5px;color:var(--gold);margin:8px 0 0;font-weight:600}
.kible{display:grid;justify-items:center;gap:6px;padding-top:6px}
.kstat{font-weight:700;color:var(--muted);text-align:center;min-height:1.4em}
.kible.ok .kstat{color:var(--ok)}
.rugwrap{width:150px;height:200px;display:grid;place-items:center}
.rugrot{width:120px;height:200px;transition:transform .15s linear}
.rug{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.rug .fringe line{stroke:var(--gold);stroke-width:1.6}
.rug-base{fill:#7a2230;transition:fill .35s}.rug-border{fill:none;stroke:#d9b45a;stroke-width:3;transition:stroke .35s}
.rug-field{fill:#9c2f3e;stroke:#d9b45a;stroke-width:1.5;transition:fill .35s}.rug-inner{fill:none;stroke:#e8cf8a;stroke-width:1;stroke-dasharray:3 3}
.rug-lamp,.rug-motif path{fill:#e8cf8a}.rug-dots circle{fill:#e8cf8a}
.kible.ok .rug-base{fill:#14593f}.kible.ok .rug-field{fill:#1f7a55}.kible.ok .rug-border{stroke:#bfe7cf}
.kible.ok .rug{filter:drop-shadow(0 0 14px rgba(47,125,79,.55))}
.kdeg{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.kdeg span{font:600 34px var(--f-body)}.kdeg small{color:var(--muted);font-weight:600}
.kible.ok .kdeg span,.kible.ok .kdeg small{color:var(--ok)}
.dialwrap{position:relative;width:min(78vw,270px);aspect-ratio:1;max-width:100%}
.dialrot{position:absolute;inset:0;transition:transform .15s linear}
.dialsvg{width:100%;height:100%}

<script>
"use strict";
/* ---------- yardımcılar ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("nur_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem("nur_"+k,JSON.stringify(v))}catch(e){}}};
const toAr=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const pad=n=>String(n).padStart(2,"0");
const hm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- tema ---------- */
function applyTheme(){const t=store.get("theme","system");if(t==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}
applyTheme();
$("#themeBtn").onclick=()=>{const order=["system","dark","light"];const cur=store.get("theme","system");const nx=order[(order.indexOf(cur)+1)%3];store.set("theme",nx);applyTheme();toast({system:"Tema: Sistem",dark:"Tema: Koyu (yeşil-altın)",light:"Tema: Açık"}[nx])};

/* ---------- namaz vakti hesabı (Diyanet yöntemi: imsak 18°, yatsı 17°, temkinli) ---------- */
const D2R=Math.PI/180,sind=x=>Math.sin(x*D2R),cosd=x=>Math.cos(x*D2R),tand=x=>Math.tan(x*D2R),
 asind=x=>Math.asin(x)/D2R,acosd=x=>Math.acos(Math.max(-1,Math.min(1,x)))/D2R,atan2d=(y,x)=>Math.atan2(y,x)/D2R,
 acotd=x=>Math.atan(1/x)/D2R,fixA=a=>((a%360)+360)%360,fixH=h=>((h%24)+24)%24;
function julian(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545,g=fixA(357.529+0.98560028*D),q=fixA(280.459+0.98564736*D),
 L=fixA(q+1.915*sind(g)+0.020*sind(2*g)),e=23.439-0.00000036*D,RA=atan2d(cosd(e)*sind(L),cosd(L))/15;
 return{decl:asind(sind(e)*sind(L)),eqt:q/15-fixH(RA)}}
function prayerTimes(lat,lng,date,tzName){
  const P=datePartsIn(date,tzName),y=P.y,mo=P.mo,d=P.d;
  const jd=julian(y,mo+1,d)-lng/(15*24);
  const mid=t=>fixH(12-sunPos(jd+t).eqt);
  const ang=(a,t,dir)=>{const dc=sunPos(jd+t).decl;const T=acosd((-sind(a)-sind(dc)*sind(lat))/(cosd(dc)*cosd(lat)))/15;return mid(t)+dir*T};
  const asr=t=>{const dc=sunPos(jd+t).decl;return ang(-acotd(1+tand(Math.abs(lat-dc))),t,1)};
  let h={imsak:5,gunes:6,ogle:12,ikindi:13,aksam:18,yatsi:18};
  for(let i=0;i<2;i++){const f=x=>x/24;
    h={imsak:ang(18,f(h.imsak),-1),gunes:ang(0.833,f(h.gunes),-1),ogle:mid(f(h.ogle)),ikindi:asr(f(h.ikindi)),aksam:ang(0.833,f(h.aksam),1),yatsi:ang(17,f(h.yatsi),1)}}
  const adj={imsak:0,gunes:-7,ogle:5,ikindi:4,aksam:7,yatsi:0};const out={};
  for(const k in h){out[k]=new Date(Date.UTC(y,mo,d)+Math.round((h[k]-lng/15)*60+adj[k])*60000)}
  return out}
const VAKIT=[["imsak","İmsak"],["gunes","Güneş"],["ogle","Öğle"],["ikindi","İkindi"],["aksam","Akşam"],["yatsi","Yatsı"]];
function qibla(lat,lng){const kl=21.4225,kg=39.8262;return fixA(atan2d(sind(kg-lng),cosd(lat)*tand(kl)-sind(lat)*cosd(kg-lng)))}

const SesDB=(()=>{let dbp=null;const open=()=>dbp||(dbp=new Promise((ok,no)=>{try{const r=indexedDB.open("nur_ses",1);r.onupgradeneeded=()=>r.result.createObjectStore("ses");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}));
  const tx=async(mode,fn)=>{const db=await open();return new Promise((ok,no)=>{const t=db.transaction("ses",mode),st=t.objectStore("ses"),r=fn(st);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})};
  return{get:k=>tx("readonly",s=>s.get(k)).catch(()=>null),set:(k,v)=>tx("readwrite",s=>s.put(v,k)),del:k=>tx("readwrite",s=>s.delete(k)),keys:()=>tx("readonly",s=>s.getAllKeys()).catch(()=>[])}})();
const bundledOK={};
async function sesURL(key){
  try{const b=await SesDB.get(key);if(b)return{url:URL.createObjectURL(b),src:"user"}}catch(e){}
  const u="ses/"+SES_FILE[key]+".mp3";
  if(bundledOK[u]===undefined){bundledOK[u]=await new Promise(ok=>{const a=new Audio();let done=false;const fin=v=>{if(!done){done=true;ok(v)}};a.oncanplaythrough=()=>fin(true);a.onloadedmetadata=()=>fin(true);a.onerror=()=>fin(false);setTimeout(()=>fin(false),4000);a.preload="metadata";a.src=u})}
  return bundledOK[u]?{url:u,src:"app"}:null}

function chime(){try{chimeCtx=chimeCtx||new (window.AudioContext||window.webkitAudioContext)();const c=chimeCtx,t0=c.currentTime;
  [523.25,659.25,783.99].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+i*.35);g.gain.exponentialRampToValueAtTime(.25,t0+i*.35+.04);g.gain.exponentialRampToValueAtTime(.0001,t0+i*.35+2.2);o.connect(g).connect(c.destination);o.start(t0+i*.35);o.stop(t0+i*.35+2.3)})}catch(e){}}

{g:"Namaz Duaları",t:"Sübhâneke",a:"سُبْحَانَكَ اللّٰهُمَّ وَبِحَمْدِكَ وَتَبَارَكَ اسْمُكَ وَتَعَالٰى جَدُّكَ وَجَلَّ ثَنَاؤُكَ وَلَا اِلٰهَ غَيْرُكَ",

{g:"Namaz Duaları",t:"Eûzü – Besmele",a:"اَعُوذُ بِاللّٰهِ مِنَ الشَّيْطَانِ الرَّجِيمِ بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ",

{g:"Namaz Duaları",t:"Rükû ve Secde Tesbihleri",a:"سُبْحَانَ رَبِّيَ الْعَظِيمِ ‏· سَمِعَ اللّٰهُ لِمَنْ حَمِدَهُ ‏· رَبَّنَا لَكَ الْحَمْدُ ‏· سُبْحَانَ رَبِّيَ الْاَعْلٰى",

 m:"Yüce Rabbimi tenzih ederim. Allah kendisine hamd edeni işitir. Rabbimiz, hamd sana mahsustur. En yüce olan Rabbimi tenzih ederim."},
{g:"Namaz Duaları",t:"Ettehiyyâtü",a:"اَلتَّحِيَّاتُ لِلّٰهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ اَلسَّلَامُ عَلَيْكَ اَيُّهَا النَّبِيُّ وَرَحْمَةُ اللّٰهِ وَبَرَكَاتُهُ اَلسَّلَامُ عَلَيْنَا وَعَلٰى عِبَادِ اللّٰهِ الصَّالِحِينَ اَشْهَدُ اَنْ لَا اِلٰهَ اِلَّا اللّٰهُ وَاَشْهَدُ اَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ",
 o:"Ettehiyyâtü lillâhi ves-salevâtü vet-tayyibât. Esselâmü aleyke eyyühen-nebiyyü ve rahmetullâhi ve berekâtüh. Esselâmü aleynâ ve alâ ibâdillâhis-sâlihîn. Eşhedü en lâ ilâhe illallâh ve eşhedü enne Muhammeden abdühû ve resûlüh.",
 m:"Dil ile, beden ve mal ile yapılan bütün ibadetler Allah'adır. Ey Peygamber! Allah'ın selamı, rahmeti ve bereketi senin üzerine olsun. Selam bizim üzerimize ve Allah'ın salih kulları üzerine olsun. Şahitlik ederim ki Allah'tan başka ilah yoktur. Yine şahitlik ederim ki Muhammed O'nun kulu ve elçisidir.",
 n:"Her oturuşta okunur."},
{g:"Namaz Duaları",t:"Allâhümme Salli",a:"اَللّٰهُمَّ صَلِّ عَلٰى مُحَمَّدٍ وَعَلٰى اٰلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلٰى اِبْرَاهِيمَ وَعَلٰى اٰلِ اِبْرَاهِيمَ اِنَّكَ حَمِيدٌ مَجِيدٌ",
 o:"Allâhümme salli alâ Muhammedin ve alâ âli Muhammed, kemâ salleyte alâ İbrâhîme ve alâ âli İbrâhîm, inneke hamîdün mecîd.",
 m:"Allah'ım! İbrahim'e ve ailesine rahmet ettiğin gibi Muhammed'e ve ailesine de rahmet et. Şüphesiz sen övülmeye layıksın, şanı yücesin."},
{g:"Namaz Duaları",t:"Allâhümme Bârik",a:"اَللّٰهُمَّ بَارِكْ عَلٰى مُحَمَّدٍ وَعَلٰى اٰلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلٰى اِبْرَاهِيمَ وَعَلٰى اٰلِ اِبْرَاهِيمَ اِنَّكَ حَمِيدٌ مَجِيدٌ",
 o:"Allâhümme bârik alâ Muhammedin ve alâ âli Muhammed, kemâ bârekte alâ İbrâhîme ve alâ âli İbrâhîm, inneke hamîdün mecîd.",
 m:"Allah'ım! İbrahim'e ve ailesine bereket verdiğin gibi Muhammed'e ve ailesine de bereket ver. Şüphesiz sen övülmeye layıksın, şanı yücesin."},
{g:"Namaz Duaları",t:"Rabbenâ Âtinâ",a:"رَبَّنَا اٰتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْاٰخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
 o:"Rabbenâ âtinâ fid-dünyâ haseneten ve fil-âhireti haseneten ve kınâ azâben-nâr.",
 m:"Rabbimiz! Bize dünyada da iyilik ver, âhirette de iyilik ver ve bizi cehennem azabından koru. (Bakara 201)"},
{g:"Namaz Duaları",t:"Rabbenağfirlî",a:"رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ",
 o:"Rabbenağfirlî ve li-vâlideyye ve lil-mü'minîne yevme yekûmül-hisâb.",
 m:"Rabbimiz! Hesap gününde beni, anamı, babamı ve bütün müminleri bağışla. (İbrâhîm 41)"},
{g:"Namaz Duaları",t:"Kunut Duası 1",a:"اَللّٰهُمَّ اِنَّا نَسْتَعِينُكَ وَنَسْتَغْفِرُكَ وَنَسْتَهْدِيكَ وَنُؤْمِنُ بِكَ وَنَتُوبُ اِلَيْكَ وَنَتَوَكَّلُ عَلَيْكَ وَنُثْنِي عَلَيْكَ الْخَيْرَ كُلَّهُ نَشْكُرُكَ وَلَا نَكْفُرُكَ وَنَخْلَعُ وَنَتْرُكُ مَنْ يَفْجُرُكَ",
 o:"Allâhümme innâ neste'înüke ve nesteğfirüke ve nestehdîk. Ve nü'minü bike ve netûbü ileyk. Ve netevekkelü aleyke ve nüsnî aleykel-hayra küllehû neşkürük. Ve lâ nekfürüke ve nahleu ve netrükü men yefcürük.",
 m:"Allah'ım! Senden yardım isteriz, günahlarımızı bağışlamanı isteriz, razı olduğun şeylere hidayet isteriz. Sana inanırız, sana tövbe ederiz, sana güveniriz. Bize verdiğin bütün nimetleri bilerek seni hayır ile överiz. Sana şükrederiz, hiçbir nimetini inkâr etmeyiz. Nimetlerini inkâr eden ve sana karşı geleni bırakırız.",
 n:"Vitir namazının 3. rekâtında, zamm-ı sureden sonra tekbir alınıp okunur."},
{g:"Namaz Duaları",t:"Kunut Duası 2",a:"اَللّٰهُمَّ اِيَّاكَ نَعْبُدُ وَلَكَ نُصَلِّي وَنَسْجُدُ وَاِلَيْكَ نَسْعٰى وَنَحْفِدُ نَرْجُو رَحْمَتَكَ وَنَخْشٰى عَذَابَكَ اِنَّ عَذَابَكَ بِالْكُفَّارِ مُلْحِقٌ",
 o:"Allâhümme iyyâke na'büdü ve leke nusallî ve nescüdü ve ileyke nes'â ve nahfid. Nercû rahmeteke ve nahşâ azâbek. İnne azâbeke bil-küffâri mülhık.",
 m:"Allah'ım! Yalnız sana kulluk ederiz, namazı yalnız senin için kılar, yalnız sana secde ederiz. Sana koşar, sana yaklaştıracak işlere çalışırız. Rahmetini umar, azabından korkarız. Şüphesiz senin azabın kâfirlere ulaşır."},
{g:"Namazda Okunan Sureler",t:"Fâtiha Suresi",q:[1,1,7],o:"Bismillâhir-rahmânir-rahîm. Elhamdü lillâhi rabbil-âlemîn. Er-rahmânir-rahîm. Mâliki yevmid-dîn. İyyâke na'büdü ve iyyâke neste'în. İhdinas-sırâtal-müstakîm. Sırâtallezîne en'amte aleyhim ğayril-mağdûbi aleyhim ve led-dâllîn."},
{g:"Namazda Okunan Sureler",t:"Fîl Suresi",q:[105,1,5],o:"Elem tera keyfe fe'ale rabbüke bi-ashâbil-fîl. Elem yec'al keydehüm fî tadlîl. Ve ersele aleyhim tayran ebâbîl. Termîhim bi-hicâratin min siccîl. Fece'alehüm ke-asfin me'kûl."},
{g:"Namazda Okunan Sureler",t:"Kureyş Suresi",q:[106,1,4],o:"Li-îlâfi kureyş. Îlâfihim rihleteş-şitâi ves-sayf. Felya'büdû rabbe hâzel-beyt. Ellezî et'amehüm min cû'in ve âmenehüm min havf."},
{g:"Namazda Okunan Sureler",t:"Mâûn Suresi",q:[107,1,7],o:"Era'eytellezî yükezzibü bid-dîn. Fezâlikellezî yedu'ul-yetîm. Ve lâ yehuddu alâ ta'âmil-miskîn. Feveylün lil-musallîn. Ellezîne hüm an salâtihim sâhûn. Ellezîne hüm yürâûn. Ve yemne'ûnel-mâ'ûn."},
{g:"Namazda Okunan Sureler",t:"Kevser Suresi",q:[108,1,3],o:"İnnâ a'taynâkel-kevser. Fesalli li-rabbike venhar. İnne şânieke hüvel-ebter."},
{g:"Namazda Okunan Sureler",t:"Kâfirûn Suresi",q:[109,1,6],o:"Kul yâ eyyühel-kâfirûn. Lâ a'büdü mâ ta'büdûn. Ve lâ entüm âbidûne mâ a'büd. Ve lâ ene âbidün mâ abedtüm. Ve lâ entüm âbidûne mâ a'büd. Leküm dînüküm ve liye dîn."},
{g:"Namazda Okunan Sureler",t:"Nasr Suresi",q:[110,1,3],o:"İzâ câe nasrullâhi vel-feth. Ve raeyten-nâse yedhulûne fî dînillâhi efvâcâ. Fesebbih bi-hamdi rabbike vestağfirh, innehû kâne tevvâbâ."},
{g:"Namazda Okunan Sureler",t:"Tebbet Suresi",q:[111,1,5],o:"Tebbet yedâ ebî lehebin ve tebb. Mâ ağnâ anhü mâlühû ve mâ keseb. Seyeslâ nâran zâte leheb. Vemraetühû hammâletel-hatab. Fî cîdihâ hablün min mesed."},
{g:"Namazda Okunan Sureler",t:"İhlâs Suresi",q:[112,1,4],o:"Kul hüvallâhü ehad. Allâhüs-samed. Lem yelid ve lem yûled. Ve lem yekün lehû küfüven ehad."},
{g:"Namazda Okunan Sureler",t:"Felak Suresi",q:[113,1,5],o:"Kul eûzü bi-rabbil-felak. Min şerri mâ halak. Ve min şerri ğâsikın izâ vekab. Ve min şerrin-neffâsâti fil-ukad. Ve min şerri hâsidin izâ hased."},
{g:"Namazda Okunan Sureler",t:"Nâs Suresi",q:[114,1,6],o:"Kul eûzü bi-rabbin-nâs. Melikin-nâs. İlâhin-nâs. Min şerril-vesvâsil-hannâs. Ellezî yüvesvisü fî sudûrin-nâs. Minel-cinneti ven-nâs."},
{g:"Önemli Dualar",t:"Âyetü'l-Kürsî",q:[2,255,255],o:"Allâhü lâ ilâhe illâ hüvel-hayyül-kayyûm. Lâ te'huzühû sinetün ve lâ nevm. Lehû mâ fis-semâvâti ve mâ fil-ard. Men zellezî yeşfeu indehû illâ bi-iznih. Ya'lemü mâ beyne eydîhim ve mâ halfehüm. Ve lâ yühîtûne bi-şey'in min ilmihî illâ bimâ şâ'. Vesia kürsiyyühüs-semâvâti vel-ard. Ve lâ yeûdühû hıfzuhumâ ve hüvel-aliyyül-azîm."},
{g:"Önemli Dualar",t:"Ezan Duası",a:"اللّٰهُمَّ رَبَّ هٰذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلَاةِ الْقَائِمَةِ اٰتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ",
 o:"Allâhümme rabbe hâzihi'd-da'veti't-tâmmeti ve's-salâti'l-kâimeti âti Muhammedeni'l-vesîlete ve'l-fadîlete veb'ashü makâmen mahmûdeni'llezî vaadteh.",
 m:"Allah'ım! Ey bu eksiksiz çağrının ve kılınacak namazın Rabbi! Muhammed'e vesileyi ve fazileti ver. Onu, kendisine vaat ettiğin Makâm-ı Mahmûd'a ulaştır.",n:"Ezan bittikten sonra okunur (Buhârî, Ezân 8)."},
{g:"Önemli Dualar",t:"Âmentü",a:"اٰمَنْتُ بِاللّٰهِ وَمَلٰٓئِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ وَالْيَوْمِ الْاٰخِرِ وَبِالْقَدَرِ خَيْرِهِ وَشَرِّهِ مِنَ اللّٰهِ تَعَالٰى وَالْبَعْثُ بَعْدَ الْمَوْتِ حَقٌّ اَشْهَدُ اَنْ لَا اِلٰهَ اِلَّا اللّٰهُ وَاَشْهَدُ اَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ",
 o:"Âmentü billâhi ve melâiketihî ve kütübihî ve rusülihî vel-yevmil-âhiri ve bil-kaderi hayrihî ve şerrihî minallâhi teâlâ vel-ba'sü ba'del-mevti hakkun. Eşhedü en lâ ilâhe illallâh ve eşhedü enne Muhammeden abdühû ve resûlüh.",
 m:"Allah'a, meleklerine, kitaplarına, peygamberlerine, âhiret gününe, kadere, hayrın ve şerrin Allah'tan olduğuna inandım. Öldükten sonra dirilmek haktır. Şahitlik ederim ki Allah'tan başka ilah yoktur; yine şahitlik ederim ki Muhammed O'nun kulu ve elçisidir."},
{g:"Önemli Dualar",t:"Kelime-i Tevhid ve Kelime-i Şehâdet",a:"لَا اِلٰهَ اِلَّا اللّٰهُ مُحَمَّدٌ رَسُولُ اللّٰهِ ‏· اَشْهَدُ اَنْ لَا اِلٰهَ اِلَّا اللّٰهُ وَاَشْهَدُ اَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ",
 o:"Lâ ilâhe illallâh Muhammedün resûlullâh. — Eşhedü en lâ ilâhe illallâh ve eşhedü enne Muhammeden abdühû ve resûlüh.",
 m:"Allah'tan başka ilah yoktur, Muhammed Allah'ın elçisidir. — Şahitlik ederim ki Allah'tan başka ilah yoktur; yine şahitlik ederim ki Muhammed O'nun kulu ve elçisidir."},
{g:"Önemli Dualar",t:"Namaz Sonrası Tesbihat",a:"سُبْحَانَ اللّٰهِ ‏· اَلْحَمْدُ لِلّٰهِ ‏· اَللّٰهُ اَكْبَرُ",
 o:"Farzdan sonra: \"Allâhümme entes-selâmü ve minkes-selâm, tebârekte yâ zel-celâli vel-ikrâm.\" Ardından Âyetü'l-Kürsî; 33 kez Sübhânallâh, 33 kez Elhamdülillâh, 33 kez Allâhü ekber; sonra \"Lâ ilâhe illallâhü vahdehû lâ şerîke leh, lehül-mülkü ve lehül-hamdü ve hüve alâ külli şey'in kadîr.\"",
 m:"Allah'ı her türlü eksiklikten tenzih ederim. Hamd Allah'a mahsustur. Allah en büyüktür. Tesbihat için Diğer › Tesbih sayacını kullanabilirsin."}];

    const norm=s=>s.toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ']/g,"");

    if(val.length>=3&&isNaN(val)){const hits=[];for(const s of QURAN){s.v.forEach((v,i)=>{if(hits.length<60&&norm(v[2]).includes(nv))hits.push([s,i])})}

function duaHTML(d){
  let a=d.a,m=d.m,open="",note=d.n||"";
  if(d.q&&QURAN){const s=QURAN[d.q[0]-1];const vs=s.v.slice(d.q[1]-1,d.q[2]);a=vs.map((v,i)=>v[0]+" ﴿"+toAr(d.q[1]+i)+"﴾").join(" ");m=vs.map(v=>v[2]).join(" ")+(d.q[0]===2?" (Bakara 255)":"");
    if(d.q[0]===1)note="Besmele, Fâtiha suresinin ilk ayetidir; yukarıdaki metnin başında yer alır.";
    else if(d.q[0]!==9&&d.q[1]===1){open=openingHTML([BESMELE],"Başlarken");note="Namazda Fâtiha'dan sonra okunan sureden önce Besmele çekilir.";}
    else if(d.q[1]>1){open=openingHTML([EUZU,BESMELE],"Başlarken: Eûzü – Besmele");}}
  if(NAMAZ_ICI.includes(d.t))note=(note?note+" ":"")+"Namaz içinde okunur; başına besmele çekilmez.";
  return `<div class="dua">${open}${a?`<div class="a">${esc(a)}</div>`:""}<div class="lbl" style="margin-top:10px">Okunuşu</div><div class="o">${esc(d.o)}</div>${m?`<div class="lbl" style="margin-top:10px">Anlamı</div><div class="m">${esc(m)}</div>`:""}${note?`<p class="note">${esc(note)}</p>`:""}</div>`}

const HK_BOOKS=[["buhari","Sahîh-i Buhârî","İmam Buhârî (ö. 870)",7043],["ebudavud","Sünen-i Ebû Dâvûd","Ebû Dâvûd (ö. 888)",5248],["tirmizi","Sünen-i Tirmizî","İmam Tirmizî (ö. 892)",3765],["ibnmace","Sünen-i İbn Mâce","İbn Mâce (ö. 886)",4314],["muvatta","Muvatta","İmam Mâlik (ö. 795)",1555],["nevevi","Kırk Hadis","İmam Nevevî (ö. 1277)",42]];
const HK_KISA={buhari:"Buhârî",ebudavud:"Ebû Dâvûd",tirmizi:"Tirmizî",ibnmace:"İbn Mâce",muvatta:"Muvatta",nevevi:"Nevevî, Kırk Hadis"};
const HK_WAIT={};
function hkLoad(id,cb){window.HADIS_KITAP=window.HADIS_KITAP||{};if(HADIS_KITAP[id])return cb(HADIS_KITAP[id]);
  (HK_WAIT[id]=HK_WAIT[id]||[]).push(cb);if(HK_WAIT[id].length>1)return;
  const s=document.createElement("script");s.src="hadis/"+id+".js";
  s.onload=()=>{const b=HADIS_KITAP[id];b._idx={};b.h.forEach((h,i)=>{(b._idx[h[1]]=b._idx[h[1]]||[]).push(i)});HK_WAIT[id].splice(0).forEach(f=>f(b))};
  s.onerror=()=>{HK_WAIT[id]=[];view.insertAdjacentHTML("beforeend",`<p class="note">Hadis dosyası (hadis/${esc(id)}.js) yüklenemedi. "hadis" klasörünün index.html ile aynı yerde olduğundan emin ol.</p>`)};document.head.appendChild(s)}
const HK_WEAK=new Set(["Zayıf","Mevzû","Münker","Şâz"]);
const hkHide=()=>store.get("hkGizle",true);
const hkVisible=h=>!(hkHide()&&HK_WEAK.has(h[3]));
const gradeCls=g=>({"Sahih":"g-ok","Hasen Sahih":"g-ok","Hasen":"g-hs","Zayıf":"g-wk","Mevzû":"g-bad","Münker":"g-bad","Şâz":"g-bad"})[g]||"";
function hadisCard(id,h,hl){
  const t=h[2],long=t.length>700;const body=esc(long?t.slice(0,600).replace(/\s\S*$/,"")+"…":t);
  const mark=s=>hl?s.replace(new RegExp("("+hl.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>"):s;
  return `<article class="card hcard" data-id="${id}" data-n="${h[0]}"><div class="hhead"><b>${esc(HK_KISA[id])}, ${h[0]}</b>${h[3]?`<span class="gchip ${gradeCls(h[3])}">${h[3]}</span>`:""}</div>
    <div class="htext">${mark(body)}</div>${long?`<button class="say hmore">Devamını oku</button>`:""}
    <div class="row hact"><button class="btn ghost small hcopy">Kopyala</button></div></article>`}
function hkBind(id,list){view.querySelectorAll(".hcard").forEach(c=>{const h=list.find(x=>String(x[0])===c.dataset.n);if(!h)return;
  const m=c.querySelector(".hmore");if(m)m.onclick=()=>{c.querySelector(".htext").textContent=h[2];m.remove()};
  c.querySelector(".hcopy").onclick=async()=>{const txt=`${h[2]}\n\n(${HK_KISA[id]}, ${h[0]}${h[3]?" · "+h[3]:""})`;try{await navigator.clipboard.writeText(txt);toast("Hadis kopyalandı")}catch(e){const r=document.createRange();r.selectNodeContents(c.querySelector(".htext"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Metin seçildi, kopyalayabilirsin")}}})}
const hkSeg=(m)=>`<div class="seg" role="tablist" style="margin-top:12px"><a href="#hadis" role="tab" aria-selected="${m==="secme"}">Seçme Hadisler</a><a href="#hk" role="tab" aria-selected="${m==="kut"}">Hadis Kütüphanesi</a></div>`;
function vHK(){
  setHeader("Hadis Kütüphanesi",()=>{location.hash="diger"});
  const tot=HK_BOOKS.reduce((a,b)=>a+b[3],0);
  view.innerHTML=`${hkSeg("kut")}
  <p class="muted small" style="margin:12px 0">${tot.toLocaleString("tr-TR")} hadis · Kütüb-i Sitte'den beş kitap, Muvatta ve Nevevî'nin Kırk Hadis'i. Kitaba girip bölümlere göz atabilir ya da arama yapabilirsin.</p>
  <div class="slist">${HK_BOOKS.map(([id,ad,yz,n],i)=>`<a class="sitem" href="#hk-${id}" style="text-decoration:none;color:inherit"><div class="snum"><span>${i+1}</span></div><div class="mid"><div class="nm">${ad}</div><div class="small muted">${yz} · ${n.toLocaleString("tr-TR")} hadis</div></div></a>`).join("")}</div>
  <label class="row small" style="margin-top:14px"><input type="checkbox" id="gizle" ${hkHide()?"checked":""}> Zayıf, mevzû (uydurma), münker ve şâz rivayetleri gizle</label>
  <div class="note" style="margin-top:12px">Hadis dereceleri hadis âlimlerinin (çoğunlukla Elbânî) değerlendirmelerine dayanır. Buhârî'nin bütün hadisleri sahih kabul edilir. Türkçe çeviriler açık kaynaklı bir arşivden alınmıştır; bazı metinlerde yazım hatası olabilir. Sahîh-i Müslim ve Sünen-i Nesâî, güvenilir Türkçe çevirileri sağlandığında eklenecek.</div>`;
  $("#gizle").onchange=e=>store.set("hkGizle",e.target.checked);window.scrollTo(0,0)}
function vHKBook(id,bol){
  const meta=HK_BOOKS.find(b=>b[0]===id);if(!meta){location.hash="hk";return}
  setHeader(meta[1],()=>{location.hash=bol!=null?"hk-"+id:"hk"});
  view.innerHTML='<p class="muted" style="margin-top:16px">Yükleniyor…</p>';
  hkLoad(id,b=>{if(!location.hash.startsWith("#hk-"+id))return;
    if(bol==null){
      const counts=Object.keys(b.bolum).map(k=>[k,b.bolum[k],(b._idx[k]||[]).filter(i=>hkVisible(b.h[i])).length]).filter(x=>x[2]>0);
      view.innerHTML=`<div class="stack" style="margin-top:12px"><input type="search" id="hq" placeholder="${esc(meta[1])} içinde ara (ör. komşu, namaz, sabır)" aria-label="Hadis ara">
        <div id="hres"></div></div>
        <div id="hbol"><div class="lbl" style="margin:14px 0 6px">Bölümler (Kitaplar)</div>
        <div class="slist">${counts.map(([k,ad,n])=>`<a class="sitem" href="#hk-${id}-${k}" style="text-decoration:none;color:inherit"><div class="mid"><div class="nm">${esc(ad)}</div><div class="small muted">${n} hadis</div></div></a>`).join("")}</div></div>`;
      const q=$("#hq");q.value=store.get("hq_"+id,"");
      let tmr=0;const run=()=>{const v=q.value.trim();store.set("hq_"+id,v);const box=$("#hres");$("#hbol").hidden=v.length>=2;
        if(v.length<2){box.innerHTML="";return}
        const nv=v.toLocaleLowerCase("tr");const res=[];
        if(/^\d+$/.test(v)){const h=b.h.find(x=>String(x[0])===v);if(h)res.push(h)}
        else for(const h of b.h){if(hkVisible(h)&&h[2].toLocaleLowerCase("tr").includes(nv)){res.push(h);if(res.length>=60)break}}
        box.innerHTML=`<p class="small muted">${res.length>=60?"İlk 60 sonuç":res.length+" sonuç"}${/^\d+$/.test(v)?" (hadis numarası)":""}</p>`+res.map(h=>hadisCard(id,h,/^\d+$/.test(v)?"":v)).join("");hkBind(id,res)};
      q.oninput=()=>{clearTimeout(tmr);tmr=setTimeout(run,250)};run();window.scrollTo(0,0);return}
    const all=(b._idx[bol]||[]).map(i=>b.h[i]).filter(hkVisible);let shown=0;const PAGE=30;
    setHeader(b.bolum[bol]||meta[1],()=>{location.hash="hk-"+id});
    view.innerHTML=`<p class="small muted" style="margin:12px 0">${esc(meta[1])} · ${esc(b.bolum[bol]||"")} · ${all.length} hadis</p><div class="stack" id="hlist"></div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" id="hmore">Daha fazla göster</button></div>`;
    const more=()=>{const part=all.slice(shown,shown+PAGE);$("#hlist").insertAdjacentHTML("beforeend",part.map(h=>hadisCard(id,h)).join(""));shown+=part.length;hkBind(id,all);$("#hmore").hidden=shown>=all.length};
    $("#hmore").onclick=more;more();window.scrollTo(0,0)})}

const zNorm=t=>String(t||"").toLocaleLowerCase("tr").replace(/[âà]/g,"a").replace(/[îì]/g,"i").replace(/[ûù]/g,"u").replace(/[^a-zçğıöşü0-9]/g,"");
const gunKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function zkKaydet(ad,c,t){const L=store.get("zkGun",{});const g=gunKey();L[g]=L[g]||{};const r=L[g][ad]=L[g][ad]||{c:0,t:0};r.c=Math.max(0,r.c+c);r.t+=t;if(!r.c&&!r.t)delete L[g][ad];if(!Object.keys(L[g]).length)delete L[g];store.set("zkGun",L)}
function vTesbih(){

    <a class="sikc wide" href="#zikirarsiv" style="margin-bottom:12px"><b>Zikir arşivim</b><span>${(()=>{const L=store.get("zkGun",{});let n=0;Object.values(L).forEach(g=>Object.values(g).forEach(r=>n+=r.c));return n.toLocaleString("tr-TR")+" zikir ›"})()}</span></a>
    <div class="slist">${ZIKIR.map((z,i)=>`<a class="sitem" href="#zikir-${i}" style="text-decoration:none;color:inherit"><div class="mid"><div class="nm">${esc(z.t)}</div><div class="small muted">${z.ad.map(a=>a.n?a.n+" "+a.t:a.t).join(" · ")}</div></div><div class="ar" style="font-size:20px">${esc((z.ad[0].ar||"").split(" ").slice(0,2).join(" "))}</div></a>`).join("")}</div>`;
  window.scrollTo(0,0)}
function vZikir(zi){const Z=ZIKIR[zi];if(!Z){location.hash="tesbih";return}
  setHeader("Zikirmatik",()=>{location.hash="tesbih"});
  const key="zk_"+zi;let st=store.get(key,{a:0,c:0,tur:0});let mode=store.get("zkMode","dok"),smode=store.get("zkSes","tani");
  let custom=store.get("zkHedef_"+zi,null);

    <div class="row" id="zsteps" style="gap:6px;flex-wrap:wrap"></div>
    <div class="card" style="margin-top:8px"><div class="dua"><div class="a" id="zar"></div><div class="lbl" style="margin-top:8px">Okunuşu</div><div class="o" id="zok"></div><div class="lbl" style="margin-top:8px">Anlamı</div><div class="m" id="zm"></div></div></div>
    <div class="seg" style="margin-top:12px"><a href="#" data-md="dok" aria-selected="${mode==="dok"}">Dokunarak say</a><a href="#" data-md="ses" aria-selected="${mode==="ses"}">Sesle say</a></div>
    <div id="zsesbox" ${mode==="ses"?"":"hidden"} style="margin-top:8px"><div class="row" style="gap:8px;flex-wrap:wrap;align-items:center"><button class="btn" id="zmic">Dinlemeyi başlat</button>
      <select id="zsm" style="flex:1;min-width:160px"><option value="tani" ${smode==="tani"?"selected":""}>Zikri tanıyınca say</option><option value="durak" ${smode==="durak"?"selected":""}>Her söyleyişte bir say</option></select></div>
      <p class="small muted" id="zsesinfo" style="margin:6px 0 0">Zikri sesli ve tane tane oku; her söyleyişinde sayaç artar. Ses tanıma bazen kaçırabilir; gerekirse ekrana dokunarak düzeltebilirsin.</p></div>
    <div class="zcount"><button class="zbtn tnum" id="zbtn" aria-label="Say"><svg viewBox="0 0 120 120" class="zring"><circle cx="60" cy="60" r="54" class="zr0"/><circle cx="60" cy="60" r="54" class="zr1" id="zr1"/></svg><span id="zn">0</span><small id="zh"></small></button></div>
    <div class="row" style="justify-content:center;gap:8px"><button class="btn ghost small" id="zgeri">Bir geri al</button><button class="btn ghost small" id="zsif">Sıfırla</button><button class="btn ghost small" id="zhed">Hedefi değiştir</button></div>
    <h2>Önemi ve amacı</h2><p>${esc(Z.o)}</p>${Z.f?`<p class="note"><b>Fazileti:</b> ${esc(Z.f)}</p>`:""}${Z.k?`<p class="dayanak">Kaynak: ${esc(Z.k)}</p>`:""}`;
  const A=()=>Z.ad[st.a];const target=()=>custom!=null&&Z.ad.length===1?custom:A().n;
  const R=2*Math.PI*54;
  const draw=()=>{const a=A(),T=target();$("#zar").textContent=a.ar||"—";$("#zok").textContent=a.ok||"Dilediğin zikri oku.";$("#zm").textContent=a.m;
    $("#zn").textContent=st.c;$("#zh").textContent=T?`/ ${T}${st.tur?` · ${st.tur}. tur tamam`:""}`:"serbest";
    $("#zr1").style.strokeDasharray=R;$("#zr1").style.strokeDashoffset=T?R*(1-Math.min(1,st.c/T)):R;
    $("#zsteps").innerHTML=Z.ad.length>1?Z.ad.map((x,i)=>`<span class="chip" aria-pressed="${i===st.a}" style="${i<st.a?"opacity:.6":""}">${i<st.a?"✓ ":""}${esc(x.t)} ${x.n}</span>`).join(""):"";
    store.set(key,st)};
  const done=()=>{try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    if(st.a<Z.ad.length-1){toast(A().t+" tamamlandı, sıradaki: "+Z.ad[st.a+1].t);st.a++;st.c=0}
    else{toast(Z.ad.length>1?"Zikir tamamlandı. Allah kabul etsin.":"Hedef tamamlandı. Allah kabul etsin.");st.tur++;zkKaydet(Z.t,0,1);if(Z.ad.length>1){st.a=0;st.c=0}else st.c=0}};
  const inc=(n=1)=>{zkKaydet(Z.t,n,0);for(let i=0;i<n;i++){st.c++;const T=target();if(T&&st.c>=T)done();else try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}draw()};
  $("#zbtn").onclick=()=>inc(1);
  $("#zgeri").onclick=()=>{if(st.c>0){st.c--;zkKaydet(Z.t,-1,0)}draw()};
  $("#zsif").onclick=()=>{st={a:0,c:0,tur:0};pos=zNorm(lastT).length;draw()};
  $("#zhed").onclick=()=>{if(Z.ad.length>1){toast("Bu zikrin sayıları sünnette bildirildiği şekliyle sabittir.");return}
    const opts=[33,99,100,500,1000,0];const cur=target();const nx=opts[(opts.indexOf(cur)+1)%opts.length];custom=nx;store.set("zkHedef_"+zi,nx);toast(nx?`Hedef: ${nx}`:"Hedefsiz serbest sayım");draw()};
  view.querySelectorAll("[data-md]").forEach(a=>a.onclick=e=>{e.preventDefault();mode=a.dataset.md;store.set("zkMode",mode);view.querySelectorAll("[data-md]").forEach(x=>x.setAttribute("aria-selected",x===a));$("#zsesbox").hidden=mode!=="ses";if(mode!=="ses")stopL()});
  $("#zsm").onchange=e=>{smode=e.target.value;store.set("zkSes",smode)};
  // sesle sayma
  let listening=false,pos=0,lastT="";
  const say=(a,t)=>{if(!a||!a.key)return 0;const m=zNorm(t).match(new RegExp(a.key.source,"g"));return m?m.length:0};
  const stopL=()=>{listening=false;Speech.stop();$("#zmic").textContent="Dinlemeyi başlat";$("#zmic").classList.remove("ghost")};
  $("#zmic").onclick=()=>{if(listening){stopL();return}
    if(!Speech.supported()){$("#zsesinfo").textContent="Bu cihazda ses tanıma desteklenmiyor. Ekrana dokunarak sayabilirsin.";return}
    listening=true;pos=0;lastT="";$("#zmic").textContent="Dinlemeyi durdur";$("#zmic").classList.add("ghost");$("#zsesinfo").textContent="Dinleniyor… Zikri sesli oku.";
    Speech.start({lang:"tr-TR",continuous:true,
      onText:(t,fin)=>{lastT=t;
        if(smode==="tani"){const N=zNorm(t);if(pos>N.length)pos=N.length;let guard=0;
          while(guard++<500){const a=A();if(!a.key){if(fin)inc(1);break}const re=new RegExp(a.key.source,"g");re.lastIndex=pos;const m=re.exec(N);if(!m)break;pos=m.index+m[0].length;inc(1)}}
        else if(fin)inc(1)},
      onSession:()=>{pos=0;lastT=""},
      onError:c=>{if(c==="not-allowed"||c==="service-not-allowed"){stopL();$("#zsesinfo").textContent="Mikrofon izni verilmedi. Ekrana dokunarak sayabilirsin."}else if(c==="file-ended"||c==="no-speech-end"){stopL();$("#zsesinfo").textContent="Dinleme durdu. Devam etmek için tekrar başlat."}},
      onState:on=>{if(!on&&listening)stopL()}})};
  playerStop=()=>{Speech.stop()};
  draw();window.scrollTo(0,0)}

function vZikirArsiv(){
  setHeader("Zikir Arşivim",()=>{location.hash="tesbih"});
  const L=store.get("zkGun",{});const gunler=Object.keys(L).sort().reverse();let fil=store.get("zkFil","Tümü");
  const top={};let toplam=0,tur=0;gunler.forEach(g=>Object.entries(L[g]).forEach(([a,r])=>{top[a]=top[a]||{c:0,t:0,g:0};top[a].c+=r.c;top[a].t+=r.t;top[a].g++;toplam+=r.c;tur+=r.t}));
  // seri: bugünden geriye kesintisiz gün sayısı
  let seri=0;{const d=new Date();if(!L[gunKey(d)])d.setDate(d.getDate()-1);while(L[gunKey(d)]){seri++;d.setDate(d.getDate()-1)}}

        ${rows.map(([a,r])=>`<div class="result-row"><span>${esc(a)}${r.t?` <span class="gchip g-ok">${r.t} tur tamam</span>`:""}</span><b class="tnum">${r.c.toLocaleString("tr-TR")}</b></div>`).join("")}</div>`}).join(""):`<p class="muted">Bu seçime ait kayıt yok.</p>`};

      <div><div class="lbl">Toplam zikir</div><b class="tnum" style="font-size:24px">${toplam.toLocaleString("tr-TR")}</b></div>
      <div><div class="lbl">Tamamlanan tur</div><b class="tnum" style="font-size:24px">${tur}</b></div>
      <div><div class="lbl">Zikir günü</div><b class="tnum" style="font-size:24px">${gunler.length}</b></div>
      <div><div class="lbl">Seri</div><b class="tnum" style="font-size:24px">${seri} gün</b></div></div></div>
    <h2>Zikirlere göre toplam</h2><div class="card">${Object.entries(top).sort((a,b)=>b[1].c-a[1].c).map(([a,r])=>`<div class="result-row"><span>${esc(a)}<br><span class="small muted">${r.g} gün${r.t?` · ${r.t} tur tamamlandı`:""}</span></span><b class="tnum">${r.c.toLocaleString("tr-TR")}</b></div>`).join("")}</div>
    <h2>Günlere göre</h2><select id="zafil" style="width:100%;margin-bottom:10px">${["Tümü",...Object.keys(top)].map(a=>`<option ${a===fil?"selected":""}>${esc(a)}</option>`).join("")}</select><div id="zalist"></div>
    <div class="row" style="margin-top:12px;gap:8px"><button class="btn ghost small" id="zaex">Yedeği indir</button><button class="btn ghost small" id="zasil">Arşivi temizle</button></div>
    <p class="small muted">Kayıtlar yalnızca bu cihazda saklanır.</p>`
    :`<div class="card" style="margin-top:12px;text-align:center"><p>Henüz kayıtlı zikir yok.</p><p class="small muted">Zikirmatik'te çektiğin her zikir gün gün buraya kaydedilir.</p><a class="btn" href="#tesbih" style="text-decoration:none">Zikre başla</a></div>`;
  if(!gunler.length){window.scrollTo(0,0);return}
  draw();$("#zafil").onchange=e=>{fil=e.target.value;store.set("zkFil",fil);draw()};
  $("#zaex").onclick=()=>{const b=new Blob([JSON.stringify(L,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="zikir-arsivi-"+gunKey()+".json";a.click()};
  let onay=false;$("#zasil").onclick=e=>{if(!onay){onay=true;e.target.textContent="Emin misin? Tekrar dokun";setTimeout(()=>{onay=false;if(document.body.contains(e.target))e.target.textContent="Arşivi temizle"},4000);return}store.set("zkGun",{});vZikirArsiv()};
  window.scrollTo(0,0)}

    <div class="kstat" id="kstat" aria-live="polite">Pusulayı başlatmak için aşağıdaki butona bas</div>
    <div class="rugwrap"><div class="rugrot" id="rugrot" style="transform:rotate(${q}deg)">${seccadeSVG()}</div></div>
    <div class="kdeg tnum"><span id="kdiff">${q.toFixed(0)}°</span><small id="ksub">kuzeyden saat yönünde</small></div>
    <div class="dialwrap"><div class="phonemark" aria-hidden="true"></div><div class="dialrot" id="dialrot">${dialSVG(q)}</div></div>
    <p class="small muted" style="text-align:center;margin:4px 0">${esc(loc.name)} · Kıble açısı ${q.toFixed(1)}°</p>
    <div class="row" style="justify-content:center"><button class="btn" id="cmp">Pusulayı başlat</button><label class="row small"><input type="checkbox" id="ksnd" ${store.get("kibleSes",true)?"checked":""}> Onay sesi</label></div>
    <p class="small muted" style="text-align:center;max-width:42ch;margin:8px auto 0">Telefonu yere paralel tut ve kendi etrafında yavaşça dön. Seccade yeşile dönünce kıbleye bakıyorsun. Metal eşya ve mıknatıslardan uzak dur; gerekirse telefonu havada 8 çizerek pusulayı ayarla.</p>
  </div>`;
  $("#ksnd").onchange=e=>store.set("kibleSes",e.target.checked);
  let aligned=false,last=null,smooth=null;
  const onO=e=>{let h=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.absolute||e.type==="deviceorientationabsolute")&&e.alpha!=null?360-e.alpha:null;if(h==null)return;
    const rr=$("#rugrot");if(!rr){window.removeEventListener(orientH.t,orientH.f);orientH=null;return}
    if(smooth==null)smooth=h;else{let d=((h-smooth+540)%360)-180;smooth=(smooth+d*0.25+360)%360}
    const rel=((q-smooth+540)%360)-180;            // telefonun üst kenarına göre kıble farkı (-180..180)
    rr.style.transform=`rotate(${rel}deg)`;$("#dialrot").style.transform=`rotate(${-smooth}deg)`;
    const ad=Math.abs(rel);$("#kdiff").textContent=ad<1?"0°":Math.round(ad)+"°";
    $("#ksub").textContent=ad<=5?"Kıble yönündesin":rel>0?"sağa dön":"sola dön";
    if(!aligned&&ad<=5){aligned=true;view.querySelector(".kible").classList.add("ok");$("#kstat").textContent="Seccade kıbleye bakıyor ✓";if(store.get("kibleSes",true))okSound()}
    else if(aligned&&ad>10){aligned=false;view.querySelector(".kible").classList.remove("ok");$("#kstat").textContent="Seccade yeşile dönene kadar yavaşça dön"}
    last=Date.now()};
  $("#cmp").onclick=async()=>{let perm="granted";try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)perm=await DeviceOrientationEvent.requestPermission()}catch(e){}
    try{kibleAudio=kibleAudio||new (window.AudioContext||window.webkitAudioContext)();kibleAudio.resume&&kibleAudio.resume()}catch(e){}
    const t="ondeviceorientationabsolute" in window?"deviceorientationabsolute":"deviceorientation";if(orientH)window.removeEventListener(orientH.t,orientH.f);orientH={t,f:onO};window.addEventListener(t,onO);
    $("#kstat").textContent="Pusula dinleniyor…";$("#cmp").hidden=true;
    setTimeout(()=>{if(!last&&$("#kstat")){$("#kstat").textContent=perm!=="granted"?"Pusula izni verilmedi. Telefon ayarlarından hareket ve yön sensörü iznini aç.":"Bu cihazda pusula sensörü bulunamadı";$("#cmp").hidden=false}},3000)};
}

/* ---------- MERAK EDİLENLER: konulara göre sık sorulan sorular ---------- */
const SSS_KAT=["İnanç","Temizlik","Namaz","Oruç","Zekât ve Sadaka","Hac ve Kurban","Kur'an ve Dua","Günlük Hayat","Aile","Ölüm ve Âhiret","Peygamberimiz"];
const SSS_EK=[
["İnanç","Allah'ı görebilir miyiz?","Dünya hayatında Allah gözle görülemez. Ehl-i Sünnet'e göre müminler âhirette Allah'ı, nasıl olduğunu bilemeyeceğimiz bir şekilde göreceklerdir.","En'âm 103; Kıyâme 22-23"],
["İnanç","Kader nedir, insan kaderine mahkûm mudur?","Kader, Allah'ın olacak her şeyi ezelî ilmiyle bilmesi ve takdir etmesidir. Allah'ın bilmesi insanı zorlamaz; insan kendi iradesiyle seçer ve seçiminden sorumludur.","İnsân 3; Kehf 29"],
["İnanç","Melekler kimlerdir, onları görebilir miyiz?","Melekler Allah'ın nurdan yarattığı, O'na asla isyan etmeyen varlıklardır. Normalde gözle görülmezler. Cebrâil, Mikâil, İsrâfil ve Azrâil büyük meleklerdir; Kirâmen Kâtibîn melekleri insanın amellerini yazar.","Tahrîm 6; İnfitâr 10-12"],
["İnanç","Cinler gerçekten var mı?","Evet. Kur'an'a göre cinler ateşten yaratılmış, gözle görülmeyen ve insanlar gibi dinî sorumluluğu olan varlıklardır. Aralarında mümin olanları da inkârcı olanları da vardır.","Rahmân 15; Zâriyât 56; Cin suresi"],
["İnanç","Şefaat nedir?","Şefaat, kıyamet gününde Allah'ın izin verdiği peygamberlerin ve salih kulların günahkâr müminler için af dilemesidir. Allah'ın izni olmadan kimse şefaat edemez.","Bakara 255; Tâhâ 109"],
["İnanç","Kabir hayatı ve kabir azabı var mıdır?","Ehl-i Sünnet âlimlerine göre ölümle kıyamet arasında bir kabir (berzah) hayatı vardır; müminler orada nimet, inkârcılar ve bazı günahkârlar azap görür. Peygamberimiz kabir azabından Allah'a sığınırdı.","Mü'minûn 100; Buhârî, Cenâiz; Müslim, Mesâcid"],
["İnanç","Peygamberimizden sonra peygamber gelecek mi?","Hayır. Hz. Muhammed son peygamberdir; ondan sonra peygamber gelmeyecektir.","Ahzâb 40"],
["İnanç","Şirk nedir?","Şirk, Allah'a zâtında, sıfatlarında, fiillerinde ya da ibadette ortak koşmaktır. Kur'an'a göre en büyük günahtır; tövbe edilmeden ölünürse affedilmez.","Nisâ 48; Lokmân 13"],
["İnanç","Tövbe edilen günah affedilir mi?","Samimi tövbeyi Allah kabul eder ve dilediği günahı bağışlar. Tövbenin şartları: günahtan pişman olmak, hemen bırakmak, bir daha yapmamaya karar vermek ve kul hakkı varsa sahibine ödemek ya da helallik almaktır.","Zümer 53; Tahrîm 8"],
["İnanç","Kul hakkı nasıl ödenir?","Alınan hak sahibine geri verilir ya da helallik istenir. Hak sahibi vefat etmişse varislerine ödenir; kendisine ve varislerine ulaşılamıyorsa onun adına sadaka olarak verilir. Kul hakkı yalnız tövbeyle düşmez.","Buhârî, Mezâlim"],
["İnanç","Nazar gerçek mi, nazardan nasıl korunulur?","Peygamberimiz \"Nazar haktır\" buyurmuştur. Nazardan korunmak için Felak ve Nâs surelerini okumak ve Allah'a sığınmak tavsiye edilir. Nazarlık gibi eşyalara koruyucu güç yüklemek doğru değildir; koruyan yalnız Allah'tır.","Buhârî, Tıb; Müslim, Selâm"],
["İnanç","Rüyalar neyi ifade eder?","Peygamberimiz güzel rüyanın Allah'tan, kötü rüyanın şeytandan olduğunu bildirmiştir. Güzel rüya sevilen kişilere anlatılır; kötü rüya görülünce Allah'a sığınılır ve kimseye anlatılmaz. Rüyalar dinî hüküm kaynağı değildir.","Buhârî, Ta'bîr; Müslim, Rü'yâ"],
["Namaz","Namaz kılmayan kişi Müslüman sayılır mı?","Ehl-i Sünnet'e göre namazın farz olduğuna inanan ama tembellikle kılmayan kişi dinden çıkmaz, büyük günah işlemiş olur. Namazın farz olduğunu inkâr eden ise dinden çıkar.","Diyanet İlmihali"],
["Namaz","Kadınlar camide namaz kılabilir mi?","Evet. Peygamberimiz \"Allah'ın kadın kullarını Allah'ın mescidlerine gitmekten alıkoymayın\" buyurmuştur. Kadınlar cemaate ve Cuma namazına katılabilir.","Buhârî, Cuma; Müslim, Salât"],
["Namaz","Namazda Türkçe dua edilebilir mi?","Namazda okunan sureler ve dualar Arapça okunur. Namazdan sonra ve namaz dışında kişi dilediği dilde dua edebilir.","Diyanet İlmihali (Hanefî)"],
["Namaz","Namazları birleştirerek (cem) kılmak caiz mi?","Hanefî mezhebinde namazlar yalnız hac sırasında Arafat ve Müzdelife'de birleştirilir. Diyanet, yolculuk ve ağır hastalık gibi zor durumlarda Şâfiî ve Hanbelî mezheplerine göre cem yapılabileceğini belirtir.","Diyanet İşleri Başkanlığı"],
["Namaz","Namazda telefon çalarsa ne yapılır?","Telefonu tek elle, az bir hareketle kapatmak namazı bozmaz. Dışarıdan bakanın namaz kılmadığını düşüneceği kadar çok hareket ise namazı bozar. En iyisi namazdan önce telefonu sessize almaktır.","Diyanet İlmihali"],
["Namaz","Namaz kaç yaşında farz olur?","Namaz, akıllı her Müslümana ergenlik çağına girince farz olur. Peygamberimiz çocuklara yedi yaşında namazın öğretilmesini tavsiye etmiştir.","Ebû Dâvûd, Salât; Tirmizî, Salât"],
["Namaz","Teheccüd namazı nedir?","Gece bir miktar uyuduktan sonra kalkıp kılınan nafile namazdır. İkiden sekize kadar rekât kılınabilir; Kur'an'da övülmüştür.","İsrâ 79; Müzzemmil 1-6"],
["Namaz","Kuşluk (duhâ) namazı ne zaman kılınır?","Güneş doğup kerahat vakti çıktıktan sonra öğleye kadar kılınan nafile namazdır. En az iki rekâttır.","Müslim, Müsâfirîn"],
["Namaz","İstihare nasıl yapılır?","Önemli bir iş için iki rekât namaz kılınır ve Peygamberimizin öğrettiği istihare duası okunur. Rüya görmek şart değildir; kalbin yöneldiği ve işin kolaylaştığı taraf tercih edilir.","Buhârî, Teheccüd; Daavât"],
["Namaz","Cenaze namazı nasıl kılınır?","Ayakta, rükû ve secde olmadan dört tekbirle kılınır. Birinci tekbirden sonra \"ve celle senâük\" ile Sübhâneke, ikinciden sonra Salli ve Bârik, üçüncüden sonra cenaze duası (bilmeyen Rabbenâ âtinâ okuyabilir) okunur. Dördüncü tekbirden sonra iki tarafa selam verilir.","Diyanet İlmihali (Hanefî)"],
["Namaz","Kadınlar özel hâllerinde Kur'an okuyabilir mi?","Hanefî mezhebine göre âdet ve lohusalık hâlinde Kur'an okunmaz ve mushafa dokunulmaz. Dua niyetiyle dua ayetlerini okumak, zikir, tesbih ve salavat getirmek, Kur'an dinlemek caizdir.","Diyanet İlmihali (Hanefî)"],
["Temizlik","Tırnak veya saç kesmek abdesti bozar mı?","Bozmaz. Abdestliyken tırnak, saç veya sakal kesmek abdesti etkilemez.","Diyanet İlmihali"],
["Temizlik","Oje ve kına abdeste engel mi?","Suyun tırnağa ulaşmasını engelleyen oje abdest ve gusle engeldir; abdestten önce çıkarılmalıdır. Kına ise su geçirmeyen bir tabaka oluşturmadığı için engel değildir.","Diyanet İlmihali"],
["Temizlik","Diş dolgusu ve kaplama gusle engel mi?","Diyanet'e göre tedavi amaçlı dolgu, kaplama ve köprü gusle engel değildir; gusül geçerlidir.","Diyanet İşleri Başkanlığı"],
["Temizlik","Lens takılıyken abdest alınabilir mi?","Evet. Gözün içini yıkamak gerekmediği için lens abdeste ve gusle engel değildir.","Diyanet İlmihali"],
["Oruç","Orucu bozan şeyler nelerdir?","Bilerek yemek, içmek, cinsel ilişki, isteyerek ağız dolusu kusmak, sigara içmek ve ağızdan ya da burundan mideye ulaşan şeyler orucu bozar.","Diyanet İlmihali (Hanefî)"],
["Oruç","Unutarak yiyip içen kişinin orucu bozulur mu?","Bozulmaz. Peygamberimiz \"Oruçlu iken unutarak yiyip içen orucunu tamamlasın; onu Allah yedirmiş, içirmiştir\" buyurmuştur. Hatırlayınca hemen bırakılır.","Buhârî, Savm; Müslim, Sıyâm"],
["Oruç","Kan vermek ve iğne olmak orucu bozar mı?","Kan aldırmak orucu bozmaz. Besleyici olmayan iğneler orucu bozmaz; besleyici serum ve gıda yerine geçen iğneler ise bozar.","Diyanet İşleri Başkanlığı"],
["Oruç","Oruçluyken diş fırçalanır mı?","Diş fırçalamak orucu bozmaz; ancak macunun ve suyun boğaza kaçmamasına dikkat edilmelidir. Misvak kullanmak sünnettir.","Diyanet İlmihali"],
["Oruç","Sahura kalkamayan oruç tutabilir mi?","Evet. Sahur sünnettir, şart değildir. Ramazan orucu için niyet geceden yapılabileceği gibi, imsaktan sonra hiçbir şey yenmemişse öğleden önceki belirli vakte kadar da yapılabilir.","Diyanet İlmihali (Hanefî)"],
["Oruç","Kaza ile kefaret arasındaki fark nedir?","Kaza, tutulamayan her oruç için bir gün tutmaktır. Kefaret, Ramazan orucunu özürsüz olarak bilerek yiyip içerek veya cinsel ilişkiyle bozana gerekir: 60 gün aralıksız oruç tutulur; buna gücü yetmeyen 60 fakiri doyurur. Ayrıca bozulan günün kazası tutulur.","Buhârî, Savm; Diyanet İlmihali"],
["Oruç","Hasta, hamile ve emzikliler oruç tutmak zorunda mı?","Oruç tutması kendisine ya da bebeğine zarar verecek olanlar tutmayabilir ve daha sonra kaza eder. İyileşme ümidi olmayan hastalar ve çok yaşlılar her gün için fidye verir.","Bakara 184-185"],
["Oruç","Fitre (fıtır sadakası) nedir, ne zaman verilir?","Fitre, Ramazan Bayramı'na ulaşan ve temel ihtiyaçları dışında nisap miktarı mala sahip olan Müslümanın kendisi ve bakmakla yükümlü olduğu kişiler için verdiği sadakadır. Bayram namazından önce verilmesi tavsiye edilir. Miktarı her yıl Diyanet tarafından açıklanır.","Buhârî, Zekât; Diyanet İşleri Başkanlığı"],
["Zekât ve Sadaka","Zekât kimlere farzdır?","Akıllı, ergen ve temel ihtiyaçları ile borçları dışında nisap miktarı (80,18 gram altın veya değeri) mala sahip olan Müslümana farzdır. Mal üzerinden bir kamerî yıl geçince kırkta biri (yüzde 2,5) verilir.","Tevbe 103; Diyanet İşleri Başkanlığı"],
["Zekât ve Sadaka","Zekât kimlere verilir, kimlere verilmez?","Zekât fakirlere, yoksullara, borçlulara, yolda kalmışlara ve Kur'an'da sayılan diğer gruplara verilir. Kişinin anne-babasına, dedelerine, çocuklarına, torunlarına ve eşine zekât verilmez; bunların bakımı zaten onun görevidir.","Tevbe 60"],
["Zekât ve Sadaka","Kardeşe zekât verilebilir mi?","Evet. İhtiyaç sahibi kardeşe, amca, dayı, hala ve teyzeye zekât verilebilir; akrabaya vermek hem zekât hem sıla-i rahim sevabı kazandırır.","Nesâî, Zekât; Tirmizî, Zekât"],
["Zekât ve Sadaka","Takılan altınların zekâtı verilir mi?","Hanefî mezhebine göre kullanılan ziynet altınları da nisap miktarına ulaşınca zekâta tâbidir.","Diyanet İlmihali (Hanefî)"],
["Hac ve Kurban","Hac kimlere farzdır?","Akıllı, ergen, sağlıklı, yol güvenliği olan ve gidiş-dönüş ile ailesinin geçimini karşılayacak maddi imkâna sahip Müslümana ömründe bir kez farzdır.","Âl-i İmrân 97"],
["Hac ve Kurban","Umre farz mı?","Hanefî mezhebine göre umre farz değil, ömürde bir kez yapılması sünnet-i müekkededir.","Diyanet İlmihali (Hanefî)"],
["Hac ve Kurban","Kurban kesmek kimlere vaciptir?","Hanefî mezhebine göre akıllı, ergen, yolcu olmayan ve temel ihtiyaçları dışında nisap miktarı mala sahip Müslümana Kurban Bayramı günlerinde kurban kesmek vaciptir.","Kevser 2; Diyanet İlmihali (Hanefî)"],
["Hac ve Kurban","Kurban eti nasıl paylaştırılır?","Etin üçte birini ev için ayırmak, üçte birini akraba ve komşulara, üçte birini yoksullara vermek güzeldir. Tamamını dağıtmak da evde tüketmek de caizdir.","Hac 28, 36"],
["Hac ve Kurban","Kurban yerine parasını bağışlamak olur mu?","Olmaz. Kurban ibadeti hayvan kesmekle yerine gelir; parasını bağışlamak kurban borcunu düşürmez. Kişi güvendiği bir kuruma vekâlet vererek kurbanını kestirebilir.","Diyanet İşleri Başkanlığı"],
["Kur'an ve Dua","Abdestsiz Kur'an okunur mu?","Kur'an ezberden abdestsiz okunabilir. Mushafa dokunmak için abdest gerekir. Telefon veya tabletten ekrana dokunmadan abdestsiz okumak caizdir.","Vâkıa 79; Diyanet İşleri Başkanlığı"],
["Kur'an ve Dua","Ölülere okunan Kur'an'ın sevabı ulaşır mı?","Ehl-i Sünnet âlimlerinin çoğunluğuna göre okunan Kur'an, yapılan dua ve sadakanın sevabı bağışlandığı kişiye ulaşır.","Diyanet İşleri Başkanlığı"],
["Kur'an ve Dua","Duaların kabul olduğu vakitler hangileridir?","Gecenin son üçte biri, ezan ile kamet arası, secde hâli, Cuma günü, oruçlunun iftar vakti ve yolculuk sırasında yapılan duaların kabule daha yakın olduğu bildirilmiştir. Allah her duayı işitir.","Bakara 186; Buhârî, Teheccüd; Müslim, Salât; Tirmizî, Daavât"],
["Kur'an ve Dua","Kandil gecelerinde özel bir namaz var mı?","Mevlid, Regâib, Mi'rac, Berat ve Kadir geceleri ibadetle değerlendirilen mübarek gecelerdir. Bu gecelere özgü, sünnetle belirlenmiş özel bir namaz yoktur; kişi dilediği kadar nafile namaz kılar, Kur'an okur, dua ve tövbe eder. Kadir Gecesi'nin fazileti Kur'an'da bildirilmiştir.","Kadir suresi; Diyanet İşleri Başkanlığı"],
["Kur'an ve Dua","Salavat nedir, nasıl getirilir?","Salavat, Peygamberimiz için Allah'tan rahmet dilemektir. En kısa şekli \"Allâhümme salli alâ seyyidinâ Muhammed\"tir; namazda okunan Salli ve Bârik duaları da salavattır.","Ahzâb 56"],
["Kur'an ve Dua","Besmele ne zaman çekilir?","Yemek, yolculuk, okuma gibi her güzel işe başlarken \"Bismillâhirrahmânirrahîm\" denir. Kur'an okurken Tevbe suresi dışındaki sure başlarında besmele çekilir.","Neml 30; Buhârî, Et'ime"],
["Günlük Hayat","Faiz haram mıdır?","Evet. Faiz (ribâ) Kur'an'da açıkça haram kılınmıştır. Borç ve birikimde faiz içermeyen yollar tercih edilmeli, kredi kartı borcu gecikme faizine düşmeden zamanında ödenmelidir.","Bakara 275-279"],
["Günlük Hayat","Dövme yaptırmak caiz mi?","Peygamberimiz dövme yapanı ve yaptıranı kınamıştır; bu nedenle dövme yaptırmak caiz değildir. Daha önce yaptırılmış dövme abdest ve gusle engel olmaz; kişi tövbe eder.","Buhârî, Libâs; Müslim, Libâs"],
["Günlük Hayat","Erkekler altın takabilir mi?","Erkeklerin altın ve ipek giyip takması haramdır. Erkekler gümüş yüzük takabilir.","Tirmizî, Libâs; Nesâî, Zînet"],
["Günlük Hayat","Evde köpek beslemek caiz mi?","Bekçilik, av ve çobanlık gibi ihtiyaçlar için köpek beslemek caizdir. İhtiyaç olmadan, özellikle ev içinde köpek beslemek hadislerde hoş görülmemiştir. Her hayvana iyi davranmak ise görevdir.","Buhârî, Hars ve Müzâraa; Müslim, Müsâkât"],
["Günlük Hayat","Hayvanlara kötü davranmanın hükmü nedir?","Haramdır. Peygamberimiz bir kediyi aç bırakarak ölümüne sebep olan kadının cezalandırıldığını, susuz bir köpeğe su veren kişinin ise bağışlandığını haber vermiştir.","Buhârî, Müsâkât; Müslim, Selâm"],
["Günlük Hayat","Alkollü içecekler ve domuz ürünleri neden haramdır?","Kur'an şarabı ve sarhoş edici her şeyi, domuz etini ve domuzdan elde edilen ürünleri haram kılmıştır. Domuz kaynaklı jelatin de haramdır; helal sertifikalı ürünler tercih edilmelidir.","Mâide 3, 90; Bakara 173"],
["Günlük Hayat","Müzik dinlemek haram mı?","Diyanet'e göre sözleri ve etkisi dinin yasakladığı şeyleri içermeyen, insanı haramlara ve görevlerini ihmal etmeye sürüklemeyen müziği dinlemek caizdir.","Diyanet İşleri Başkanlığı"],
["Günlük Hayat","Selam vermek ve almak zorunlu mu?","Selam vermek sünnet, selamı almak ise vaciptir. Verilen selama aynısıyla ya da daha güzeliyle karşılık verilir.","Nisâ 86; Müslim, Selâm"],
["Günlük Hayat","Gıybet nedir?","Gıybet, bir kişiyi yokluğunda, duysa hoşlanmayacağı şekilde anmaktır. Söylenen doğruysa gıybet, doğru değilse iftiradır. Kur'an gıybeti ölü kardeşinin etini yemeye benzetir.","Hucurât 12; Müslim, Birr"],

/* ---------- FİTRE / ZEKÂT ARŞİVİ VE ANALİZİ ---------- */
// Diyanet Din İşleri Yüksek Kurulu'nun yıllara göre kişi başı fitre miktarları (TL)
const FITRE_YIL={2022:40,2023:70,2024:130,2025:180,2026:240};
const ARS_TUR=["Fitre","Zekât","Fidye","Sadaka","Kurban"];
const arsGet=()=>{const a=store.get("arsiv",[]);return Array.isArray(a)?a:[]};
const arsSet=a=>store.set("arsiv",a);
const arsAdd=r=>{const a=arsGet();a.push(Object.assign({id:Date.now()+Math.random().toString(36).slice(2,6),tarih:new Date().toISOString().slice(0,10)},r));arsSet(a);return a};
const pct=(a,b)=>b?((a-b)/b*100):null;
const chg=(a,b)=>{const d=a-b,p=pct(a,b);const cls=d>0?"up":d<0?"down":"eq";return `<span class="chgc ${cls}">${d>0?"▲":d<0?"▼":"="} ${tl(Math.abs(d))}${p!=null&&isFinite(p)?` · %${Math.abs(p).toLocaleString("tr-TR",{maximumFractionDigits:1})}`:""}</span>`};
function arsChart(years,by,key,cls,title){
  if(!years.length)return"";
  const W=320,H=150,P=8,n=years.length,slot=(W-2*P)/n,bw=Math.min(36,slot*.55);const max=Math.max(1,...years.map(y=>by[y][key]));
  const yv=v=>H-24-(v/max)*(H-48);
  const short=v=>v>=1e6?(v/1e6).toLocaleString("tr-TR",{maximumFractionDigits:1})+" mn":v>=1e4?Math.round(v/1e3).toLocaleString("tr-TR")+" bin":Math.round(v).toLocaleString("tr-TR");
  const bars=years.map((y,i)=>{const cx=P+i*slot+(slot-bw)/2,v=by[y][key];return `<rect x="${cx}" y="${yv(v)}" width="${bw}" height="${Math.max(0,H-24-yv(v))}" rx="4" class="${cls}"><title>${y}: ${tl(v)}</title></rect>
    <text x="${cx+bw/2}" y="${yv(v)-5}" class="cv" text-anchor="middle">${v?short(v):"—"}</text><text x="${cx+bw/2}" y="${H-8}" class="ct" text-anchor="middle">${y}</text>`}).join("");
  return `<div class="chartbox"><div class="lbl">${title} (TL)</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Yıllara göre ${title}"><line x1="${P}" x2="${W-P}" y1="${H-24}" y2="${H-24}" class="cg"/>${bars}</svg></div>`}
function vArsiv(){
  setHeader("Fitre ve Zekât Arşivim",()=>{location.hash="hesap"});
  const a=arsGet();const yNow=new Date().getFullYear(),yPrev=yNow-1;
  const by={};for(const r of a){const y=+r.yil;by[y]=by[y]||{Fitre:0,"Zekât":0,Fidye:0,Sadaka:0,Kurban:0,fk:0,net:0};by[y][r.tur]=(by[y][r.tur]||0)+(+r.tutar||0);if(r.tur==="Fitre")by[y].fk+=(+r.kisi||0);if(r.tur==="Zekât"&&r.net)by[y].net+=(+r.net||0)}
  const z={Fitre:0,"Zekât":0,Fidye:0,Sadaka:0,Kurban:0,fk:0,net:0};const C=by[yNow]||z,P=by[yPrev]||z;
  const years=Object.keys(by).map(Number).sort((x,y)=>x-y).slice(-6);
  // fitre farkının ayrıştırılması: kişi başı miktar etkisi + kişi sayısı etkisi
  let fitreAciklama="";
  if(C.Fitre&&P.Fitre&&C.fk&&P.fk){const kpN=C.Fitre/C.fk,kpP=P.Fitre/P.fk;const miktarEtkisi=(kpN-kpP)*P.fk,kisiEtkisi=(C.fk-P.fk)*kpN;
    fitreAciklama=`<div class="small fdec"><div><span>Kişi başı miktar değişimi (${tl(kpP)} → ${tl(kpN)})</span><b class="tnum">${tl(miktarEtkisi)}</b></div><div><span>Kişi sayısı değişimi (${P.fk} → ${C.fk})</span><b class="tnum">${tl(kisiEtkisi)}</b></div></div>`}
  else if(FITRE_YIL[yNow]&&FITRE_YIL[yPrev])fitreAciklama=`<p class="small muted" style="margin:8px 0 0">Diyanet'in kişi başı fitresi ${yPrev}'de ${tl(FITRE_YIL[yPrev])}, ${yNow}'da ${tl(FITRE_YIL[yNow])} (%${pct(FITRE_YIL[yNow],FITRE_YIL[yPrev]).toLocaleString("tr-TR",{maximumFractionDigits:1})} artış).</p>`;
  const card=(t,cur,prev,extra)=>`<div class="card acard"><div class="lbl">${t}</div><div class="arow"><div><small>${yPrev}</small><b class="tnum">${tl(prev)}</b></div><div><small>${yNow}</small><b class="tnum">${tl(cur)}</b></div></div><div class="afark">Fark: ${chg(cur,prev)}</div>${extra||""}</div>`;
  const list=[...a].sort((x,y)=>(y.yil-x.yil)||String(y.tarih).localeCompare(String(x.tarih)));
  view.innerHTML=`<p class="muted small" style="margin:12px 0">Ödediğin fitre, zekât, fidye ve sadakaları yıl yıl kaydet; uygulama geçen yılla karşılaştırıp farkı gösterir. Kayıtlar yalnız bu cihazda saklanır.</p>
  ${a.length?`<div class="acards">${card("Fitre",C.Fitre,P.Fitre,fitreAciklama+(C.fk||P.fk?`<p class="small muted" style="margin:6px 0 0">Kişi sayısı: ${P.fk||"—"} → ${C.fk||"—"}</p>`:""))}
    ${card("Zekât",C["Zekât"],P["Zekât"],C.net||P.net?`<p class="small muted" style="margin:6px 0 0">Zekâta tâbi net varlık: ${P.net?tl(P.net):"—"} → ${C.net?tl(C.net):"—"}${C.net&&P.net?" ("+chg(C.net,P.net)+")":""}</p>`:"")}
    ${card("Toplam (fitre, zekât, fidye, sadaka, kurban)",C.Fitre+C["Zekât"]+C.Fidye+C.Sadaka+C.Kurban,P.Fitre+P["Zekât"]+P.Fidye+P.Sadaka+P.Kurban)}</div>
    <h2>Yıllara göre</h2><div class="charts2">${arsChart(years,by,"Fitre","cb1","Fitre")}${arsChart(years,by,"Zekât","cb2","Zekât")}</div>
    <div class="scroll-x card" style="margin-top:10px"><table class="rk tnum"><thead><tr><th>Yıl</th><th>Fitre</th><th>Zekât</th><th>Fidye</th><th>Sadaka</th><th>Kurban</th></tr></thead><tbody>${[...years].reverse().map(y=>`<tr><th scope="row">${y}</th><td>${tl(by[y].Fitre)}</td><td>${tl(by[y]["Zekât"])}</td><td>${tl(by[y].Fidye)}</td><td>${tl(by[y].Sadaka)}</td><td>${tl(by[y].Kurban)}</td></tr>`).join("")}</tbody></table></div>`
  :`<div class="card empty"><b>Henüz kayıt yok</b><p class="small muted" style="margin:6px 0 0">Fitre ve Zekât hesaplama ekranında "Arşive kaydet"e basarak ya da aşağıdaki formla ödediğin tutarları ekleyebilirsin. İki yıllık kayıt olunca karşılaştırma burada görünür.</p></div>`}
  <h2>Kayıt ekle</h2>
  <form class="card grid2" id="af">
    <label class="fld"><span>Yıl</span><select id="ay">${Array.from({length:8},(_,i)=>yNow-i).map(y=>`<option ${y===yNow?"selected":""}>${y}</option>`).join("")}</select></label>
    <label class="fld"><span>Tür</span><select id="at">${ARS_TUR.map(t=>`<option>${t}</option>`).join("")}</select></label>
    <label class="fld" id="akw"><span>Kişi sayısı</span><input id="ak" inputmode="numeric" placeholder="1"><small id="akh"></small></label>
    <label class="fld"><span>Ödenen tutar (TL)</span><input id="am" inputmode="decimal" placeholder="0"></label>
    <label class="fld"><span>Not (isteğe bağlı)</span><input id="an" maxlength="60" placeholder="ör. Kızılay, komşu ailesi"></label>
    <div class="row" style="align-self:end"><button class="btn" type="submit">Kaydet</button></div>
  </form>
  <h2>Kayıtlarım ${a.length?`<span class="count">${a.length}</span>`:""}</h2>
  <div class="stack" id="alist">${list.length?list.map(r=>`<div class="card arec"><div><b>${r.yil} · ${esc(r.tur)}</b><div class="small muted">${r.kisi?r.kisi+" kişi · ":""}${r.net?"Net varlık "+tl(+r.net)+" · ":""}${esc(r.not||"")}${r.not?" · ":""}${r.tarih||""}</div></div><div class="row"><b class="tnum">${tl(+r.tutar)}</b><button class="iconbtn adel" data-id="${r.id}" aria-label="Kaydı sil"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M7 7l1 12h8l1-12M9 7V4h6v3"/></svg></button></div></div>`).join(""):'<p class="muted small">Kayıt yok.</p>'}</div>
  <div class="card" style="margin-top:14px"><div class="lbl">Diyanet'in kişi başı fitre miktarları</div><div class="scroll-x"><table class="rk tnum"><thead><tr><th>Yıl</th>${Object.keys(FITRE_YIL).map(y=>`<th>${y}</th>`).join("")}</tr></thead><tbody><tr><th scope="row">TL</th>${Object.values(FITRE_YIL).map(v=>`<td>${v}</td>`).join("")}</tr></tbody></table></div><p class="small muted" style="margin:6px 0 0">Kaynak: Diyanet İşleri Başkanlığı Din İşleri Yüksek Kurulu kararları.</p></div>
  <div class="row" style="margin-top:12px"><button class="btn ghost small" id="abak">Yedeği kopyala</button><button class="btn ghost small" id="ayuk">Yedekten geri yükle</button><button class="btn ghost small" id="asil">Tümünü sil</button></div>
  <div id="aconfirm"></div>`;
  const tur=$("#at"),kw=$("#akw");const syncK=()=>{kw.hidden=tur.value!=="Fitre"&&tur.value!=="Fidye";$("#akw span").textContent=tur.value==="Fidye"?"Gün sayısı":"Kişi sayısı";const per=FITRE_YIL[+$("#ay").value];$("#akh").textContent=per&&(tur.value==="Fitre"||tur.value==="Fidye")?`${$("#ay").value} için kişi/gün başı ${tl(per)}`:""};
  const autoAmt=()=>{const per=FITRE_YIL[+$("#ay").value],k=parseInt($("#ak").value)||0;if(per&&k&&(tur.value==="Fitre"||tur.value==="Fidye"))$("#am").value=String(per*k).replace(".",",")};
  tur.onchange=()=>{syncK();autoAmt()};$("#ay").onchange=()=>{syncK();autoAmt()};$("#ak").oninput=autoAmt;syncK();
  $("#af").onsubmit=e=>{e.preventDefault();const t=num($("#am").value);if(!t){toast("Ödenen tutarı gir");return}
    arsAdd({yil:+$("#ay").value,tur:tur.value,tutar:t,kisi:kw.hidden?0:(parseInt($("#ak").value)||0),not:$("#an").value.trim()});toast("Kaydedildi");vArsiv()};
  $("#alist").onclick=e=>{const b=e.target.closest(".adel");if(!b)return;arsSet(arsGet().filter(r=>r.id!==b.dataset.id));toast("Kayıt silindi");vArsiv()};
  $("#abak").onclick=async()=>{const t=JSON.stringify(arsGet());try{await navigator.clipboard.writeText(t);toast("Yedek panoya kopyalandı; bir yere yapıştırıp sakla")}catch(e){$("#aconfirm").innerHTML=`<textarea class="bk" readonly>${esc(t)}</textarea><p class="small muted">Metni seçip kopyala.</p>`;$("#aconfirm textarea").select()}};
  $("#ayuk").onclick=()=>{$("#aconfirm").innerHTML=`<textarea class="bk" id="bkin" placeholder="Yedek metnini buraya yapıştır"></textarea><div class="row"><button class="btn small" id="bkok">Geri yükle</button></div>`;
    $("#bkok").onclick=()=>{try{const v=JSON.parse($("#bkin").value);if(!Array.isArray(v))throw 0;arsSet(v);toast(v.length+" kayıt yüklendi");vArsiv()}catch(e){toast("Yedek metni okunamadı")}}};
  $("#asil").onclick=()=>{$("#aconfirm").innerHTML=`<div class="note">Bütün kayıtlar silinecek. Emin misin? <button class="btn small" id="sok" style="margin-left:8px">Evet, sil</button> <button class="btn ghost small" id="sno">Vazgeç</button></div>`;
    $("#sok").onclick=()=>{arsSet([]);toast("Arşiv temizlendi");vArsiv()};$("#sno").onclick=()=>{$("#aconfirm").innerHTML=""}};
  window.scrollTo(0,0)}
