function vTurbe(n){
  const t=TURBE[n];if(!t){location.hash="turbeler";return}
  if(!turbeGate){location.hash="turbeler";return}
  setHeader(t.ad,()=>{TTS.stop();location.hash="turbeler"});
  const sents=[];const paras=t.hayat.map((p,pi)=>splitSent(p).map(s=>{sents.push({t:s,p:pi});return `<span class="snt" data-i="${sents.length-1}">${esc(s)}</span>`}).join(" "));
  view.innerHTML=`<div class="story"><div class="lbl" style="margin-top:12px">${esc(t.il)} · ${esc(t.ilce)}</div><h2 style="margin-top:2px">${esc(t.ad)}</h2>
    <div class="card tmeta"><div><span>Yatan zat</span><b>${esc(t.zat)}</b></div><div><span>Dönemi</span><b>${esc(t.donem)}</b></div><div><span>Yeri</span><b>${esc(t.ilce)} / ${esc(t.il)}</b></div></div>
    <div class="row tbtns" style="margin:12px 0"><a class="btn" href="${mapUrl(t.harita)}" target="_blank" rel="noopener" style="text-decoration:none;flex:1;text-align:center">Fotoğraflar ve harita</a><button class="btn ghost" id="tdin" style="flex:1">Dinle</button></div>
    ${paras.map(p=>`<p>${p}</p>`).join("")}
    <p class="dayanak">Kaynak: ${esc(t.kaynak)}</p>
    <p class="small muted">Fotoğraflar ve harita için internet bağlantısı gerekir; Google Haritalar'da açılır.</p>
    ${uyariHTML(false)}
    <div class="row" style="justify-content:space-between;margin-top:14px">${n>0?`<a class="btn ghost small" href="#turbe-${n-1}" style="text-decoration:none">‹ Önceki</a>`:"<span></span>"}${n<TURBE.length-1?`<a class="btn small" href="#turbe-${n+1}" style="text-decoration:none">Sonraki ›</a>`:""}</div></div>`;
  const b=$("#tdin");
  const mark=i=>{view.querySelectorAll(".snt.now").forEach(x=>x.classList.remove("now"));const el=view.querySelector(`.snt[data-i="${i}"]`);if(el)el.classList.add("now")};
  const ended=err=>{b.textContent=err?"Ses başlatılamadı":"Dinle";view.querySelectorAll(".snt.now").forEach(x=>x.classList.remove("now"))};
  b.onclick=()=>{if(TTS.state().on){TTS.stop();ended()}else{TTS.setRate(+store.get("ttsRate",1));TTS.play(sents,0,mark,ended);b.textContent="Durdur"}};
  view.querySelector(".story").onclick=e=>{const s=e.target.closest(".snt");if(!s)return;TTS.play(sents,+s.dataset.i,mark,ended);b.textContent="Durdur"};
  playerStop=()=>TTS.stop();window.scrollTo(0,0)}

const ISIM_ADAB=[{"b":"Güzel isim koymak çocuğun hakkıdır","m":"Çocuğa güzel ve anlamlı bir isim koymak anne babanın görevlerindendir. Hz. Peygamber'in 'Kıyamet günü kendi isimlerinizle ve babalarınızın isimleriyle çağrılacaksınız; öyleyse isimlerinizi güzel koyun' buyurduğu rivayet edilir (senedinde kopukluk olduğu için zayıf sayılır, ancak anlamı diğer rivayetlerle desteklenir).","k":"Ebû Dâvûd, Edeb"},{"b":"Allah katında en sevimli isimler","m":"Hz. Peygamber, 'Allah katında isimlerinizin en sevimlisi Abdullah ve Abdurrahman'dır' buyurmuştur. Bu yüzden Allah'ın isimlerine 'Abd' (kul) eklenerek yapılan isimler tavsiye edilir.","k":"Müslim, Âdâb 2 (hadis no. 2132)"},{"b":"Peygamber isimleri","m":"Hz. Peygamber, 'Benim ismimle isimlenin, künyemle künyelenmeyin' buyurmuş, oğluna da Hz. İbrâhim'in adını vermiştir. Peygamberlerin ve salih kişilerin isimlerini koymak güzel görülmüştür.","k":"Buhârî, Edeb; Müslim, Âdâb"},{"b":"Kötü anlamlı isimler değiştirilir","m":"Hz. Peygamber kötü veya uygunsuz anlamlı isimleri değiştirirdi. Örneğin Hz. Ömer'in 'Âsiye' (isyankâr) adlı kızının adını 'Cemîle' (güzel) olarak, kendini övme anlamı taşıyan 'Berre' adını da 'Zeyneb' olarak değiştirmiştir.","k":"Müslim, Âdâb (hadis no. 2139); Ebû Dâvûd, Edeb"},{"b":"Doğumun yedinci günü: isim ve akîka","m":"'Her çocuk akîkasına bağlıdır; yedinci gününde onun için kurban kesilir, saçı tıraş edilir ve ona isim konur' hadisi bu günün sünnet olduğunu gösterir. İsim doğum günü de konabilir; Hz. Peygamber oğlu İbrâhim'e doğduğu gece isim vermiştir.","k":"Ebû Dâvûd, Edâhî (hadis no. 2838); Tirmizî, Edâhî; Müslim, Fezâil"},{"b":"Kulağa ezan ve kamet okunması","m":"Hz. Peygamber'in, torunu Hz. Hasan doğduğunda kulağına namaz ezanı okuduğu rivayet edilir; Tirmizî bu hadisi 'hasen sahih' saymış, bazı hadis âlimleri ise ravisi Âsım b. Ubeydullah sebebiyle zayıf bulmuştur. Sol kulağa kamet okunmasına dair rivayet ise çok zayıftır; buna rağmen sağ kulağa ezan, sol kulağa kamet okuyup ismi söylemek Müslümanlar arasında köklü bir gelenektir.","k":"Ebû Dâvûd, Edeb (hadis no. 5105); Tirmizî, Edâhî (hadis no. 1514); Beyhakî, Şuabü'l-îmân"},{"b":"Allah'a mahsus isimlerle isimlendirmemek","m":"Hz. Peygamber, 'Kıyamet günü Allah katında en kötü isim, melikü'l-emlâk (şâhânşâh, hükümdarlar hükümdarı) diye isimlenen kişinin ismidir' buyurmuştur. Allah, Rahmân, Hâlık, Rezzâk, Kuddûs gibi yalnız Allah'a ait isimler tek başına konmaz; 'Abdurrahman, Abdurrezzak' gibi 'Abd' ile birlikte konur.","k":"Buhârî, Edeb (hadis no. 6205); Müslim, Âdâb"},{"b":"Kötü anlam ve şirk çağrışımından kaçınmak","m":"Allah'tan başkasına kulluk bildiren (Abdüluzzâ gibi), çirkin, alay konusu olabilecek, kibir ve kendini temize çıkarma anlamı taşıyan isimlerden kaçınılmalıdır. İsim koymadan önce anlamını güvenilir bir sözlükten kontrol etmek gerekir.","k":"Müslim, Âdâb; Ebû Dâvûd, Edeb"},{"b":"Diyanet İşleri Başkanlığı'nın görüşü","m":"Diyanet'e göre çocuğa anlamı güzel bir isim koymak anne babanın görevidir; ismin Arapça olması şart değildir, anlamı güzel Türkçe isimler de konabilir. Allah'a mahsus isimler tek başına konmamalı, anlamı kötü veya İslam'ın ruhuna aykırı isimlerden kaçınılmalıdır.","k":"Diyanet İşleri Başkanlığı, Din İşleri Yüksek Kurulu (fetva.diyanet.gov.tr)"}];
const TARIF=[{"ad":"Mercimek Çorbası","kat":"Çorba","sure":"40 dakika","kisi":4,"malz":["1,5 su bardağı kırmızı mercimek","1 adet kuru soğan","1 adet havuç","1 adet patates","2 yemek kaşığı tereyağı","1 yemek kaşığı un","7 su bardağı sıcak su","1 çay kaşığı tuz","1 çay kaşığı kimyon","1 çay kaşığı pul biber"],"adim":["Mercimeği bol suda, suyu berraklaşana kadar yıkayıp süzün.","Soğanı, havucu ve patatesi küçük doğrayın.","Tereyağının yarısını tencerede eritin, soğanı pembeleşene kadar kavurun; unu ekleyip 1 dakika daha kavurun.","Havuç, patates ve mercimeği ekleyip karıştırın, sıcak suyu ilave edin.","Kaynadıktan sonra kısık ateşte, mercimekler dağılana kadar yaklaşık 25 dakika pişirin.","Çorbayı blenderdan geçirin, tuzu ve kimyonu ekleyip bir taşım daha kaynatın.","Kalan tereyağını küçük bir tavada eritip pul biberi ekleyin ve servis ederken çorbanın üzerine gezdirin."],"ipucu":"Limon dilimiyle servis edin; kıvamı koyulaşırsa biraz sıcak su ekleyebilirsiniz."},{"ad":"Karnıyarık","kat":"Ana Yemek","sure":"1 saat","kisi":4,"malz":["6 adet bostan patlıcan","300 g dana kıyma","1 adet kuru soğan","2 diş sarımsak","4 adet sivri biber","2 adet domates","1 yemek kaşığı domates salçası","1 su bardağı sıcak su","Kızartmak için sıvı yağ","1 çay kaşığı tuz","Yarım çay kaşığı karabiber"],"adim":["Patlıcanları alacalı soyun, tuzlu suda 20 dakika bekletip kurulayın.","Patlıcanları kızgın yağda her yüzü yumuşayana kadar kızartıp kâğıt havlu üzerine alın.","Doğranmış soğanı 2 yemek kaşığı yağda kavurun, kıymayı ekleyip suyunu çekene kadar pişirin.","Sarımsağı, 2 sivri biberi ve 1 domatesi küçük doğrayıp ekleyin; tuzu ve karabiberi katıp 5 dakika pişirin.","Patlıcanları fırın kabına dizin, ortalarını bıçakla yarıp kaşıkla açın ve kıymalı harcı doldurun.","Üzerlerine kalan domatesten birer dilim ve biber koyun; salçayı sıcak suda açıp kabın kenarından dökün.","Önceden ısıtılmış 180 derecelik fırında 25-30 dakika pişirin."],"ipucu":"Pilav ve cacıkla servis edebilirsiniz."},{"ad":"Şehriyeli Pirinç Pilavı","kat":"Pilav/Makarna","sure":"35 dakika","kisi":4,"malz":["2 su bardağı baldo pirinç","2 yemek kaşığı arpa şehriye","3 yemek kaşığı tereyağı","3 su bardağı sıcak su veya tavuk suyu","1 çay kaşığı tuz"],"adim":["Pirinci ılık tuzlu suda 20 dakika bekletin, ardından suyu berraklaşana kadar yıkayıp süzün.","Tereyağını tencerede eritin, şehriyeyi ekleyip altın rengi alana kadar kavurun.","Pirinci ekleyip taneler şeffaflaşana kadar 3-4 dakika kavurun.","Sıcak suyu ve tuzu ekleyip karıştırın, kaynayınca ocağı kısın.","Tencerenin kapağını kapatıp pirinç suyunu çekene kadar yaklaşık 15 dakika pişirin.","Ocaktan alıp kapağın altına kâğıt havlu koyun ve 10 dakika demlendirin."],"ipucu":"Demlenme sırasında kapağı açmayın, pilav daha tane tane olur."},{"ad":"Molehiya","kat":"Ana Yemek","sure":"1 saat 15 dakika","kisi":4,"malz":["150 g kuru molehiya yaprağı","500 g tavuk but veya kuzu eti","1 adet kuru soğan","2 diş sarımsak","3 adet domates","1 yemek kaşığı domates salçası","4 yemek kaşığı zeytinyağı","1 adet limonun suyu","1 çay kaşığı tuz","Yarım çay kaşığı karabiber","4 su bardağı sıcak su"],"adim":["Molehiya yapraklarını bir gece önceden ılık suda bekletin.","Yaprakları süzün, yıkayıp elinizle sıkın; bu işlemi kayganlığı azalana kadar 4-5 kez tekrarlayın.","Zeytinyağında ince doğranmış soğan ve sarımsağı kavurun, eti ekleyip rengi dönene kadar çevirin.","Salçayı ekleyip kokusu çıkana kadar kavurun, rendelenmiş domatesleri ilave edin.","Molehiyayı, tuzu ve karabiberi ekleyin, üzerini geçecek kadar sıcak suyu ilave edin.","Kısık ateşte yaklaşık 1 saat pişirin; pişmesine 10 dakika kala limon suyunu ekleyin."],"ipucu":"Kıbrıs Türk mutfağının sevilen yemeğidir; bulgur pilavıyla servis edin."},{"ad":"Zeytinyağlı Taze Fasulye","kat":"Zeytinyağlı","sure":"1 saat","kisi":4,"malz":["750 g çalı fasulyesi","1 adet büyük boy kuru soğan","2 adet domates","Yarım su bardağı zeytinyağı","1 tatlı kaşığı toz şeker","1 çay kaşığı tuz","1 su bardağı sıcak su"],"adim":["Fasulyelerin uçlarını ve kılçıklarını ayıklayıp yıkayın, ikiye ya da üçe bölün.","Soğanı piyazlık doğrayın, zeytinyağında hafifçe kavurun.","Fasulyeleri ekleyip kapağı kapalı olarak 10 dakika, renkleri canlanana kadar pişirin.","Kabuğu soyulmuş ve küp doğranmış domatesleri, şekeri ve tuzu ekleyin.","Sıcak suyu ilave edin, kısık ateşte fasulyeler yumuşayana kadar 35-40 dakika pişirin.","Ocaktan alıp tencerede ılımaya bırakın, oda sıcaklığında servis edin."],"ipucu":"Zeytinyağlılar bir gece buzdolabında dinlenince daha lezzetli olur."},{"ad":"Ezogelin Çorbası","kat":"Çorba","sure":"45 dakika","kisi":6,"malz":["1 su bardağı kırmızı mercimek","2 yemek kaşığı pirinç","2 yemek kaşığı ince bulgur","1 adet kuru soğan","1 yemek kaşığı domates salçası","1 yemek kaşığı biber salçası","3 yemek kaşığı tereyağı","8 su bardağı sıcak su","1 yemek kaşığı kuru nane","1 çay kaşığı pul biber","1 tatlı kaşığı tuz"],"adim":["Mercimeği, pirinci ve bulguru ayrı ayrı yıkayıp süzün.","Tereyağının 2 kaşığını tencerede eritin, ince doğranmış soğanı kavurun.","Salçaları ekleyip kokusu çıkana kadar 1-2 dakika kavurun.","Mercimek, pirinç ve bulguru ekleyip karıştırın, sıcak suyu ilave edin.","Kaynadıktan sonra kısık ateşte, ara ara karıştırarak 30 dakika pişirin; tuzunu ekleyin.","Kalan tereyağında naneyi ve pul biberi kızdırıp çorbanın üzerine gezdirin."],"ipucu":"Çorba bekledikçe koyulaşır; ısıtırken biraz sıcak su ekleyin."},{"ad":"Hünkârbeğendi","kat":"Ana Yemek","sure":"1 saat 30 dakika","kisi":4,"malz":["500 g kuşbaşı dana veya kuzu eti","1 adet kuru soğan","2 adet domates","1 yemek kaşığı domates salçası","2 yemek kaşığı tereyağı (et için)","2 su bardağı sıcak su","4 adet büyük boy patlıcan","2 yemek kaşığı tereyağı (beğendi için)","2 yemek kaşığı un","1,5 su bardağı süt","Yarım su bardağı rendelenmiş kaşar peyniri","1 çay kaşığı tuz","Yarım çay kaşığı karabiber"],"adim":["Eti tereyağında suyunu salıp çekene kadar kavurun, doğranmış soğanı ekleyip pembeleşene kadar pişirin.","Salçayı ve rendelenmiş domatesleri ekleyin, sıcak suyu ilave edip kısık ateşte et yumuşayana kadar yaklaşık 1 saat pişirin; tuz ve karabiberi ekleyin.","Patlıcanları ocakta veya fırında közleyin, kabuklarını soyup bıçakla ince ince doğrayın.","Beğendi için tereyağını eritin, unu ekleyip kokusu çıkana kadar kavurun.","Sütü azar azar ekleyip çırpın, patlıcanları katıp koyulaşana kadar karıştırarak pişirin.","Kaşarı ve bir tutam tuzu ekleyip eriyene kadar karıştırın.","Beğendiyi servis tabağına yayın, ortasına etli sosu koyarak sıcak servis edin."],"ipucu":"Közlenmiş patlıcanları limonlu suda bekletirseniz beğendi beyaz renkte kalır."},{"ad":"Sigara Böreği","kat":"Hamur İşi","sure":"40 dakika","kisi":6,"malz":["3 adet yufka","250 g beyaz peynir","Yarım demet maydanoz","1 adet yumurta (isteğe bağlı)","Kızartmak için sıvı yağ"],"adim":["Beyaz peyniri çatalla ezin, ince kıyılmış maydanozu ve isteğe göre yumurtayı ekleyip karıştırın.","Her yufkayı ortadan dört eşit parçaya, her parçayı da ikiye keserek üçgenler elde edin.","Üçgenin geniş kenarına bir tatlı kaşığı iç koyun, kenarları içe katlayıp sıkıca sarın.","Sivri ucunu biraz suyla ıslatarak yapıştırın.","Böreklerin yarısına gelecek kadar yağı tavada kızdırın, börekleri iki yüzü kızarana kadar pişirin.","Kâğıt havlu üzerine alıp fazla yağını süzdürün, sıcak servis edin."],"ipucu":"Sardığınız börekleri dondurucuda saklayıp çözdürmeden kızartabilirsiniz."},{"ad":"İzmir Köfte","kat":"Ana Yemek","sure":"1 saat 15 dakika","kisi":4,"malz":["500 g dana kıyma","1 adet kuru soğan","2 dilim bayat ekmek içi","1 adet yumurta","1 çay kaşığı kimyon","1 tatlı kaşığı tuz","1 çay kaşığı karabiber","3 adet orta boy patates","4 adet sivri biber","2 adet domates","1 yemek kaşığı domates salçası","1,5 su bardağı sıcak su","Kızartmak için sıvı yağ"],"adim":["Kıymayı rendelenmiş soğan, ıslatılıp sıkılmış ekmek içi, yumurta, kimyon, tuz ve karabiberle iyice yoğurun.","Harçtan parmak şeklinde köfteler yapıp tavada iki yüzünü hafifçe kızartın.","Patatesleri elma dilimi şeklinde doğrayıp yağda yarı pişene kadar kızartın.","Köfteleri, patatesleri, domates dilimlerini ve biberleri fırın kabına sırayla dizin.","Salçayı sıcak suyla açıp bir tutam tuz ekleyin ve kabın üzerine dökün.","Önceden ısıtılmış 200 derecelik fırında 30-35 dakika pişirin."],"ipucu":"Patatesleri kızartmak istemezseniz çiğ olarak dizip pişirme süresini 15 dakika uzatın."},{"ad":"Yayla Çorbası","kat":"Çorba","sure":"35 dakika","kisi":4,"malz":["Yarım su bardağı pirinç","6 su bardağı tavuk suyu veya su","1,5 su bardağı yoğurt","1 adet yumurta sarısı","1 yemek kaşığı un","2 yemek kaşığı tereyağı","1 yemek kaşığı kuru nane","1 tatlı kaşığı tuz"],"adim":["Pirinci yıkayıp tavuk suyuyla tencereye alın, yumuşayana kadar yaklaşık 20 dakika pişirin.","Ayrı bir kapta yoğurt, yumurta sarısı ve unu pürüzsüz olana kadar çırpın.","Tencereden bir kepçe sıcak suyu yoğurtlu karışıma azar azar ekleyerek ılıştırın.","Ilıştırılmış karışımı sürekli karıştırarak çorbaya ekleyin.","Kaynayana kadar karıştırmayı bırakmadan pişirin, tuzunu ekleyip 2-3 dakika daha kaynatın.","Tereyağını eritip naneyi ekleyin ve çorbanın üzerine gezdirin."],"ipucu":"Yoğurdu ılıştırmadan eklerseniz kesilebilir; karıştırmayı ihmal etmeyin."},{"ad":"Kolakas","kat":"Ana Yemek","sure":"1 saat 30 dakika","kisi":4,"malz":["500 g kuşbaşı kuzu eti","1 kg kolakas (3 orta boy)","2 adet kuru soğan","3 dal kereviz sapı","2 yemek kaşığı domates salçası","Yarım çay bardağı sıvı yağ","3 yemek kaşığı zeytinyağı","Yarım limonun suyu","1 çay kaşığı tuz","4 su bardağı sıcak su"],"adim":["Soğanları küçük doğrayıp sıvı yağda kavurun, eti ekleyip suyunu çekene kadar pişirin.","Kolakasları yıkayıp kurulayın, ardından soyun; kesinlikle soyduktan sonra yıkamayın.","Kolakasları uç kısmından bıçak batırıp sapa doğru keserek lokma büyüklüğünde parçalara ayırın.","Salçayı biraz suyla açıp tencereye ekleyin, kolakas ve doğranmış kereviz saplarını ilave edin.","Üzerini geçecek kadar sıcak su ekleyin, orta ateşte et ve kolakas yumuşayana kadar yaklaşık 1 saat pişirin; su azalırsa sıcak su ekleyin.","Pişerken limon suyunu, pişmeye yakın zeytinyağını ve tuzu ekleyip ocağı kapatın."],"ipucu":"Kıbrıs Türk mutfağına özgüdür; soyulmuş kolakas ıslanırsa pişince kayganlaşır."},{"ad":"Fırın Sütlaç","kat":"Tatlı","sure":"1 saat","kisi":6,"malz":["Yarım su bardağı pirinç","1,5 su bardağı su","1 litre süt","1 su bardağı toz şeker","2 yemek kaşığı pirinç unu","Yarım su bardağı soğuk su","Tarçın (isteğe bağlı)"],"adim":["Pirinci yıkayıp 1,5 su bardağı suyla, suyunu çekip yumuşayana kadar haşlayın.","Sütü ekleyip kaynayana kadar karıştırarak pişirin.","Pirinç ununu soğuk suda topaksız açıp tencereye azar azar ekleyin.","Şekeri ekleyin ve kısık ateşte, sürekli karıştırarak 15 dakika pişirin.","Sütlacı fırına dayanıklı kaselere paylaştırın, kaseleri su dolu fırın tepsisine dizin.","Önceden ısıtılmış 200 derecelik fırının üst ızgarasında yüzeyi kızarana kadar 15-20 dakika pişirin.","Oda sıcaklığına gelince buzdolabında en az 2 saat soğutup servis edin."],"ipucu":"Tepsideki su, sütlacın altının yanmasını önler."},{"ad":"Tavuk Sote","kat":"Ana Yemek","sure":"35 dakika","kisi":4,"malz":["500 g tavuk göğsü","1 adet kuru soğan","3 adet sivri biber","1 adet kırmızı biber","2 adet domates","1 yemek kaşığı biber salçası","3 yemek kaşığı sıvı yağ","1 çay kaşığı tuz","Yarım çay kaşığı karabiber","1 çay kaşığı kekik"],"adim":["Tavuk göğsünü kuşbaşı doğrayın.","Geniş bir tavada yağı kızdırın, tavukları suyunu çekene ve hafifçe renk alana kadar yüksek ateşte soteleyin.","Piyazlık doğranmış soğanı ve biberleri ekleyip 5 dakika kavurun.","Salçayı ekleyip 1 dakika çevirin, küp doğranmış domatesleri ilave edin.","Tuz, karabiber ve kekiği ekleyip kısık ateşte domatesler suyunu çekene kadar 10 dakika pişirin."],"ipucu":"Tavukları az az soteleyin; tava kalabalık olursa haşlanmış gibi olur."},{"ad":"Zeytinyağlı Yaprak Sarma","kat":"Zeytinyağlı","sure":"2 saat","kisi":8,"malz":["250 g salamura asma yaprağı","2 su bardağı pirinç","3 adet kuru soğan","3/4 su bardağı zeytinyağı","1 yemek kaşığı dolmalık fıstık","1 yemek kaşığı kuş üzümü","1 tatlı kaşığı toz şeker","1 tatlı kaşığı kuru nane","1 çay kaşığı yenibahar","1 çay kaşığı tarçın","1 tatlı kaşığı tuz","1 adet limon","2 su bardağı sıcak su"],"adim":["Asma yapraklarını sıcak suda 10 dakika bekletip tuzunu alın, saplarını kesin.","Zeytinyağının yarısında ince doğranmış soğanları ve fıstığı kavurun.","Yıkanmış pirinci ekleyip 3-4 dakika kavurun; kuş üzümü, şeker, baharatlar, tuz ve yarım su bardağı sıcak suyu ekleyip suyunu çekene kadar pişirin.","Yaprakların mat yüzüne birer tatlı kaşığı iç koyun, kenarlarını içe katlayıp sıkıca sarın.","Sarmaları tencereye sıkı sıkı dizin, üzerine limon dilimleri, kalan zeytinyağı ve sıcak suyu ekleyin.","Üzerine ters bir tabak kapatıp kısık ateşte pirinçler pişene kadar 40-45 dakika pişirin.","Tencerede soğumaya bırakın, soğuk servis edin."],"ipucu":"Sarmaları çok sıkı sarmayın; pirinç pişerken şişer ve yaprak yırtılabilir."},{"ad":"Tarhana Çorbası","kat":"Çorba","sure":"25 dakika","kisi":4,"malz":["4 yemek kaşığı tarhana","1 su bardağı soğuk su","1 yemek kaşığı domates salçası","2 yemek kaşığı tereyağı","5 su bardağı sıcak su","1 çay kaşığı tuz","1 çay kaşığı kuru nane"],"adim":["Tarhanayı soğuk suda 10 dakika bekletip topaksız hâle gelene kadar karıştırın.","Tereyağının yarısını tencerede eritip salçayı kavurun.","Sıcak suyu ekleyin, kaynayınca ıslatılmış tarhanayı karıştırarak ilave edin.","Kısık ateşte, dibi tutmaması için ara ara karıştırarak 10-15 dakika pişirin; tuzunu ekleyin.","Kalan tereyağında naneyi kızdırıp çorbanın üzerine gezdirin."],"ipucu":"Tarhananın tuzlu olabileceğini düşünerek tuzu en son, tadına bakarak ekleyin."},{"ad":"Domatesli Bulgur Pilavı","kat":"Pilav/Makarna","sure":"35 dakika","kisi":4,"malz":["2 su bardağı pilavlık bulgur","1 adet kuru soğan","2 adet sivri biber","1 adet domates","1 yemek kaşığı domates salçası","2 yemek kaşığı tereyağı","2 yemek kaşığı sıvı yağ","3,5 su bardağı sıcak su","1 tatlı kaşığı tuz","Yarım çay kaşığı karabiber"],"adim":["Bulguru yıkayıp süzün.","Tereyağı ve sıvı yağı tencerede ısıtıp ince doğranmış soğan ve biberleri kavurun.","Salçayı ve rendelenmiş domatesi ekleyip 2-3 dakika pişirin.","Bulguru ekleyip 2 dakika kavurun.","Sıcak suyu, tuzu ve karabiberi ekleyin; kaynayınca kapağı kapatıp kısık ateşte suyunu çekene kadar 15 dakika pişirin.","Ocaktan alıp kapağın altına kâğıt havlu koyarak 10 dakika demlendirin."],"ipucu":"Molehiya ve kolakas gibi sulu yemeklerin yanına çok yakışır."},{"ad":"İmambayıldı","kat":"Zeytinyağlı","sure":"1 saat 15 dakika","kisi":6,"malz":["6 adet bostan patlıcan","3 adet kuru soğan","5 diş sarımsak","3 adet domates","2 adet sivri biber","Yarım demet maydanoz","3/4 su bardağı zeytinyağı","1 tatlı kaşığı toz şeker","1 tatlı kaşığı tuz","1 su bardağı sıcak su"],"adim":["Patlıcanları alacalı soyun, tuzlu suda 20 dakika bekletip kurulayın.","Patlıcanları zeytinyağının bir kısmında her yüzü yumuşayana kadar çevirerek pişirin.","Kalan zeytinyağında piyazlık doğranmış soğanı ve sarımsağı yumuşayana kadar kavurun.","Küp doğranmış domatesleri, biberleri, şekeri ve tuzu ekleyip 5 dakika pişirin; maydanozu katın.","Patlıcanları tencereye veya fırın kabına dizin, ortalarını yarıp harcı doldurun.","Sıcak suyu ekleyip kısık ateşte veya 180 derecelik fırında 30-35 dakika pişirin.","Ilımaya bırakıp oda sıcaklığında servis edin."],"ipucu":"Zeytinyağlı olduğu için soğuk servis edilir; yanına yoğurt yakışır."},{"ad":"Kıymalı Pide","kat":"Hamur İşi","sure":"1 saat 30 dakika","kisi":4,"malz":["3,5 su bardağı un","1 paket (10 g) kuru maya","1 tatlı kaşığı toz şeker","1 tatlı kaşığı tuz","1 su bardağı ılık su","Yarım su bardağı ılık süt","2 yemek kaşığı sıvı yağ","300 g dana kıyma","1 adet kuru soğan","2 adet domates","2 adet sivri biber","Yarım demet maydanoz","1 çay kaşığı tuz (iç için)","1 çay kaşığı pul biber"],"adim":["Mayayı ve şekeri ılık suda eritin; unu, tuzu, sütü ve yağı ekleyip yumuşak bir hamur yoğurun.","Hamurun üzerini örtüp ılık bir yerde iki katına çıkana kadar yaklaşık 45 dakika mayalandırın.","İç için kıymayı, çok ince doğranmış soğan, domates, biber ve maydanozu, tuzu ve pul biberi çiğ olarak yoğurun.","Hamuru dört parçaya bölün, her birini oval şekilde açın.","Harcı hamurların ortasına yayın, kenarlarını içe katlayıp uçlarını sıkıştırın.","Pideleri yağlı kâğıt serili tepsiye alıp 230 derecelik fırında kenarları kızarana kadar 12-15 dakika pişirin."],"ipucu":"Fırından çıkınca kenarlarına tereyağı sürerseniz hamur yumuşak kalır."},{"ad":"Etli Kuru Fasulye","kat":"Ana Yemek","sure":"2 saat (+ 1 gece ıslatma)","kisi":6,"malz":["2 su bardağı kuru fasulye","250 g kuşbaşı dana eti","1 adet kuru soğan","1 yemek kaşığı domates salçası","1 yemek kaşığı biber salçası","3 yemek kaşığı sıvı yağ","6 su bardağı sıcak su","1 tatlı kaşığı tuz","1 çay kaşığı pul biber"],"adim":["Fasulyeleri bir gece önceden bol suda ıslatın.","Fasulyeleri süzüp kaynar suda 10 dakika haşlayın, suyunu dökün.","Yağda eti suyunu salıp çekene kadar kavurun, doğranmış soğanı ekleyip pembeleşene kadar pişirin.","Salçaları ekleyip kokusu çıkana kadar kavurun.","Fasulyeleri ve sıcak suyu ekleyin; kısık ateşte fasulyeler yumuşayana kadar 1,5 saat pişirin.","Tuz ve pul biberi ekleyip 10 dakika daha pişirin."],"ipucu":"Tuzu en sonda ekleyin; erken eklenen tuz fasulyenin geç pişmesine yol açar."},{"ad":"Hurmalı Cevizli Toplar","kat":"Tatlı","sure":"20 dakika","kisi":6,"malz":["250 g çekirdeksiz hurma","1 su bardağı ceviz içi","2 yemek kaşığı tahin","1 çay kaşığı tarçın","Yarım su bardağı Hindistan cevizi"],"adim":["Hurmalar sertse 10 dakika ılık suda bekletip iyice süzün.","Ceviz içini rondoda iri parçalar kalacak şekilde çekin.","Hurmaları, tahini ve tarçını ekleyip macun kıvamına gelene kadar çekin.","Karışımdan ceviz büyüklüğünde parçalar alıp ellerinizle yuvarlayın.","Topları Hindistan cevizine bulayın, buzdolabında 30 dakika dinlendirip servis edin."],"ipucu":"Şeker eklenmeyen, iftarda hurma yerine ikram edilebilecek hafif bir tatlıdır."},{"ad":"Pirohu","kat":"Hamur İşi","sure":"1 saat 15 dakika","kisi":4,"malz":["2,5 su bardağı un","1 adet yumurta","3/4 su bardağı su","1 tatlı kaşığı tuz","250 g lor peyniri","1 yemek kaşığı kuru nane","6 su bardağı tavuk suyu","Yarım su bardağı rendelenmiş hellim","2 yemek kaşığı tereyağı"],"adim":["Unu bir kaba alıp ortasını açın; yumurtayı, tuzu ve suyu azar azar ekleyerek kulak memesi kıvamında bir hamur yoğurun.","Hamurun üzerini nemli bir bezle örtüp 20 dakika dinlendirin.","Lor peynirini kuru naneyle karıştırarak içi hazırlayın.","Hamuru ince açıp 7-8 santimetrelik kareler kesin, her karenin ortasına bir tatlı kaşığı iç koyun.","Kareleri üçgen olacak şekilde katlayın, kenarlarını çatalla bastırarak kapatın.","Pirohuları kaynayan tavuk suyuna atın, yüzeye çıkıp hamur pişene kadar 8-10 dakika haşlayın.","Kevgirle tabağa alıp üzerine rendelenmiş hellim serpin ve eritilmiş tereyağı gezdirin."],"ipucu":"Kıbrıs Türk mutfağına özgü bir hamur işidir; haşlama suyu çorba olarak da içilebilir."},{"ad":"Kıymalı Kabak Yemeği","kat":"Ana Yemek","sure":"45 dakika","kisi":4,"malz":["1 kg sakız kabak","200 g dana kıyma","1 adet kuru soğan","1 adet domates","1 yemek kaşığı domates salçası","2 yemek kaşığı pirinç","3 yemek kaşığı sıvı yağ","1 su bardağı sıcak su","1 çay kaşığı tuz","Yarım çay kaşığı karabiber","Yarım demet dereotu"],"adim":["Kabakları alacalı soyup yarım ay şeklinde doğrayın.","Yağda ince doğranmış soğanı kavurun, kıymayı ekleyip suyunu çekene kadar pişirin.","Salçayı ve rendelenmiş domatesi ekleyip 2 dakika pişirin.","Kabakları, yıkanmış pirinci, tuzu ve karabiberi ekleyip karıştırın.","Sıcak suyu ilave edin, kapağı kapalı olarak kısık ateşte kabaklar yumuşayana kadar 20-25 dakika pişirin.","Ocaktan almadan önce ince kıyılmış dereotunu ekleyin."],"ipucu":"Peygamberimizin sevdiği kabağı sofraya getirmenin kolay bir yolu; yoğurtla servis edin."},{"ad":"Domates Çorbası","kat":"Çorba","sure":"30 dakika","kisi":4,"malz":["5 adet olgun domates","2 yemek kaşığı tereyağı","2 yemek kaşığı un","1 yemek kaşığı domates salçası","4 su bardağı sıcak su","1 su bardağı süt","1 çay kaşığı tuz","Servis için rendelenmiş kaşar peyniri"],"adim":["Domateslerin kabuklarını soyup rendeleyin.","Tereyağını tencerede eritin, unu ekleyip kokusu çıkana kadar kavurun.","Salçayı ekleyip 1 dakika kavurun, rendelenmiş domatesi ilave edin.","Sıcak suyu azar azar ekleyip topak kalmayacak şekilde çırpın; kaynayınca 15 dakika pişirin.","Sütü yavaşça ekleyin, tuzunu katıp bir taşım daha kaynatın.","Üzerine rendelenmiş kaşar serperek servis edin."],"ipucu":"Pürüzsüz bir kıvam için pişirdikten sonra blenderdan geçirebilirsiniz."},{"ad":"Ispanaklı Gözleme","kat":"Hamur İşi","sure":"1 saat","kisi":4,"malz":["3 su bardağı un","1 su bardağı ılık su","1 çay kaşığı tuz","500 g ıspanak","1 adet kuru soğan","150 g beyaz peynir","2 yemek kaşığı sıvı yağ","Pişirmek için 2 yemek kaşığı tereyağı"],"adim":["Unu, tuzu ve ılık suyu yoğurarak yumuşak bir hamur elde edin; 4 bezeye bölüp üzerini örterek 20 dakika dinlendirin.","Ispanağı yıkayıp ince doğrayın.","Soğanı yağda kavurun, ıspanağı ekleyip suyunu salıp çekene kadar pişirin; soğuyunca ufalanmış peyniri katın.","Bezeleri oklavayla ince yufka şeklinde açın.","Yufkaların yarısına iç koyup diğer yarısını üzerine kapatın, kenarlarını bastırın.","Isıtılmış sac veya geniş tavada iki yüzünü de kızarana kadar pişirin, sıcakken tereyağı sürün."],"ipucu":"Ispanağın suyunu iyice çektirin; aksi takdirde hamur ıslanıp yırtılır."},{"ad":"Güllaç","kat":"Tatlı","sure":"30 dakika (+ 3 saat dinlenme)","kisi":8,"malz":["12 adet güllaç yaprağı","1,5 litre süt","1,5 su bardağı toz şeker","1 yemek kaşığı gül suyu","1,5 su bardağı iri çekilmiş ceviz içi","1 adet nar"],"adim":["Sütü ve şekeri tencereye alıp şeker eriyene kadar ısıtın, kaynatmadan ocaktan alıp ılımaya bırakın; gül suyunu ekleyin.","Güllaç yapraklarının katlanmadan sığacağı büyüklükte, kenarlı bir tepsi seçin.","Tepsiye bir yaprak koyup üzerine bir kepçe ılık süt gezdirin, yaprak yumuşayınca ikinci yaprağı koyun.","Altı yaprak bu şekilde dizildikten sonra cevizin yarısını serpin.","Kalan yaprakları aynı şekilde sütle ıslatarak dizin ve kalan sütü en üste dökün.","Buzdolabında en az 3 saat dinlendirin; dilimleyip üzerini kalan ceviz ve nar taneleriyle süsleyerek servis edin."],"ipucu":"Ramazan sofralarının hafif tatlısıdır; süt sıcak olursa yapraklar hamurlaşır, ılık kullanın."},{"ad":"Bulgur Köftesi","kat":"Ana Yemek","sure":"1 saat 30 dakika","kisi":6,"malz":["2 su bardağı köftelik ince bulgur","1,5 su bardağı sıcak su","150 g yağsız kıyma (dış için)","2 yemek kaşığı un","1 tatlı kaşığı tuz","250 g dana kıyma (iç için)","2 adet kuru soğan","Yarım demet maydanoz","2 yemek kaşığı sıvı yağ","Yarım çay kaşığı karabiber","Kızartmak için sıvı yağ"],"adim":["Bulguru sıcak suyla ıslatıp üzerini kapatın ve 20 dakika şişmeye bırakın.","İç için ince doğranmış soğanı yağda kavurun, kıymayı ekleyip suyunu çekene kadar pişirin; tuz, karabiber ve kıyılmış maydanozu katıp soğutun.","Şişen bulguru yağsız kıyma, un ve tuzla birlikte ele yapışmayan bir kıvam alana kadar en az 10 dakika yoğurun.","Hamurdan ceviz büyüklüğünde parçalar alıp ıslak elle ortasını parmağınızla açarak ince bir kabuk oluşturun.","İçine bir tatlı kaşığı harç koyup ağzını kapatın ve iki ucu sivri olacak şekilde şekil verin.","Köfteleri kızgın yağda her yüzü kızarana kadar kızartıp kâğıt havluya alın."],"ipucu":"Kıbrıs Türk mutfağında sofraların vazgeçilmezidir; yanına limon ve yeşillik yakışır."},{"ad":"Zeytinyağlı Pırasa","kat":"Zeytinyağlı","sure":"50 dakika","kisi":4,"malz":["1 kg pırasa","1 adet havuç","1 adet kuru soğan","2 yemek kaşığı pirinç","Yarım su bardağı zeytinyağı","1 tatlı kaşığı toz şeker","1 tatlı kaşığı tuz","1 su bardağı sıcak su","Yarım limonun suyu"],"adim":["Pırasaları ayıklayıp boyuna ikiye kesin, aralarındaki toprağı iyice yıkayıp 2 santimetre kalınlığında doğrayın.","Zeytinyağında ince doğranmış soğanı kavurun, halka doğranmış havucu ekleyip 2 dakika çevirin.","Pırasaları ekleyip kapağı kapalı olarak 10 dakika pişirin.","Yıkanmış pirinci, şekeri, tuzu ve sıcak suyu ekleyin.","Kısık ateşte pirinçler pişene kadar 20-25 dakika pişirin, limon suyunu ekleyip ocaktan alın.","Ilımaya bırakıp soğuk servis edin."],"ipucu":"Limon suyu pırasanın rengini canlı tutar ve hafif ekşilik katar."},{"ad":"Tavuk Tiridi","kat":"Ana Yemek","sure":"1 saat 15 dakika","kisi":4,"malz":["4 adet tavuk but","1 adet kuru soğan","1 adet havuç","8 su bardağı su","4 dilim bayat ekmek veya yarım pide","2 su bardağı yoğurt","2 diş sarımsak","3 yemek kaşığı tereyağı","1 tatlı kaşığı domates salçası","1 çay kaşığı pul biber","1 tatlı kaşığı tuz"],"adim":["Tavukları soğan ve havuçla birlikte suya koyup kaynatın, köpüğünü alarak kısık ateşte 45 dakika haşlayın; tuzunu ekleyin.","Tavukları çıkarıp kemik ve derisinden ayırın, didikleyin; suyunu süzün.","Ekmeği küp doğrayıp fırında veya tavada çıtır olana kadar kızartın.","Yoğurdu ezilmiş sarımsakla çırpın.","Ekmekleri servis tabağına yayın, üzerlerine yumuşayacak kadar sıcak tavuk suyu gezdirin.","Didiklenmiş tavukları ekmeklerin üzerine dizin, sarımsaklı yoğurdu dökün.","Tereyağını eritip salça ve pul biberi kısa süre kızdırın, tiridin üzerine gezdirerek sıcak servis edin."],"ipucu":"Tirit, Peygamberimizin övdüğü yemeklerdendir; kalan tavuk suyunu çorbada kullanabilirsiniz."},{"ad":"Kabak Tatlısı","kat":"Tatlı","sure":"1 saat (+ 1 gece bekleme)","kisi":6,"malz":["1 kg balkabağı","2 su bardağı toz şeker","Yarım su bardağı iri çekilmiş ceviz içi","Servis için tahin (isteğe bağlı)"],"adim":["Balkabağını soyup çekirdeklerini temizleyin, iri dilimler hâlinde kesin.","Dilimleri geniş bir tencereye dizin ve üzerine toz şekeri eşit şekilde serpin.","Kabaklar suyunu salması için tencerenin kapağını kapatıp bir gece bekletin.","Ertesi gün su eklemeden kısık ateşte, kabaklar yumuşayıp şerbetini çekene kadar 40-45 dakika pişirin.","Ocaktan alıp tencerede soğumaya bırakın.","Servis tabağına alıp üzerine ceviz serpin, isterseniz tahin gezdirin."],"ipucu":"Pişerken karıştırmayın; tencereyi hafifçe sallamak dilimlerin dağılmasını önler."},{"ad":"Fırında Kıymalı Makarna","kat":"Pilav/Makarna","sure":"1 saat","kisi":6,"malz":["500 g kalem makarna","250 g dana kıyma","1 adet kuru soğan","1 yemek kaşığı domates salçası","2 yemek kaşığı sıvı yağ","3 yemek kaşığı tereyağı","3 yemek kaşığı un","4 su bardağı süt","1 su bardağı rendelenmiş kaşar peyniri","1 tatlı kaşığı tuz","Yarım çay kaşığı karabiber"],"adim":["Makarnayı tuzlu kaynar suda paket süresinden 2 dakika az haşlayıp süzün.","Yağda doğranmış soğanı kavurun, kıymayı ekleyip suyunu çekene kadar pişirin; salça, tuz ve karabiberi katıp 3 dakika daha pişirin.","Beşamel için tereyağını eritin, unu kokusu çıkana kadar kavurun, sütü azar azar ekleyip koyulaşana kadar çırpın; bir tutam tuz ekleyin.","Makarnanın yarısını yağlanmış fırın kabına yayın, üzerine kıymalı harcı serin.","Kalan makarnayı yayıp beşameli üzerine dökün, rendelenmiş kaşarı serpin.","Önceden ısıtılmış 180 derecelik fırında üzeri kızarana kadar 25-30 dakika pişirin."],"ipucu":"Kaşar yerine rendelenmiş hellim kullanarak Kıbrıs usulü bir lezzet elde edebilirsiniz."},{"ad":"İrmik Helvası","kat":"Tatlı","sure":"40 dakika","kisi":6,"malz":["2 su bardağı irmik","125 g tereyağı","3 yemek kaşığı dolmalık fıstık","2 su bardağı süt","1 su bardağı su","1,5 su bardağı toz şeker"],"adim":["Süt, su ve şekeri bir tencerede şeker eriyene kadar ısıtıp ocağın kenarında sıcak tutun.","Tereyağını geniş bir tencerede eritin, fıstıkları ve irmiği ekleyin.","Kısık ateşte sürekli karıştırarak irmik açık kahverengi olup kokusu çıkana kadar 20-25 dakika kavurun.","Sıcak şerbeti dikkatlice ve karıştırarak irmiğe ekleyin.","Helva şerbeti çekene kadar karıştırmaya devam edin, ocaktan alın.","Kapağın altına kâğıt havlu koyup 15 dakika demlendirin, ılık servis edin."],"ipucu":"Şerbeti eklerken buhar çıkacağı için yüzünüzü tencereden uzak tutun."}];
const SUNNET=[{"b":"Hurma ile iftar","m":"Peygamberimiz akşam namazından önce taze hurma ile, bulamazsa kuru hurma ile, o da yoksa birkaç yudum su ile orucunu açardı.","k":"Ebû Dâvûd, Savm; Tirmizî, Savm"},{"b":"Bal ve tatlı","m":"Hz. Âişe, Peygamberimizin tatlıyı ve balı sevdiğini haber vermiştir.","k":"Buhârî, Et'ime; Müslim, Talâk"},{"b":"Süt","m":"Miraç gecesinde kendisine süt ve başka bir içecek sunulunca sütü seçmiş, Cebrâil de \"Fıtrata uygun olanı seçtin\" demiştir.","k":"Buhârî, Eşribe; Müslim, Îmân"},{"b":"Sirke","m":"Ailesinden katık istediğinde evde yalnızca sirke bulunduğunu öğrenmiş, onunla ekmek yerken \"Sirke ne güzel katıktır\" buyurmuştur.","k":"Müslim, Eşribe"},{"b":"Kabak","m":"Enes b. Mâlik, Peygamberimizin yemekteki kabak parçalarını tabağın kenarlarından seçerek yediğini ve o günden sonra kendisinin de kabağı sevdiğini anlatır.","k":"Buhârî, Et'ime; Müslim, Eşribe"},{"b":"Tirit","m":"Peygamberimiz, Hz. Âişe'nin diğer kadınlara üstünlüğünü tiridin diğer yemeklere üstünlüğüne benzetmiştir.","k":"Buhârî, Et'ime; Müslim, Fezâilü's-sahâbe"},{"b":"Zeytinyağı","m":"\"Zeytinyağını yiyin ve onu (bedeninize) sürünün; çünkü o mübarek bir ağaçtandır\" buyurmuştur.","k":"Tirmizî, Et'ime; İbn Mâce, Et'ime"},{"b":"Besmele, sağ el ve önünden yemek","m":"Peygamberimiz üvey oğlu Ömer b. Ebû Seleme'ye \"Yavrum, besmele çek, sağ elinle ye ve önünden ye\" diye öğüt vermiştir.","k":"Buhârî, Et'ime; Müslim, Eşribe"},{"b":"Midenin üçte biri","m":"\"İnsanoğlu midesinden daha kötü bir kap doldurmamıştır\" buyurmuş; yemeğe ihtiyaç varsa midenin üçte birinin yemeğe, üçte birinin suya, üçte birinin de nefese ayrılmasını tavsiye etmiştir.","k":"Tirmizî, Zühd; İbn Mâce, Et'ime"},{"b":"Yemeği ayıplamamak","m":"Ebû Hüreyre, Peygamberimizin hiçbir yemeği ayıplamadığını, canı çekerse yediğini, çekmezse bıraktığını bildirir.","k":"Buhârî, Et'ime; Müslim, Eşribe"},{"b":"Birlikte yemek ve bereket","m":"\"İki kişinin yemeği üç kişiye, üç kişinin yemeği dört kişiye yeter\" buyurarak sofrayı paylaşmaya teşvik etmiştir.","k":"Buhârî, Et'ime; Müslim, Eşribe"},{"b":"Yemekten sonra hamd","m":"\"Allah, bir lokma yiyip de ona hamd eden, bir yudum içip de ona hamd eden kulundan razı olur\" buyurmuştur.","k":"Müslim, Zikir ve Duâ"}];
const PDUA=[{"g":"Sabah ve akşam","t":"Sabah ve akşam korunma duası","d":"Sabah ve akşam üçer defa okunur.","ar":"بِسْمِ اللّٰهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","ok":"Bismillâhillezî lâ yedurru mea'smihî şey'ün fi'l-ardı ve lâ fi's-semâi ve hüve's-semîu'l-alîm.","m":"Adıyla birlikte yerde ve gökte hiçbir şeyin zarar veremeyeceği Allah'ın adıyla. O, hakkıyla işiten ve bilendir.","f":"Peygamberimiz, bunu akşam üç defa okuyana sabaha kadar, sabah üç defa okuyana akşama kadar ansızın bir belanın isabet etmeyeceğini bildirmiştir.","k":"Ebû Dâvûd, Edeb 101; Tirmizî, Deavât 13"},{"g":"Sabah ve akşam","t":"Seyyidü'l-istiğfâr (Bağışlanma dualarının efendisi)","d":"Sabah ve akşam okunur.","ar":"اللّٰهُمَّ أَنْتَ رَبِّي لَا إِلٰهَ إِلَّا أَنْتَ خَلَقْتَنِي وَأَنَا عَبْدُكَ وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","ok":"Allâhümme ente rabbî lâ ilâhe illâ ente halaktenî ve ene abdük ve ene alâ ahdike ve va'dike me'steta'tü. Eûzü bike min şerri mâ sana'tü. Ebûü leke bi-ni'metike aleyye ve ebûü leke bi-zenbî fağfir lî fe-innehû lâ yağfiru'z-zünûbe illâ ente.","m":"Allah'ım! Sen benim Rabbimsin. Senden başka ilah yoktur. Beni sen yarattın, ben senin kulunum. Gücüm yettiğince sana verdiğim söze ve vaadime bağlıyım. Yaptıklarımın kötülüğünden sana sığınırım. Bana verdiğin nimetleri ikrar ederim, günahımı da itiraf ederim. Beni bağışla; çünkü günahları senden başka bağışlayan yoktur.","f":"Peygamberimiz, buna inanarak gündüz okuyup akşam olmadan ölenin ve gece okuyup sabah olmadan ölenin cennet ehlinden olacağını bildirmiştir.","k":"Buhârî, Deavât 2"},{"g":"Uyku","t":"Uyumadan önce","d":"Yatağa girince okunur.","ar":"بِاسْمِكَ اللّٰهُمَّ أَمُوتُ وَأَحْيَا","ok":"Bismikellâhümme emûtü ve ahyâ.","m":"Allah'ım! Senin adınla ölür ve dirilirim.","f":"","k":"Buhârî, Deavât 7"},{"g":"Uyku","t":"Uyanınca","d":"Uykudan uyanınca okunur.","ar":"الْحَمْدُ لِلّٰهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ","ok":"Elhamdü lillâhillezî ahyânâ ba'de mâ emâtenâ ve ileyhi'n-nüşûr.","m":"Bizi öldürdükten sonra dirilten Allah'a hamdolsun. (Öldükten sonra) diriliş ve dönüş de O'nadır.","f":"","k":"Buhârî, Deavât 7"},{"g":"Yemek","t":"Yemeğe başlarken","d":"Yemeğe başlarken söylenir. Başta unutulursa hatırlayınca ikinci dua okunur.","ar":"بِسْمِ اللّٰهِ ۝ بِسْمِ اللّٰهِ أَوَّلَهُ وَآخِرَهُ","ok":"Bismillâh. Unutulursa: Bismillâhi evvelehû ve âhirah.","m":"Allah'ın adıyla. Unutulursa: Başında da sonunda da Allah'ın adıyla.","f":"Peygamberimiz, yemeğe Allah'ın adıyla başlamayı, sağ elle ve önünden yemeyi öğretmiştir.","k":"Buhârî, Et'ime 2; Ebû Dâvûd, Et'ime; Tirmizî, Et'ime 47"},{"g":"Yemek","t":"Yemekten sonra","d":"Yemek bitince okunur.","ar":"الْحَمْدُ لِلّٰهِ الَّذِي أَطْعَمَنِي هٰذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ","ok":"Elhamdü lillâhillezî et'amenî hâzâ ve rezekanîhi min ğayri havlin minnî ve lâ kuvveh.","m":"Benim hiçbir gücüm ve kuvvetim olmadan bana bu yemeği yediren ve onu bana rızık olarak veren Allah'a hamdolsun.","f":"Peygamberimiz, bunu söyleyenin geçmiş günahlarının bağışlanacağını bildirmiştir.","k":"Tirmizî, Deavât; Ebû Dâvûd, Libâs 1"},{"g":"Yemek","t":"Oruç açarken","d":"İftar edince okunur.","ar":"ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللّٰهُ","ok":"Zehebe'z-zameü ve'btelleti'l-urûku ve sebete'l-ecru inşâallâh.","m":"Susuzluk gitti, damarlar ıslandı; Allah dilerse ecir de sabit oldu.","f":"","k":"Ebû Dâvûd, Savm 22"},{"g":"Ev ve yolculuk","t":"Evden çıkarken","d":"Evden çıkarken okunur.","ar":"بِسْمِ اللّٰهِ تَوَكَّلْتُ عَلَى اللّٰهِ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ","ok":"Bismillâhi tevekkeltü alallâh, lâ havle ve lâ kuvvete illâ billâh.","m":"Allah'ın adıyla. Allah'a tevekkül ettim. Güç ve kuvvet ancak Allah'ındır.","f":"Peygamberimiz, bunu söyleyene \"Doğru yola iletildin, (ihtiyacın) karşılandı ve korundun\" denileceğini ve şeytanın ondan uzaklaşacağını bildirmiştir.","k":"Ebû Dâvûd, Edeb 103; Tirmizî, Deavât 34"},{"g":"Ev ve yolculuk","t":"Eve girerken","d":"Eve girerken Allah'ın adı anılır ve ev halkına selam verilir.","ar":"بِسْمِ اللّٰهِ","ok":"Bismillâh.","m":"Allah'ın adıyla.","f":"Peygamberimiz, eve girerken ve yemek yerken Allah'ın adını anan kişinin evinde şeytanın kalacak yer ve yiyecek bulamayacağını bildirmiştir.","k":"Müslim, Eşribe 103"},{"g":"Ev ve yolculuk","t":"Yolculuğa çıkarken (binite binince)","d":"Araca, binite binince okunur.","ar":"سُبْحَانَ الَّذِي سَخَّرَ لَنَا هٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ","ok":"Sübhânellezî sahhara lenâ hâzâ ve mâ künnâ lehû mukrinîn. Ve innâ ilâ rabbinâ le-munkalibûn.","m":"Bunu bizim hizmetimize veren Allah'ın şanı yücedir. Yoksa biz buna güç yetiremezdik. Şüphesiz biz Rabbimize döneceğiz.","f":"","k":"Zuhruf 13-14; Müslim, Hac 425"},{"g":"Tuvalet ve abdest","t":"Tuvalete girerken","d":"Tuvalete girmeden önce okunur.","ar":"اللّٰهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ","ok":"Allâhümme innî eûzü bike mine'l-hubusi ve'l-habâis.","m":"Allah'ım! Erkek ve dişi şeytanların şerrinden sana sığınırım.","f":"","k":"Buhârî, Vudû 9; Müslim, Hayz 122"},{"g":"Tuvalet ve abdest","t":"Tuvaletten çıkınca","d":"Tuvaletten çıkınca söylenir.","ar":"غُفْرَانَكَ","ok":"Gufrâneke.","m":"(Allah'ım!) Bağışlamanı dilerim.","f":"","k":"Ebû Dâvûd, Tahâret 17; Tirmizî, Tahâret 5"},{"g":"Tuvalet ve abdest","t":"Abdestten sonra","d":"Abdest bitince okunur.","ar":"أَشْهَدُ أَنْ لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ","ok":"Eşhedü en lâ ilâhe illallâhu vahdehû lâ şerîke leh ve eşhedü enne Muhammeden abdühû ve rasûlüh.","m":"Şahitlik ederim ki Allah'tan başka ilah yoktur. O tektir, ortağı yoktur. Yine şahitlik ederim ki Muhammed O'nun kulu ve elçisidir.","f":"Peygamberimiz, güzelce abdest alıp bunu söyleyen kimse için cennetin sekiz kapısının açılacağını ve dilediğinden gireceğini bildirmiştir.","k":"Müslim, Tahâret 17"},{"g":"Cami ve ezan","t":"Camiye girerken","d":"Camiye girerken okunur.","ar":"اللّٰهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ","ok":"Allâhümme'ftah lî ebvâbe rahmetik.","m":"Allah'ım! Bana rahmetinin kapılarını aç.","f":"","k":"Müslim, Salâtü'l-müsâfirîn 68"},{"g":"Cami ve ezan","t":"Camiden çıkarken","d":"Camiden çıkarken okunur.","ar":"اللّٰهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ","ok":"Allâhümme innî es'elüke min fadlik.","m":"Allah'ım! Senden lütfunu dilerim.","f":"","k":"Müslim, Salâtü'l-müsâfirîn 68"},{"g":"Cami ve ezan","t":"Ezandan sonra","d":"Ezan bitince okunur.","ar":"اللّٰهُمَّ رَبَّ هٰذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلَاةِ الْقَائِمَةِ آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ","ok":"Allâhümme rabbe hâzihi'd-da'veti't-tâmmeti ve's-salâti'l-kâimeh, âti Muhammedeni'l-vesîlete ve'l-fadîleh, ve'b'ashü makâmen mahmûdeni'llezî veadteh.","m":"Ey bu eksiksiz davetin ve kılınacak namazın Rabbi olan Allah'ım! Muhammed'e vesileyi ve fazileti ver. Onu, kendisine vaat ettiğin övülmüş makama ulaştır.","f":"Peygamberimiz, ezanı işitince bunu söyleyen kimseye kıyamet günü şefaatinin hak olacağını bildirmiştir.","k":"Buhârî, Ezân 8"},{"g":"Sıkıntı ve hastalık","t":"Sıkıntı anında (Hz. Yûnus'un duası)","d":"Sıkıntıya ve darlığa düşünce okunur.","ar":"لَا إِلٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ","ok":"Lâ ilâhe illâ ente sübhâneke innî küntü mine'z-zâlimîn.","m":"Senden başka ilah yoktur. Seni bütün eksikliklerden tenzih ederim. Ben gerçekten kendine zulmedenlerden oldum.","f":"Peygamberimiz, bir Müslümanın herhangi bir konuda bununla dua ettiğinde Allah'ın mutlaka duasını kabul edeceğini bildirmiştir.","k":"Enbiyâ 87; Tirmizî, Deavât 81"},{"g":"Sıkıntı ve hastalık","t":"Keder, borç ve tembellikten korunma","d":"Üzüntü, borç ve sıkıntı zamanlarında okunur.","ar":"اللّٰهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ وَالْعَجْزِ وَالْكَسَلِ وَالْبُخْلِ وَالْجُبْنِ وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ","ok":"Allâhümme innî eûzü bike mine'l-hemmi ve'l-hazen, ve'l-aczi ve'l-kesel, ve'l-buhli ve'l-cübn, ve dalai'd-deyni ve ğalebeti'r-ricâl.","m":"Allah'ım! Kaygıdan ve üzüntüden, acizlikten ve tembellikten, cimrilikten ve korkaklıktan, borcun ağırlığından ve insanların baskısından sana sığınırım.","f":"Peygamberimiz bu duayı çokça okurdu.","k":"Buhârî, Deavât 36"},{"g":"Sıkıntı ve hastalık","t":"Musibet anında","d":"Bir musibete, kayba uğrayınca okunur.","ar":"إِنَّا لِلّٰهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ اللّٰهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَخْلِفْ لِي خَيْرًا مِنْهَا","ok":"İnnâ lillâhi ve innâ ileyhi râciûn. Allâhümme'cürnî fî musîbetî ve ahlif lî hayran minhâ.","m":"Biz Allah'a aidiz ve O'na döneceğiz. Allah'ım! Bu musibetimde bana ecir ver ve bana ondan daha hayırlısını nasip et.","f":"Peygamberimiz, musibete uğrayıp bunu söyleyen Müslümana Allah'ın ondan daha hayırlısını vereceğini bildirmiştir.","k":"Bakara 156; Müslim, Cenâiz 4"},{"g":"Sıkıntı ve hastalık","t":"Hasta ziyaretinde","d":"Hasta ziyaret edilince yedi defa okunur.","ar":"أَسْأَلُ اللّٰهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ","ok":"Es'elullâhe'l-azîm, rabbe'l-arşi'l-azîm, en yeşfiyek.","m":"Yüce arşın Rabbi olan yüce Allah'tan sana şifa vermesini dilerim.","f":"Peygamberimiz, eceli gelmemiş bir hastanın yanında bunu yedi defa söyleyen kimse için Allah'ın o hastaya şifa vereceğini bildirmiştir.","k":"Ebû Dâvûd, Cenâiz 12; Tirmizî, Tıb 32"},{"g":"Sıkıntı ve hastalık","t":"Bir yeri ağrıyınca","d":"Elini ağrıyan yere koyarak üç defa Bismillâh denir, sonra yedi defa okunur.","ar":"أَعُوذُ بِاللّٰهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ","ok":"Eûzü billâhi ve kudretihî min şerri mâ ecidü ve uhâzir.","m":"Hissettiğim ve korktuğum şeyin şerrinden Allah'a ve O'nun kudretine sığınırım.","f":"","k":"Müslim, Selâm 67"},{"g":"Sıkıntı ve hastalık","t":"Öfkelenince","d":"Öfke anında söylenir.","ar":"أَعُوذُ بِاللّٰهِ مِنَ الشَّيْطَانِ الرَّجِيمِ","ok":"Eûzü billâhi mine'ş-şeytâni'r-racîm.","m":"Kovulmuş şeytandan Allah'a sığınırım.","f":"Peygamberimiz, öfkelenen bir kişi için bunu söylerse öfkesinin gideceğini bildirmiştir.","k":"Buhârî, Edeb 76; Müslim, Birr 109"},{"g":"Günlük hayat","t":"Hapşırınca","d":"Hapşıran Elhamdülillâh der; duyan Yerhamükellâh der; hapşıran da üçüncü cümleyle karşılık verir.","ar":"الْحَمْدُ لِلّٰهِ ۝ يَرْحَمُكَ اللّٰهُ ۝ يَهْدِيكُمُ اللّٰهُ وَيُصْلِحُ بَالَكُمْ","ok":"Elhamdülillâh. Yerhamükellâh. Yehdîkümullâhu ve yuslihu bâleküm.","m":"Allah'a hamdolsun. Allah sana merhamet etsin. Allah sizi doğru yola iletsin ve hâlinizi düzeltsin.","f":"","k":"Buhârî, Edeb 126"},{"g":"Günlük hayat","t":"Yağmur yağınca","d":"Yağmur yağarken okunur.","ar":"اللّٰهُمَّ صَيِّبًا نَافِعًا","ok":"Allâhümme sayyiben nâfiâ.","m":"Allah'ım! Bunu faydalı bir yağmur kıl.","f":"","k":"Buhârî, İstiskâ 23"},{"g":"Günlük hayat","t":"Teşekkür ederken","d":"Bir iyilik görünce karşılık olarak söylenir.","ar":"جَزَاكَ اللّٰهُ خَيْرًا","ok":"Cezâkallâhu hayran.","m":"Allah seni hayırla mükâfatlandırsın.","f":"Peygamberimiz, kendisine iyilik yapılan kimsenin bunu söylemesinin övgüde en ileri derece olduğunu bildirmiştir.","k":"Tirmizî, Birr 87"},{"g":"Kapsamlı dualar","t":"Dünya ve ahiret iyiliği duası","d":"Her zaman okunabilir; Peygamberimizin en çok yaptığı duadır.","ar":"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","ok":"Rabbenâ âtinâ fi'd-dünyâ haseneten ve fi'l-âhireti haseneten ve kınâ azâbe'n-nâr.","m":"Rabbimiz! Bize dünyada da iyilik ver, ahirette de iyilik ver. Bizi ateş azabından koru.","f":"Peygamberimizin en çok yaptığı dua budur.","k":"Bakara 201; Buhârî, Deavât 55"},{"g":"Kapsamlı dualar","t":"Kadir gecesi duası","d":"Kadir gecesinde ve her zaman okunabilir.","ar":"اللّٰهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي","ok":"Allâhümme inneke afüvvün tühibbü'l-afve fa'fu annî.","m":"Allah'ım! Sen çok affedicisin, affetmeyi seversin; beni affet.","f":"Hz. Âişe, Kadir gecesine rastlarsa ne söyleyeceğini sorduğunda Peygamberimiz bu duayı öğretmiştir.","k":"Tirmizî, Deavât 84"},{"g":"Kapsamlı dualar","t":"Hasbünallâh","d":"Korku ve tehlike anında okunur.","ar":"حَسْبُنَا اللّٰهُ وَنِعْمَ الْوَكِيلُ","ok":"Hasbünallâhu ve ni'me'l-vekîl.","m":"Allah bize yeter. O ne güzel vekildir.","f":"Hz. İbrâhim ateşe atılırken, Peygamberimiz de düşman topluluğuna karşı bunu söylemiştir.","k":"Âl-i İmrân 173; Buhârî, Tefsîr (Âl-i İmrân) 13"},{"g":"Kapsamlı dualar","t":"İlmin artması için","d":"İlim öğrenirken okunur.","ar":"رَبِّ زِدْنِي عِلْمًا","ok":"Rabbi zidnî ilmâ.","m":"Rabbim! İlmimi artır.","f":"","k":"Tâhâ 114"},{"g":"Kapsamlı dualar","t":"Anne baba için","d":"Anne baba için her zaman okunur.","ar":"رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا","ok":"Rabbi'rhamhümâ kemâ rabbeyânî sağîrâ.","m":"Rabbim! Küçükken onlar beni nasıl yetiştirdilerse, sen de onlara öyle merhamet et.","f":"","k":"İsrâ 24"}];
const HELAL={"giris":"İslam'da asıl olan, temiz ve faydalı şeylerin helal olmasıdır. Kur'an-ı Kerim, haram olanları açıkça bildirir; bunların dışında kalanlar, aksine bir delil olmadıkça helaldir. Rabbimiz şöyle buyurur: Ey insanlar! Yeryüzünde bulunan şeylerden helal ve temiz olarak yiyin. (Bakara 168)","bolum":[{"b":"Kur'an'da açıkça haram kılınanlar","tip":"haram","m":[["Leş","Kendiliğinden ölmüş ya da İslami usule göre kesilmemiş hayvanın eti. Deniz hayvanları bu hükmün dışındadır.","Bakara 173; Mâide 3"],["Akıtılmış kan","Kesim sırasında akan kan. Et içinde kalan az miktardaki kan bu hükme girmez.","En'âm 145"],["Domuz eti","Domuzun eti ve ondan elde edilen bütün ürünler: yağı, jelatini ve diğer türevleri.","Bakara 173; Mâide 3; En'âm 145"],["Allah'tan başkası adına kesilen","Allah'ın adı yerine put ya da başka bir şey adına kesilen hayvan.","Bakara 173; Mâide 3"],["Boğulmuş, vurularak öldürülmüş, yüksekten düşmüş, boynuzlanmış hayvan","Ölmeden önce yetişilip usulüne uygun kesilenler bunun dışındadır.","Mâide 3"],["Yırtıcı hayvanın parçaladığı","Yırtıcı hayvanın öldürdüğü hayvan. Canlıyken yetişilip kesilirse yenebilir.","Mâide 3"],["İçki ve sarhoşluk veren her şey","Şarap, bira, rakı gibi alkollü içkiler. Peygamberimiz, sarhoşluk veren her şeyin haram olduğunu bildirmiştir.","Mâide 90; Buhârî, Eşribe; Müslim, Eşribe"]]},{"b":"Hadislerle haram kılınanlar","tip":"haram","m":[["Azı dişiyle avlanan yırtıcı hayvanlar","Aslan, kurt, köpek, kedi gibi hayvanlar.","Müslim, Sayd"],["Pençesiyle avlanan yırtıcı kuşlar","Kartal, şahin, atmaca gibi kuşlar.","Müslim, Sayd"],["Evcil eşek","Peygamberimiz Hayber günü evcil eşeğin etini yasaklamıştır.","Buhârî, Megâzî; Müslim, Sayd"]]},{"b":"Helal olanlar","tip":"helal","m":[["Usulüne uygun kesilen kara hayvanları","Koyun, keçi, sığır, deve, tavuk, hindi, kaz, ördek gibi hayvanlar; Allah'ın adı anılarak kesilmelidir.","En'âm 118; Mâide 1"],["Balık","Bütün mezheplere göre helaldir; kesilmeleri gerekmez.","Mâide 96"],["Ehl-i kitabın kestiği","Yahudi ve Hristiyanların usulüne uygun kestiği hayvanlar helaldir.","Mâide 5"],["Tavşan","Peygamberimizin huzurunda yenmiştir.","Buhârî, Zebâih"],["Çekirge","Kesilmeden yenebilen hayvanlardandır.","Buhârî, Zebâih"],["Sebze, meyve, tahıl, süt, bal","Temiz ve faydalı olan bütün bitkisel gıdalar ve hayvan ürünleri helaldir. Zehirli ya da zararlı olanlar bunun dışındadır.","Nahl 69; Abese 24-32"]]},{"b":"Mezhepler arasında görüş farkı olanlar","tip":"farkli","m":[["Midye, karides, kalamar, ahtapot","Hanefî mezhebine göre balık dışındaki deniz hayvanları yenmez. Şâfiî, Mâlikî ve Hanbelî mezheplerine göre helaldir. Diyanet, her iki görüşü de aktarır.","Mâide 96"],["Yengeç ve ıstakoz","Hanefîlere göre yenmez; diğer üç mezhebe göre helaldir.","Mâide 96"],["At eti","İmam Ebû Hanîfe'ye göre mekruhtur; İmam Ebû Yûsuf ve İmam Muhammed ile diğer mezheplere göre helaldir.","Buhârî, Zebâih"],["Kurbağa","Bütün mezheplere göre yenmez. Hanefîlere göre balık dışındaki deniz ve su hayvanlarıyla aynı hükümdedir.","Ebû Dâvûd, Edeb"]]},{"b":"Dikkat edilmesi gereken katkı maddeleri","tip":"dikkat","m":[["Jelatin (E441)","Domuz kaynaklıysa haramdır. Sığır ya da balık kaynaklı ve helal kesimden elde edilmişse helaldir. Helal sertifikası olan ürün tercih edilmelidir.",""],["Karmin (E120)","Bir böcek türünden elde edilen kırmızı renklendiricidir. Âlimler arasında görüş farkı bulunur; şüpheli görülen ürünlerden kaçınmak daha ihtiyatlıdır.",""],["Mono ve digliseritler (E471)","Bitkisel ya da hayvansal yağdan üretilebilir. Kaynağı bilinmiyorsa helal sertifikasına bakılmalıdır.",""],["L-sistein (E920)","Bazı unlu mamullerde kullanılır; kaynağı kıl ya da tüy olabilir. Helal sertifikasına bakılmalıdır.",""],["Alkol içeren aromalar","Vanilya özütü gibi bazı aromalar alkol içerebilir. Ürünün içeriğini okumak ya da helal sertifikalı ürün almak gerekir.",""],["Peynir mayası","Hayvansal maya, helal kesilmiş hayvandan elde edilmelidir. Mikrobiyal ve bitkisel maya sorun oluşturmaz.",""]]}],"supheli":"Peygamberimiz şöyle buyurmuştur: Helal de bellidir, haram da bellidir. Bu ikisi arasında pek çok insanın bilmediği şüpheli şeyler vardır. Şüpheli şeylerden sakınan, dinini ve namusunu korumuş olur. (Buhârî, Îmân 39; Müslim, Müsâkât 107)","zaruret":"Zaruret hâli: Açlıktan ölme tehlikesi gibi zorunlu durumlarda, haram olan şeyden hayatı kurtaracak kadar yemek günah değildir. (Bakara 173)","not":"Bu bilgiler Kur'an-ı Kerim, sahih hadisler ve Diyanet İşleri Başkanlığı'nın görüşleri esas alınarak hazırlanmıştır. Tereddüt edilen konularda Diyanet'in Alo 190 Fetva Hattı'na danışılabilir."};

function yemekSVG(i){const sp=YSPEC[i%YSPEC.length];const [tip,c,ek]=sp;let seed=i*97+13;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

  })};
  const plate=(cx,cy,rx,ry)=>add(`<ellipse cx="${cx}" cy="${cy+6}" rx="${rx}" ry="${ry}" fill="#0002"/><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fbfaf6" stroke="#d9d2c0" stroke-width="2"/><ellipse cx="${cx}" cy="${cy}" rx="${rx*.78}" ry="${ry*.74}" fill="none" stroke="#e6dfcd" stroke-width="2"/>`);

const hav=(a,b,c,d)=>{const R=6371000,r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const fmtM=m=>m<1000?Math.round(m/10)*10+" m":(m/1000).toLocaleString("tr-TR",{maximumFractionDigits:1})+" km";
function getPos(){return new Promise((ok,no)=>{const G=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Geolocation;
  if(G)return G.getCurrentPosition({enableHighAccuracy:true,timeout:15000}).then(p=>ok(p.coords)).catch(no);
  if(!navigator.geolocation)return no(new Error("yok"));navigator.geolocation.getCurrentPosition(p=>ok(p.coords),no,{enableHighAccuracy:true,timeout:15000,maximumAge:60000})})}
async function camiAra(lat,lng,r){const q=`[out:json][timeout:25];(node["amenity"="place_of_worship"]["religion"="muslim"](around:${r},${lat},${lng});way["amenity"="place_of_worship"]["religion"="muslim"](around:${r},${lat},${lng}););out center tags;`;
  const res=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
  if(!res.ok)throw new Error("http "+res.status);const j=await res.json();
  return j.elements.map(e=>{const t=e.tags||{},la=e.lat??(e.center&&e.center.lat),lo=e.lon??(e.center&&e.center.lon);
    let img=null;if(/^https:\/\//.test(t.image||""))img={url:t.image,kaynak:""};else if(/^File:/i.test(t.wikimedia_commons||""))img={file:t.wikimedia_commons.replace(/^File:/i,"")};
    return{ad:t["name:tr"]||t.name||"Adı kayıtlı olmayan cami",lat:la,lng:lo,m:hav(lat,lng,la,lo),img,wd:/^Q\d+$/.test(t.wikidata||"")?t.wikidata:null}}).filter(x=>x.lat!=null).sort((a,b)=>a.m-b.m)}
// Wikidata'dan serbest lisanslı (Wikimedia Commons) cami fotoğrafı
async function camiResim(list){const ids=list.filter(c=>!c.img&&c.wd).map(c=>c.wd).slice(0,40);if(!ids.length)return;
  try{const r=await fetch("https://www.wikidata.org/w/api.php?action=wbgetentities&props=claims&format=json&origin=*&ids="+ids.join("|"));const j=await r.json();
    list.forEach(c=>{const e=c.wd&&j.entities&&j.entities[c.wd];const f=e&&e.claims&&e.claims.P18&&e.claims.P18[0].mainsnak.datavalue&&e.claims.P18[0].mainsnak.datavalue.value;if(f&&!c.img)c.img={file:f}})}catch(e){}}
const commonsUrl=(f,w)=>"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(f.replace(/ /g,"_"))+"?width="+w;
const camiCizim=`<svg viewBox="0 0 160 100" aria-hidden="true" style="width:100%;height:100%;display:block"><rect width="160" height="100" fill="#e9dfc8"/><path d="M50 80 V58 Q50 38 80 32 Q110 38 110 58 V80Z" fill="#1d6b55"/><circle cx="80" cy="27" r="3" fill="#c9a24a"/><rect x="28" y="30" width="7" height="50" fill="#1d6b55"/><path d="M28 30 L31.5 18 L35 30Z" fill="#c9a24a"/><rect x="125" y="30" width="7" height="50" fill="#1d6b55"/><path d="M125 30 L128.5 18 L132 30Z" fill="#c9a24a"/><rect x="20" y="80" width="120" height="6" fill="#9b8a63"/><path d="M73 80 V66 Q80 58 87 66 V80Z" fill="#e9dfc8"/></svg>`;
const navUrl=(c,mod)=>`https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}&travelmode=${mod}&dir_action=navigate`;
function disGit(url){try{if(isNative())location.href=url;else window.open(url,"_blank","noopener")}catch(e){location.href=url}}
let leafletYuk=null;
function leaflet(){if(window.L)return Promise.resolve(window.L);if(leafletYuk)return leafletYuk;
  leafletYuk=new Promise((ok,no)=>{const l=document.createElement("link");l.rel="stylesheet";l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";document.head.appendChild(l);
    const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";s.onload=()=>ok(window.L);s.onerror=()=>{leafletYuk=null;no()};document.head.appendChild(s)});return leafletYuk}

const NMZ=[{"g":"Farz namazlar","ad":"Beş Vakit Namaz","h":"Farz","r":"Günde 17 rekât farz; sünnetlerle birlikte 40 rekât","z":"Sabah, öğle, ikindi, akşam ve yatsı vakitlerinde.","ne":"Akıllı ve ergenlik çağına girmiş her Müslümana farz olan, İslam'ın beş şartından biridir. Allah'a kulluğun en önemli göstergesidir.","fz":"Peygamberimiz, beş vakit namazı, kapısının önünden akan ve günde beş defa yıkandığı bir ırmağa benzetmiş, böyle yıkanan kimsede kir kalmayacağı gibi beş vakit namazın da günahları sildiğini bildirmiştir.","k":"Nisâ 103; Buhârî, Mevâkît; Müslim, Mesâcid","kl":["Her vaktin rekât sayısı ve sünnetleri Namaz Öğreniyorum bölümündeki tabloda yer alır.","İki rekâtlı namazda: niyet edilir, iftitah tekbiri alınır, Sübhâneke okunur, Eûzü Besmele çekilir, Fâtiha ve bir sure okunur, rükû ve iki secde yapılır.","İkinci rekâtta Fâtiha ve sure okunur, rükû ve secdelerden sonra oturulur; Ettehiyyâtü, Allâhümme salli, Allâhümme bârik ve Rabbenâ duaları okunur, sağa ve sola selam verilir.","Dört rekâtlı farzlarda ikinci rekâttan sonraki oturuşta yalnız Ettehiyyâtü okunup kalkılır; üçüncü ve dördüncü rekâtlarda sadece Fâtiha okunur."],"du":["Sübhâneke","Fâtiha","Zamm-ı sure","Ettehiyyâtü","Allâhümme salli","Allâhümme bârik","Rabbenâ"]},{"g":"Farz namazlar","ad":"Cuma Namazı","h":"Farz (erkeklere)","r":"4 rekât ilk sünnet, 2 rekât farz, 4 rekât son sünnet","z":"Cuma günü öğle namazı vaktinde, öğle namazının yerine.","ne":"Hür, mukim, sağlıklı ve akıllı erkeklere farzdır. Müslümanların haftalık toplanıp hutbe dinlediği ve birlikte namaz kıldığı büyük bir ibadettir. Kadınlar ve yolcular kılmak zorunda değildir; kılarlarsa öğle namazı yerine geçer.","fz":"Ey iman edenler! Cuma günü namaz için çağrı yapıldığında Allah'ı anmaya koşun ve alışverişi bırakın.","k":"Cuma 9; Müslim, Cuma","kl":["Önce dört rekât ilk sünnet, öğlenin ilk sünneti gibi kılınır.","Ardından imam hutbe okur; cemaat hutbeyi sessizce dinler.","İki rekât farz, imamla birlikte cemaatle kılınır; imam Fâtiha ve sureyi sesli okur.","Sonra dört rekât son sünnet kılınır."],"du":["Sübhâneke","Fâtiha","Zamm-ı sure","Ettehiyyâtü","Allâhümme salli","Allâhümme bârik","Rabbenâ"]},{"g":"Farz namazlar","ad":"Cenaze Namazı","h":"Farz-ı kifâye","r":"Rükû ve secdesi yoktur; ayakta dört tekbirle kılınır","z":"Ölen Müslüman yıkanıp kefenlendikten sonra, defnedilmeden önce.","ne":"Ölen Müslüman için Allah'tan bağışlanma dilemek amacıyla kılınır. Bir topluluktan bazılarının kılmasıyla diğerlerinin üzerinden sorumluluk kalkar; hiç kimse kılmazsa hepsi sorumlu olur.","fz":"Peygamberimiz, bir cenaze namazına katılan kimseye bir kırat, defnedilinceye kadar bekleyene iki kırat sevap verileceğini ve kıratın Uhud Dağı büyüklüğünde olduğunu bildirmiştir.","k":"Buhârî, Cenâiz; Müslim, Cenâiz","kl":["Cenaze kıbleye karşı konur; imam, ölünün göğsü hizasında durur.","Niyet edilir: Allah rızası için namaza, şu ölü için duaya, uydum imama.","Birinci tekbirle eller kaldırılıp bağlanır ve Sübhâneke, ve celle senâük ilavesiyle okunur.","İkinci tekbir eller kaldırılmadan alınır; Allâhümme salli ve Allâhümme bârik okunur.","Üçüncü tekbir alınır; cenaze duası okunur. Bilmeyen, Rabbenâ âtinâ duasını ya da Fâtiha'yı dua niyetiyle okuyabilir.","Dördüncü tekbirden sonra önce sağa, sonra sola selam verilir."],"du":["Sübhâneke (ve celle senâük ilavesiyle)","Allâhümme salli","Allâhümme bârik","Cenaze duası"],"ozel":{"t":"Cenaze duası","o":"Allâhümmağfir li-hayyinâ ve meyyitinâ ve şâhidinâ ve ğâibinâ ve sağîrinâ ve kebîrinâ ve zekerinâ ve ünsânâ. Allâhümme men ahyeytehû minnâ fe-ahyihî ale'l-İslâm, ve men teveffeytehû minnâ fe-teveffehû ale'l-îmân.","m":"Allah'ım! Dirimizi ve ölümüzü, burada bulunanımızı ve bulunmayanımızı, küçüğümüzü ve büyüğümüzü, erkeğimizi ve kadınımızı bağışla. Allah'ım! Bizden yaşattığını İslam üzere yaşat, öldürdüğünü de iman üzere öldür.","k":"Tirmizî, Cenâiz; Ebû Dâvûd, Cenâiz"}},{"g":"Farz namazlar","ad":"Kaza Namazı","h":"Farz namazların kazası farz, vitrin kazası vaciptir","r":"Kazaya kalan namazın rekâtı kadar; yalnız farz ve vitir kaza edilir","z":"Kerahat vakitleri dışında her zaman.","ne":"Vaktinde kılınamayan farz ve vitir namazlarını sonradan yerine getirmek için kılınır. Özürsüz olarak namazı vaktinden sonraya bırakmak günahtır; tövbe edip kaza etmek gerekir.","fz":"Peygamberimiz, bir namazı unutan ya da uyuyup kaçıran kimsenin hatırladığında onu kılmasını, bunun dışında bir kefaretinin olmadığını bildirmiştir.","k":"Buhârî, Mevâkît; Müslim, Mesâcid","kl":["Niyet ederken hangi namazın kazası olduğu belirtilir. Sayısı bilinmeyen çok namaz için: kazaya kalan ilk öğle namazının farzına, diye niyet edilebilir.","Kaza namazı, kazaya kalan namaz nasıl kılınıyorsa öyle kılınır.","Altı vakitten az kazası olan kişi, kaza namazlarını ve vakit namazını sırayla kılar."],"du":["Kılınan namazın duaları"]},{"g":"Vacip namazlar","ad":"Vitir Namazı","h":"Vacip","r":"3 rekât","z":"Yatsı namazından sonra, sabah namazı vakti girinceye kadar.","ne":"Hanefî mezhebine göre vaciptir; yatsının farzından sonra kılınır. Gece namazının son namazıdır.","fz":"Peygamberimiz, vitir namazının hak olduğunu bildirmiş ve onu hiç terk etmemiştir.","k":"Ebû Dâvûd, Vitir","kl":["Akşam namazının farzı gibi ilk iki rekât kılınır; ikinci rekâtta oturulup yalnız Ettehiyyâtü okunur ve kalkılır.","Üçüncü rekâtta Fâtiha ve bir sure okunur.","Sonra eller kulak hizasına kaldırılarak tekbir alınır ve tekrar bağlanır; Kunut duaları okunur.","Rükû ve secdeler yapılıp oturulur; Ettehiyyâtü, Allâhümme salli, Allâhümme bârik ve Rabbenâ okunup selam verilir."],"du":["Sübhâneke","Fâtiha","Zamm-ı sure","Ettehiyyâtü","Kunut duaları","Allâhümme salli","Allâhümme bârik","Rabbenâ"]},{"g":"Vacip namazlar","ad":"Bayram Namazı","h":"Vacip (erkeklere)","r":"2 rekât, cemaatle","z":"Ramazan ve Kurban bayramlarının sabahı, güneş doğup kerahat vakti çıktıktan sonra.","ne":"Ramazan Bayramı'nda orucu tamamlamanın, Kurban Bayramı'nda kurban ibadetinin sevinci ve şükrü olarak kılınır. Cuma namazı kendisine farz olan erkeklere vaciptir. Ezan ve kamet okunmaz.","fz":"Rabbin için namaz kıl ve kurban kes. Bu âyetteki namaz, bayram namazı olarak da yorumlanmıştır.","k":"Kevser 2; Buhârî, Îdeyn","kl":["Niyet edilir ve iftitah tekbiri alınıp eller bağlanır; Sübhâneke okunur.","Ellerin kulak hizasına kaldırıldığı üç zevâid tekbiri alınır. Birinci ve ikinci tekbirden sonra eller yanlara salınır, üçüncüden sonra bağlanır.","İmam Fâtiha ve sure okur; rükû ve secdeler yapılır.","İkinci rekâtta önce Fâtiha ve sure okunur, ardından yine üç zevâid tekbiri alınır ve eller yanlara salınır.","Dördüncü tekbirle eller kaldırılmadan rükûya gidilir; secdelerden sonra oturulup dualar okunur ve selam verilir.","Namazdan sonra imam hutbe okur."],"du":["Sübhâneke","Fâtiha","Zamm-ı sure","Ettehiyyâtü","Allâhümme salli","Allâhümme bârik","Rabbenâ"]},{"g":"Sünnet ve nafile namazlar","ad":"Teravih Namazı","h":"Sünnet-i müekkede","r":"20 rekât (Hanefî mezhebi); ikişer ya da dörder rekât olarak","z":"Ramazan ayında, yatsı namazından sonra, vitirden önce.","ne":"Ramazan gecelerini ihya etmek için kılınır. Erkekler ve kadınlar için sünnettir; cemaatle kılınması daha faziletlidir.","fz":"Peygamberimiz, inanarak ve sevabını Allah'tan umarak Ramazan gecelerini namazla ihya edenin geçmiş günahlarının bağışlanacağını bildirmiştir.","k":"Buhârî, Îmân; Müslim, Salâtü'l-müsâfirîn","kl":["Yatsının farzı ve son sünnetinden sonra kılınır.","Her iki rekâtta bir selam verilerek kılınır; dört rekâtta bir selam vermek de caizdir.","Her dört rekâttan sonra biraz oturulup tesbih, salavat ve dua edilir.","Teravihten sonra vitir namazı kılınır; Ramazan'da vitir cemaatle kılınabilir."],"du":["Sübhâneke","Fâtiha","Zamm-ı sure","Ettehiyyâtü","Allâhümme salli","Allâhümme bârik","Rabbenâ"]},{"g":"Sünnet ve nafile namazlar","ad":"Teheccüd (Gece) Namazı","h":"Sünnet (nafile)","r":"2 ile 8 rekât arası; ikişer rekât","z":"Yatsıdan sonra bir süre uyuyup kalkarak, sabah namazı vaktine kadar. Gecenin son üçte biri en faziletli zamandır.","ne":"Gecenin sessizliğinde Allah'a yönelmek, dua ve istiğfar etmek için kılınır. Peygamberimiz bu namazı düzenli olarak kılardı.","fz":"Peygamberimiz, farz namazlardan sonra en faziletli namazın gece kılınan namaz olduğunu bildirmiştir.","k":"İsrâ 79; Müslim, Sıyâm","kl":["Uyuduktan sonra kalkılır ve abdest alınır.","Teheccüd namazına niyet edilir.","Sabah namazının sünneti gibi ikişer rekât olarak kılınır.","Namazdan sonra dua ve istiğfar edilir."],"du":["Sübhâneke","Fâtiha","Zamm-ı sure","Ettehiyyâtü","Allâhümme salli","Allâhümme bârik","Rabbenâ"]},{"g":"Sünnet ve nafile namazlar","ad":"Kuşluk (Duhâ) ve İşrak Namazı","h":"Sünnet (nafile)","r":"En az 2, en çok 12 rekât; ikişer ya da dörder rekât","z":"Güneş doğup kerahat vakti çıktıktan sonra, öğle vaktine yakın zamana kadar. Bu vaktin başında kılınan kuşluk namazına işrak namazı da denir.","ne":"Günün başlangıcında Allah'a şükretmek için kılınır.","fz":"Peygamberimiz, insanın her bir eklemi için her gün bir sadaka gerektiğini, kuşluk vaktinde kılınan iki rekâtın bunların hepsine yeteceğini bildirmiştir.","k":"Müslim, Salâtü'l-müsâfirîn","kl":["Kuşluk namazına niyet edilir.","Sabah namazının sünneti gibi iki rekât kılınır.","Dilenirse ikişer ya da dörder rekât olarak on iki rekâta kadar artırılabilir."],"du":["Sübhâneke","Fâtiha","Zamm-ı sure","Ettehiyyâtü","Allâhümme salli","Allâhümme bârik","Rabbenâ"]},{"g":"Sünnet ve nafile namazlar","ad":"Tahiyyetü'l-Mescid Namazı","h":"Sünnet (nafile)","r":"2 rekât","z":"Camiye girildiğinde, oturmadan önce. Kerahat vakitlerinde kılınmaz.","ne":"Camiye ve Allah'ın evine saygının ifadesi olarak kılınır. Camiye girince kılınan farz ya da sünnet namaz da bunun yerine geçer.","fz":"Peygamberimiz, mescide giren kimsenin oturmadan önce iki rekât namaz kılmasını emretmiştir.","k":"Buhârî, Salât; Müslim, Salâtü'l-müsâfirîn","kl":["Camiye girince oturmadan önce niyet edilir.","Sabah namazının sünneti gibi iki rekât kılınır."],"du":["Sübhâneke","Fâtiha","Zamm-ı sure","Ettehiyyâtü","Allâhümme salli","Allâhümme bârik","Rabbenâ"]},{"g":"Sünnet ve nafile namazlar","ad":"Abdest Namazı","h":"Sünnet (nafile)","r":"2 rekât","z":"Abdest aldıktan sonra, organlar kurumadan; kerahat vakitleri dışında.","ne":"Abdest nimetine şükür olarak kılınır.","fz":"Peygamberimiz, Hz. Bilâl'e cennette onun ayak seslerini önünde duyduğunu söylemiş; Hz. Bilâl de her abdestten sonra namaz kıldığını belirtmiştir.","k":"Buhârî, Teheccüd; Müslim, Fezâilü's-sahâbe","kl":["Abdest aldıktan sonra niyet edilir.","Sabah namazının sünneti gibi iki rekât kılınır."],"du":["Sübhâneke","Fâtiha","Zamm-ı sure","Ettehiyyâtü","Allâhümme salli","Allâhümme bârik","Rabbenâ"]},{"g":"Sünnet ve nafile namazlar","ad":"Evvâbîn Namazı","h":"Nafile","r":"6 rekât; ikişer rekât","z":"Akşam namazının farzı ve sünnetinden sonra.","ne":"Allah'a yönelenlerin namazı anlamına gelir. Akşam ile yatsı arasını ibadetle değerlendirmek için kılınır.","fz":"Bu namazın fazileti hakkında rivayetler bulunmakla birlikte, bu rivayetlerin sıhhati zayıf kabul edilmiştir. Nafile namaz olarak kılınabilir.","k":"Tirmizî, Salât","kl":["Akşam namazından sonra niyet edilir.","İkişer rekât olarak toplam altı rekât kılınır."],"du":["Sübhâneke","Fâtiha","Zamm-ı sure","Ettehiyyâtü","Allâhümme salli","Allâhümme bârik","Rabbenâ"]},{"g":"Özel durumlarda kılınan namazlar","ad":"İstihare Namazı","h":"Sünnet","r":"2 rekât","z":"Hayırlı olup olmadığı bilinmeyen meşru bir iş için karar vermeden önce; kerahat vakitleri dışında.","ne":"Evlilik, iş, yolculuk gibi bir konuda hayırlı olanın nasip edilmesi için Allah'tan yardım istemek amacıyla kılınır. Ardından istihare duası okunur. Rüya görmek şart değildir; kişi gönlünün yöneldiği ve hayırlı gördüğü işi yapar.","fz":"Hz. Câbir, Peygamberimizin ashabına Kur'an'dan bir sure öğretir gibi her işte istihareyi öğrettiğini bildirmiştir.","k":"Buhârî, Teheccüd; Deavât","kl":["İstihare namazına niyet edilir.","Birinci rekâtta Fâtiha'dan sonra Kâfirûn, ikinci rekâtta İhlâs suresi okunması tavsiye edilir.","Namaz bitince istihare duası okunur; dua sırasında işin adı anılır."],"du":["Sübhâneke","Fâtiha","Kâfirûn","İhlâs","Ettehiyyâtü","Allâhümme salli","Allâhümme bârik","Rabbenâ","İstihare duası"],"ozel":{"t":"İstihare duası","o":"Allâhümme innî estehîruke bi-ilmike ve estakdiruke bi-kudretike ve es'elüke min fadlike'l-azîm. Fe-inneke takdiru ve lâ akdiru, ve ta'lemu ve lâ a'lemu, ve ente allâmü'l-ğuyûb. Allâhümme in künte ta'lemu enne hâze'l-emra hayrun lî fî dînî ve meâşî ve âkıbeti emrî, fakdurhu lî ve yessirhu lî, sümme bârik lî fîh. Ve in künte ta'lemu enne hâze'l-emra şerrun lî fî dînî ve meâşî ve âkıbeti emrî, fasrifhu annî vasrifnî anhu, vakdur liye'l-hayra haysü kâne, sümme ardınî bih.","m":"Allah'ım! İlminle senden hayır diliyorum, kudretinle senden güç diliyorum ve büyük lütfundan istiyorum. Çünkü sen güç yetirirsin, ben yetiremem; sen bilirsin, ben bilemem; gizlilikleri en iyi bilen sensin. Allah'ım! Eğer bu işin dinim, geçimim ve işimin sonu bakımından benim için hayırlı olduğunu biliyorsan onu bana takdir et, kolaylaştır ve onu bana mübarek kıl. Eğer bu işin dinim, geçimim ve işimin sonu bakımından benim için kötü olduğunu biliyorsan onu benden, beni de ondan uzaklaştır. Hayır nerede ise onu bana takdir et, sonra beni ondan razı kıl.","k":"Buhârî, Teheccüd; Deavât"}},{"g":"Özel durumlarda kılınan namazlar","ad":"Hacet Namazı","h":"Nafile","r":"2 rekât ya da daha fazla","z":"Allah'tan meşru bir dileği olan kimse tarafından, kerahat vakitleri dışında.","ne":"Dünya ve ahiretle ilgili meşru bir ihtiyacın giderilmesi için Allah'a yönelmek amacıyla kılınır. Namazdan sonra hamd, salavat ve dua edilir; dilek yalnızca Allah'tan istenir.","fz":"Hacet namazıyla ilgili rivayetler zayıf kabul edilir. Ancak namaz kılıp Allah'a dua etmek her zaman meşrudur.","k":"Tirmizî, Vitir; İbn Mâce, İkâme","kl":["Hacet namazına niyet edilir.","Sabah namazının sünneti gibi iki rekât kılınır.","Namazdan sonra Allah'a hamd edilir, Peygamberimize salavat getirilir ve dilek Allah'a arz edilir."],"du":["Sübhâneke","Fâtiha","Zamm-ı sure","Ettehiyyâtü","Allâhümme salli","Allâhümme bârik","Rabbenâ"]},{"g":"Özel durumlarda kılınan namazlar","ad":"Tövbe Namazı","h":"Nafile","r":"2 rekât","z":"Bir günah işlendikten sonra, pişmanlık duyulduğunda; kerahat vakitleri dışında.","ne":"İşlenen günahtan pişmanlık duyup Allah'tan bağışlanma dilemek için kılınır.","fz":"Hz. Ebû Bekir'in rivayetine göre Peygamberimiz, günah işleyen bir kulun güzelce abdest alıp iki rekât namaz kılması ve Allah'tan bağışlanma dilemesi hâlinde Allah'ın onu bağışlayacağını bildirmiştir.","k":"Âl-i İmrân 135; Ebû Dâvûd, Vitir; Tirmizî, Salât","kl":["Abdest alınır ve tövbe namazına niyet edilir.","İki rekât kılınır.","Namazdan sonra samimi olarak istiğfar edilir; günahı bir daha işlememeye karar verilir. Kul hakkı varsa sahibine ödenir."],"du":["Sübhâneke","Fâtiha","Zamm-ı sure","Ettehiyyâtü","Allâhümme salli","Allâhümme bârik","Rabbenâ","Seyyidü'l-istiğfâr"]},{"g":"Özel durumlarda kılınan namazlar","ad":"Tesbih Namazı","h":"Nafile","r":"4 rekât; toplam 300 tesbih","z":"Kerahat vakitleri dışında her zaman; ömürde bir defa da olsa kılınması tavsiye edilmiştir.","ne":"Allah'ı tesbih ve hamd ederek anmanın yoğun olduğu bir namazdır. Her rekâtta 75 defa tesbih okunur.","fz":"Peygamberimizin bu namazı amcası Hz. Abbas'a öğrettiği rivayet edilmiştir. Rivayetin sıhhati hakkında âlimler farklı görüşler ileri sürmüştür.","k":"Ebû Dâvûd, Tatavvu; Tirmizî, Vitir; İbn Mâce, İkâme","kl":["Tesbih: Sübhânallâhi ve'l-hamdü lillâhi ve lâ ilâhe illallâhu vallâhu ekber.","Her rekâtta: Sübhâneke'den sonra 15, Fâtiha ve sureden sonra 10, rükûda rükû tesbihinden sonra 10, rükûdan doğrulunca 10, birinci secdede 10, iki secde arasında oturunca 10, ikinci secdede 10 defa okunur.","Böylece bir rekâtta 75, dört rekâtta 300 tesbih tamamlanır.","İkinci rekâtta oturulup Ettehiyyâtü okunur, dördüncü rekâttan sonra dualar okunup selam verilir."],"du":["Sübhâneke","Fâtiha","Zamm-ı sure","Tesbih","Ettehiyyâtü","All const esmaCore=s=>trLow(s).replace(/['’ʼ`-]/g,"").replace(/^(el|er|es|ez|eş|ed|et|en|ya|yâ)\s*/,"").replace(/[^a-zçğıöşü]/g,"");
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function esmaEsles(alts,ok){const c=esmaCore(ok);return alts.some(t=>{const words=trLow(t).split(/\s+/).filter(Boolean);const joined=esmaCore(t);
  if(joined.includes(c))return true;const cands=[joined,...words.map(esmaCore)];for(let i=0;i<words.length-1;i++)cands.push(esmaCore(words[i]+words[i+1]));
  return cands.some(x=>x&&1-lev(x,c)/Math.max(x.length,c.length)>=0.72)})}
function esmaDinle(i,son){const e=ESMA[i];const ok=Speech.speak(e[0],"ar-SA",0.7);if(!ok)TTS.play([{t:e[1]+". "+e[2],p:0}],0,()=>{},()=>son&&son());else if(son)setTimeout(son,2600)}

/* ---------- SES KATMANI: tarayıcıda Web Speech, APK'da Capacitor eklentileri ---------- */
const Speech=(()=>{
  const plugins=()=>(window.Capacitor&&window.Capacitor.Plugins)||{};
  const WSR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=null,active=false,capSubs=[],lastErr="",capGen=0,capWatch=null;
  const supported=()=>!!(plugins().SpeechRecognition||WSR);
  function stop(){active=false;try{rec&&rec.abort()}catch(e){}rec=null;
    capGen++;clearInterval(capWatch);capWatch=null;const C=plugins().SpeechRecognition;if(C){try{C.stop()}catch(e){}capSubs.forEach(s=>{try{s.remove()}catch(e){}});capSubs=[]}}
  // o: {lang, continuous, onText(text, isFinal, alts), onSession(), onState(bool), onError(code)}
  async function start(o){
    stop();active=true;lastErr="";
    const C=plugins().SpeechRecognition;
    if(C){ // Android yerel tanıma (APK)
      try{const p=await C.requestPermissions();if(p&&p.speechRecognition==="denied"){active=false;o.onError&&o.onError("not-allowed");return}}catch(e){}

/* ---------- Kur'an sesli takip ---------- */
function startTracking(n,ctl){
  // ctl: {words:[{el,norm}], from, onPos(p), onState(on), onMsg(text,cls)}
  const W=ctl.words;let p=ctl.from||0,base=p,lastFinalP=p,miss=0;
  const thr=w=>w.length<=2?0.99:w.length<=4?0.6:0.55;
  function align(start,rec){let q=start;
    for(const r of rec){if(q>=W.length)break;let hit=-1,span=1;
      for(let j=q;j<Math.min(W.length,q+3)&&hit<0;j++){if(sim(r,W[j].norm)>=(j===q?thr(W[j].norm):Math.max(0.8,thr(W[j].norm))))hit=j;
        else if(j+1<W.length&&sim(r,W[j].norm+W[j+1].norm)>=0.6){hit=j;span=2}}
      if(hit<0&&q+1<W.length&&r.length>=3){} // eşleşmeyen kelime atlanır
      if(hit>=0)q=hit+span}
    return q}
  Speech.start({lang:"ar-SA",continuous:true,onState:ctl.onState,
    onSession:()=>{base=p},
    onText:(t,fin)=>{const rec=arNorm(t).split(" ").filter(Boolean);const np=align(base,rec);
      if(np>p){p=np;miss=0;ctl.onPos(p)}else if(fin&&rec.length){miss++;if(miss>=1)ctl.onMsg(`Duyulan: "${t.split(" ").slice(-3).join(" ")}" — işaretli kelimeden tekrar oku.`,"bad")}
      if(p>=W.length){ctl.onMsg("Sure tamamlandı. Allah kabul etsin.","good");Speech.stop();ctl.onState(false)}},
    onError:e=>{const m=micError(e);if(m)ctl.onMsg(m,"bad");if(!Speech.isActive())ctl.onState(false)}});
  return{set(i){p=base=i;ctl.onPos(p)}}
}

  clearInterval(tick);Speech.stop();playerStop();playerStop=()=>{};
  const h=(location.hash||"#vakit").slice(1);
  try{h==="vakit"?setTimeout(cerceveKur,60):cerceveGizle()}catch(e){}
  const tab={vakit:"vakit",kuran:"kuran",dualar:"dualar",gdua:"dualar",duaolustur:"dualar",ogren:"ogren",namaz:"ogren",temel:"ogren",namazlar:"ogren"}[h]||(/^(sure|sesli|pasaj)-/.test(h)?"kuran":h.startsWith("dua-")?"dualar":/^(ders|sinav|nmz)-/.test(h)?"ogren":"diger");
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===tab?"page":"false"));
  if(h.startsWith("sure-")){const p=h.split("-");return vSure(+p[1],+p[2]||0,false)}
  if(h.startsWith("pasaj-")){const p=h.split("-").map(Number);return vSure(p[1],0,false,[p[2],p[3]||p[2]])}
  if(h.startsWith("sesli-")){return vSure(+h.split("-")[1],0,true)}
  if(h.startsWith("ders-")){return vDers(+h.split("-")[1])}
  if(h.startsWith("sinav-")){return vSinav(+h.split("-")[1])}
  if(h==="hk")return vHK();
  if(h.startsWith("hikaye-"))return vHikaye(+h.split("-")[1]);
  if(h.startsWith("turbe-"))return vTurbe(+h.split("-")[1]);
  if(h.startsWith("yemek-"))return vYemek(+h.split("-")[1]);
  if(h.startsWith("nmz-"))return vNmz(+h.split("-")[1]);
  if(h.startsWith("zikir-"))return vZikir(+h.split("-")[1]);
  if(h.startsWith("hatim-"))return vHatimDetay(h.slice(6));
  if(h.startsWith("benimduam-"))return vBenimDuam(+h.split("-")[1]);
  if(h.startsWith("hk-")){const p=h.split("-");return vHKBook(p[1],p[2]!==undefined?p[2]:null)}
  if(h.startsWith("dua-")){const d=DUA[+h.slice(4)];return vDualar(d?d.t:null)}
  ({vakit:vNow,kuran:vKuran,ogren:vOgren,namaz:vNamaz,temel:vTemel,dualar:vDualar,diger:vDiger,hadis:vHadis,sc:vSSS,sss:vSSS,hesap:vHesap,arsiv:vArsiv,hikayeler:vHikayeler,turbeler:vTurbeler,isimler:vIsimler,dinigunler:vDiniGunler,esma:vEsma,hatim:vHatim,duaolustur:vDuaOlustur,yolculuk:vYolculuk,zikirarsiv:vZikirArsiv,yarisma:vYarisma,rivayetler:vRivayetler,namazlar:vNamazlar,cami:vCami,yemek:vYemek,gdua:vGDua,helal:vHelal,tesbih:vTesbih,kible:vKible,ayarlar:vAyar}[h]||vNow)();
  window.scrollTo(0,0);
}

route();

</script>
