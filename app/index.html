  const posAt=x=>{const r=seek.getBoundingClientRect();return Math.round(Math.max(0,Math.min(1,(x-r.left)/r.width))*(sents.length-1))};
  const preview=i=>{view.querySelectorAll(".snt.now").forEach(x=>x.classList.remove("now"));const el=view.querySelector(`.snt[data-i="${i}"]`);if(el){el.classList.add("now");el.scrollIntoView({block:"center"})}setBar(i);lab.textContent=`Buradan başlat: cümle ${i+1}/${sents.length}`};
  const startAt=i=>{dragging=false;seek.classList.remove("drag");if(TTS.state().on)TTS.jump(i);else TTS.play(sents,i,mark,ended);icon(true)};
  let pend=0;
  seek.onpointerdown=e=>{e.preventDefault();dragging=true;seek.classList.add("drag");try{seek.setPointerCapture(e.pointerId)}catch(_){}if(TTS.state().on&&!TTS.state().paused)TTS.pause();pend=posAt(e.clientX);preview(pend)};
  seek.onpointermove=e=>{if(!dragging)return;const i=posAt(e.clientX);if(i!==pend){pend=i;preview(i)}};
  seek.onpointerup=e=>{if(!dragging)return;startAt(posAt(e.clientX))};
  seek.onpointercancel=()=>{if(dragging)startAt(pend)};
  seek.onkeydown=e=>{const d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(!d)return;e.preventDefault();const base=TTS.state().on?TTS.state().i:cur;startAt(Math.max(0,Math.min(sents.length-1,base+d)))};
  setBar(cur);lab.textContent=cur>0?`Kaldığın yer: cümle ${cur+1}/${sents.length}`:lab.textContent;
  if(cur>0)mark(cur);playerStop=()=>{TTS.stop();document.body.classList.remove("playing")};
  window.scrollTo(0,0)}

const TURBE=[{"il":"Adana","ilce":"Seyhan","ad":"Ramazanoğlu Türbesi","zat":"Ramazanoğlu Halil Bey, torunları Mehmed Bey ve Mustafa Bey","donem":"16. yüzyıl","hayat":["Ramazanoğlu Türbesi, Adana Ulu Camii külliyesinin bir parçasıdır. Ulu Camii'nin inşasına 1513 yılında Ramazanoğulları Beyliği'nin beyi Halil Bey tarafından başlandı. Cami, 1541 yılında oğlu Pîrî Mehmed Paşa tarafından tamamlanarak ibadete açıldı.","Türbede Halil Bey ile torunları Mehmed Bey ve Mustafa Bey'in sandukaları bulunur. Türbe, caminin doğu yanında yer alır.","Adana'nın en bilinen türbesi olan bu yapı, şehrin Türk-İslam dönemine tanıklık eder. Ziyaretçiler cami ile birlikte türbeyi de ziyaret ederek dua eder."],"kaynak":"Küre Ansiklopedisi, \"Adana Ulu Camii\"; TDV İslâm Ansiklopedisi, \"Adana\"","harita":"Adana Ulu Camii Ramazanoğlu Türbesi Seyhan Adana"},{"il":"Adıyaman","ilce":"Samsat","ad":"Safvân bin Muattal Türbesi","zat":"Hz. Safvân bin Muattal","donem":"7. yüzyıl","hayat":["Hz. Safvân bin Muattal, Peygamber Efendimizin sahâbîlerindendir. 627 yılından önce Müslüman oldu ve Hendek Savaşı başta olmak üzere birçok seferde bulundu. İfk hadisesinde Hz. Âişe'yi orduya ulaştıran sahâbî odur. Peygamber Efendimiz onun hakkında hayırdan başka bir şey bilmediğini söylemiştir.","Hz. Ömer döneminde İyâz bin Ganm komutasındaki fetihlere katıldı. 639 yılında Sümeysât, yani bugünkü Samsat üzerine gönderilen birliklerin komutanlığına getirildi. Rivayete göre burada şehit düştü.","Samsat'taki türbesi, bugün geniş bir külliye ile birlikte önemli bir ziyaret yeridir. Özellikle kandil gecelerinde çevre illerden çok sayıda ziyaretçi gelir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Safvân b. Muattal\"","harita":"Safvan bin Muattal Türbesi Samsat Adıyaman"},{"il":"Afyonkarahisar","ilce":"Merkez","ad":"Sultan Dîvânî Türbesi (Mevlevî Camii)","zat":"Dîvâne Mehmed Çelebi (Sultan Dîvânî)","donem":"15. yüzyıl – 16. yüzyıl","hayat":["Sultan Dîvânî diye tanınan Dîvâne Mehmed Çelebi, 15. yüzyılın ikinci yarısında Karahisar'da doğdu. Babası Abâpûş-i Velî, Karahisar Mevlevîhânesi'nin şeyhiydi. Babası vefat etmeden bir yıl önce onu mevlevîhânenin başına geçirdi.","Mehmed Çelebi uzun yıllar mevlevîhânede irşat ile meşgul oldu. Mevlevîlikte, Mevlânâ'dan sonra âdeta ikinci pîr olarak kabul edilir. 1544 yılından bir süre sonra vefat ettiği tahmin edilmektedir.","Türbesi, Afyonkarahisar'ın Zâviyesultan mahallesinde, bugün Mevlevî Camii ya da Türbe Camii olarak bilinen yapıdadır. Ortadaki büyük sanduka ona aittir. Türbede postnişinlere ve aile fertlerine ait on iki sanduka daha bulunur."],"kaynak":"TDV İslâm Ansiklopedisi, \"Dîvâne Mehmed Çelebi\" ve \"Karahisar Mevlevîhânesi\"","harita":"Mevlevi Camii Sultan Divani Türbesi Afyonkarahisar"},{"il":"Ağrı","ilce":"Doğubayazıt","ad":"Ahmed-i Hânî Türbesi","zat":"Ahmed-i Hânî","donem":"1651 – yaklaşık 1707","hayat":["Ahmed-i Hânî, 1651 yılında doğmuş bir şair ve mutasavvıftır. Arapça, Farsça, Türkçe ve Kürtçe şiirler yazdı. En tanınmış eseri, 1693 yılında tamamladığı Mem û Zîn adlı manzum hikâyedir.","Çocukların Kur'an eğitiminden sonra dil öğrenmesini kolaylaştırmak için Nûbahâr adlı manzum bir sözlük hazırladı. Ehl-i sünnet inancını anlatan manzum bir akaid risalesi de yazdı. Genel kabule göre 1707 yılında Doğubayazıt'ta vefat etti.","Türbesi, Doğubayazıt'ta İshak Paşa Sarayı'nın yakınındadır. Bugün de bölgenin en çok ziyaret edilen manevi mekânlarından biridir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Hânî, Şeyh Ahmed\"","harita":"Ahmed-i Hani Türbesi Doğubayazıt Ağrı"},{"il":"Amasya","ilce":"Merkez","ad":"Pîr İlyas Türbesi","zat":"Pîr İlyas","donem":"15. yüzyıl","hayat":["Pîr İlyas, Amasya'da yetişmiş Halvetî şeyhlerindendir. Tekkesi, Amasya'nın Pîrler semtindedir. Osmanlı'nın tanınmış kadın şairlerinden Mihrî Hatun, onun torunudur. Hayatının ayrıntıları hakkında kaynaklardaki bilgiler sınırlıdır.","Pîr İlyas, 15. yüzyılın başlarında Amasya'da irşat faaliyetinde bulundu. Onun döneminde Amasya, Halvetî yolunun Anadolu'daki önemli merkezlerinden biri oldu. Adını taşıyan tekke, Pîrler semtinde 1412 yılında kurulan Halvetî tekkesiyle özdeşleştirilir.","Pîr İlyas'ın türbesi, Amasya'nın manevi mekânları arasında sayılır. Ziyaretçiler, şehrin tarihî dokusu içinde bu türbeyi de ziyaret eder."],"kaynak":"TDV İslâm Ansiklopedisi, \"Yâkub Paşa Tekkesi\", \"Halvetiyye\" ve \"Mihrî Hatun\" maddeleri","harita":"Pir İlyas Türbesi Pirler Amasya"},{"il":"Ankara","ilce":"Altındağ","ad":"Hacı Bayrâm-ı Velî Türbesi","zat":"Hacı Bayrâm-ı Velî","donem":"14. yüzyıl – 1430","hayat":["Hacı Bayrâm-ı Velî, 14. yüzyılın ilk yarısında Ankara'da doğdu. Önce müderrislik yaptı. Daha sonra Kayseri'de Somuncu Baba diye tanınan Şeyh Hamîdüddîn-i Velî'ye intisap etti ve onun halifesi oldu.","Ankara'ya dönerek Bayramiyye tarikatını kurdu. Akşemseddin başta olmak üzere pek çok talebe yetiştirdi. Bayramiyye kısa sürede Ankara ve çevresinde yayıldı. 1430 yılında Ankara'da vefat etti.","Vefatından birkaç yıl önce yaptırılan ve adını taşıyan caminin yanına defnedildi. Kabri üzerine yapılan türbe, Ankara'nın en önemli manevi mekânı kabul edilir. Türbe, Ulus'ta Augustus Tapınağı'nın hemen yanındadır."],"kaynak":"TDV İslâm Ansiklopedisi, \"Hacı Bayrâm-ı Velî\"","harita":"Hacı Bayram Veli Türbesi Altındağ Ankara"},{"il":"Antalya","ilce":"Elmalı","ad":"Abdal Musa Türbesi","zat":"Abdal Musa","donem":"14. yüzyıl","hayat":["Abdal Musa, Anadolu'nun tanınmış velîlerindendir. Kaynaklara göre aslen Azerbaycan'ın Hoy şehrindendir ve Yatağan Baba'ya bağlanmıştır. Bazı kaynaklar onu Orhan Gazi dönemine ve Bursa'nın fethine kadar götürür. Hayatına dair bilgilerin önemli kısmı menkıbelere dayanır.","Kaygusuz Abdal, onun yetiştirdiği dervişlerin en meşhurudur. Abdal Musa, Bektaşî geleneğinde \"pîr-i sânî\" olarak anılır ve tekkesi dört büyük Bektaşî dergâhından biri sayılır.","Türbesi, Elmalı ilçesine bağlı Tekke köyündeki dergâhtadır. Evliya Çelebi, 17. yüzyılda burada üç yüzden fazla derviş bulunduğunu yazar. Türbe, bugün de yoğun ziyaret alan bir mekândır."],"kaynak":"TDV İslâm Ansiklopedisi, \"Abdal Mûsâ\"","harita":"Abdal Musa Türbesi Tekke Köyü Elmalı Antalya"},{"il":"Aydın","ilce":"Efeler","ad":"Alihanoğlu İsmail Türbesi","zat":"Alihan Baba'nın oğlu İsmail","donem":"14. yüzyıl","hayat":["Bu türbe, Aydınoğulları döneminden günümüze ulaşan en eski Türk yapılarından biridir. Kabul edildiğine göre Horasan'dan gelen derviş Alihan Baba, şehit düşen oğlu İsmail için bu türbeyi yaptırmıştır.","Alihan Baba, Aydın'da adını taşıyan cami ve medreseyi de kurmuştu. Bu yapılar Yunan işgali sırasında yandı. Türbe ise ayakta kalarak şehrin bu döneminden bir hatıra olarak korundu.","Türbe, Efeler ilçesinin Veysipaşa mahallesinde, Hasır Pazarı denilen yerdedir. Kare planlı, kubbeli bir yapıdır. Kitabesi yoktur. Mezar taşlarındaki tarihlere göre 14. yüzyılın sonundan önce yapıldığı düşünülmektedir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Aydın\"; Habertürk (İhlas Haber Ajansı), Aralık 2025","harita":"Alihanoğlu İsmail Türbesi Veysipaşa Efeler Aydın"},{"il":"Balıkesir","ilce":"Karesi","ad":"Karesi Bey Türbesi","zat":"Karesi Bey ve beş oğlu","donem":"1328'den önce","hayat":["Karesi Bey, Balıkesir ve çevresinde kurulan Karesi Beyliği'nin kurucusudur. Bölgeyi bir Türk yurdu hâline getirdi. Oğlu Demirhan Bey'in 1328 yılında Bizans ile yaptığı anlaşmaya göre, bu tarihten önce vefat ettiği anlaşılır. Bazı araştırmacılar ise ölümünü daha geç tarihlere yerleştirir.","Türbe, Balıkesir'in Mustafa Fakih mahallesinde, Paşa Camii'nin yakınındadır. İçinde Karesi Bey'e ve beş oğluna ait olduğu kabul edilen kabirler bulunur.","Bugünkü türbe binası 1920 yılında yeniden yapılmıştır. Şehrin adını veren beyliğin kurucusunun kabri olarak Balıkesirliler için ayrı bir manevi değer taşır."],"kaynak":"TDV İslâm Ansiklopedisi, \"Karesi Bey\" ve \"Balıkesir\"","harita":"Karesi Bey Türbesi Balıkesir"},{"il":"Bilecik","ilce":"Merkez","ad":"Şeyh Edebali Türbesi","zat":"Şeyh Edebali","donem":"13. yüzyıl – 1326","hayat":["Şeyh Edebali, Karaman'da doğdu. Bilecik'e yerleşerek burada bir zaviye kurdu. İlmi ve takvasıyla tanınan bu büyük âlim ve mutasavvıf, Osman Gazi'nin manevi rehberi oldu.","Osman Gazi, dinî ve idari konularda sık sık ona danışırdı. Rivayete göre Osman Gazi'nin gördüğü meşhur rüyayı, Allah'ın ona ve soyuna saltanat vereceği şeklinde yorumladı. Kızı Malhun Hatun'u da Osman Gazi ile evlendirdi.","1326 yılında vefat etti. Türbesi, Bilecik şehir merkezindedir. Osmanlı Devleti'nin kuruluşundaki manevi rolü sebebiyle türbe yıl boyunca ziyaret edilir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Edebâli\"; Kültür ve Turizm Bakanlığı","harita":"Şeyh Edebali Türbesi Bilecik"},{"il":"Bilecik","ilce":"Söğüt","ad":"Ertuğrul Gazi Türbesi","zat":"Ertuğrul Gazi","donem":"13. yüzyıl – yaklaşık 1281","hayat":["Ertuğrul Gazi, Kayı boyunun beyi ve Osman Gazi'nin babasıdır. Söğüt ve çevresine yerleşerek burada Osmanlı Devleti'nin temellerini attı.","Kaynaklara göre en kuvvetli ihtimalle 1281 yılında vefat etti. Ölüm tarihi olarak 1288 veya 1289 yılları da verilmektedir. Söğüt'te toprağa verildi.","Türbesi, Söğüt ilçesinin yaklaşık bir kilometre doğusunda, Söğüt ile Bilecik arasındaki yol üzerindedir. Türbe, vefatından beri Karakeçili aşireti ve Kayı soyundan gelenler için önemli bir ziyaret yeri olmuştur. Her yıl burada anma şenlikleri düzenlenir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Ertuğrul Gazi\"","harita":"Ertuğrul Gazi Türbesi Söğüt Bilecik"},{"il":"Bitlis","ilce":"Güroymak","ad":"Şeyh Abdurrahman Tâgî Türbesi (Nurşin)","zat":"Şeyh Abdurrahman Tâgî","donem":"1831 – 1886","hayat":["Şeyh Abdurrahman Tâgî, 1831 yılında doğdu. Nakşibendî-Hâlidî yolunun bölgedeki önde gelen şeyhlerinden oldu. Güroymak'ın eski adı olan Nurşin'de bir medrese kurdu.","Nurşin medresesi kısa sürede bölgenin önemli ilim ve irşat merkezlerinden biri hâline geldi. Buradan pek çok âlim yetişti. Bediüzzaman Said Nursî de eserlerinde Nurşin'deki bu meclisi hürmetle anar.","Şeyh Abdurrahman Tâgî, 1886 yılında vefat etti. Kabri, Güroymak'taki Nurşin dergâhının yanındadır. Torunu Şeyh Mâsum ve onun soyundan gelen âlimler de bu geleneği sürdürdü. Türbe, bölgenin en çok ziyaret edilen manevi mekânlarındandır."],"kaynak":"Milli Gazete, \"Norşin Medresesi ve Şeyh Nureddin Efendi\"; İslam ve İhsan, \"Türkiye'de Allah Dostları Haritası\"","harita":"Nurşin Dergahı Şeyh Abdurrahman Tagi Türbesi Güroymak Bitlis"},{"il":"Bolu","ilce":"Göynük","ad":"Akşemseddin Türbesi","zat":"Akşemseddin","donem":"1390 – 1459","hayat":["Akşemseddin, 1390 yılında Şam'da doğdu. İlim tahsilinden sonra Hacı Bayrâm-ı Velî'ye intisap etti ve onun halifesi oldu. Hocasının vefatından sonra Bayramiyye'nin manevi önderliğini üstlendi.","1453'te İstanbul kuşatmasında Fatih Sultan Mehmed'in yanında bulundu. Mektuplarıyla padişaha sabır tavsiye etti ve fetih müjdesi verdi. Fetihten sonra Ayasofya'da kılınan ilk cuma namazında hutbeyi okudu. Fatih'in isteği üzerine sahâbî Ebû Eyyûb el-Ensârî'nin kabrini buldu.","Ömrünün sonunda Göynük'e çekildi ve 1459 yılında burada vefat etti. Göynük'teki türbesi bugün de çok ziyaret edilen bir manevi mekândır."],"kaynak":"TDV İslâm Ansiklopedisi, \"Akşemseddin\"","harita":"Akşemseddin Türbesi Göynük Bolu"},{"il":"Bursa","ilce":"Yıldırım","ad":"Emir Sultan Türbesi","zat":"Emir Sultan (Şemseddin Muhammed Buhârî)","donem":"yaklaşık 1368 – 1429","hayat":["Emir Sultan, yaklaşık 1368 yılında Buhara'da doğdu. Seyyid soyundan gelen bu velî, gençliğinde Buhara'dan ayrılarak Anadolu'ya geldi ve Bursa'ya yerleşti.","Yıldırım Bayezid'in kızı Hundi Hatun ile evlendi. Bursa'da ilmi ve manevi şahsiyetiyle büyük saygı gördü. Kaynaklarda farklı tarihler verilse de en kuvvetli ihtimale göre 1429 yılında vefat etti.","Bursa'da bugünkü türbesinin bulunduğu yere defnedildi. Türbe, adını taşıyan cami ile birlikte Yıldırım ilçesindedir. Bursa'nın en çok ziyaret edilen manevi mekânlarından biridir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Emîr Sultan\"","harita":"Emir Sultan Camii ve Türbesi Yıldırım Bursa"},{"il":"Bursa","ilce":"Osmangazi","ad":"Üftâde Türbesi","zat":"Üftâde (Mehmed Muhyiddin Üftâde)","donem":"yaklaşık 1495 – 1580","hayat":["Üftâde, Bursa'nın Araplar mahallesinde doğdu. Kaynaklar 1490 yılını verse de yaklaşık 1495 yılında doğduğu düşünülmektedir.","Celvetiyye tarikatının kurucusu kabul edilen Aziz Mahmud Hüdâyî'nin şeyhidir. Hüdâyî, ona 1577 yılında intisap etti ve hocasının sözlerini Vâkıât adlı eserde topladı. Üftâde'nin seyrüsülûk anlayışı Celvetî esaslara dayandığı için tarikatın pîri olarak da anılır. Hüdâyî, hocasından aldığı terbiyeyle daha sonra İstanbul'da Celvetiyye yolunu yaydı.","Üftâde, 1580 yılında Bursa'da vefat etti. Türbesi, adını taşıyan cami ve tekkenin yanındadır. Bursa'nın önemli manevi ziyaret yerlerindendir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Üftâde\"","harita":"Üftade Camii ve Türbesi Osmangazi Bursa"},{"il":"Bursa","ilce":"Osmangazi","ad":"Osman Gazi Türbesi","zat":"Osman Gazi","donem":"13. yüzyıl – 1324","hayat":["Osman Gazi, Ertuğrul Gazi'nin oğlu ve Osmanlı Devleti'nin kurucusudur. Şeyh Edebali'nin manevi rehberliğinde yetişti ve onun kızıyla evlendi. Söğüt ve Bilecik merkezli küçük bir beyliği büyük bir devletin temeline dönüştürdü.","Genel kabule göre 1324 yılında vefat etti. Oğlu Orhan Gazi'ye kendisini Bursa'ya defnetmesini vasiyet ettiği rivayet edilir. Bursa fethedildikten sonra naaşı buraya getirildi.","Türbesi, Bursa'da Tophane semtinde, oğlu Orhan Gazi'nin türbesinin yakınındadır. Bugünkü yapı, 19. yüzyılda yenilenmiştir. Bursa'nın en bilinen türbelerinden biridir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Osman Gazi Türbesi\" ve \"Osman Gazi\"","harita":"Osman Gazi Türbesi Tophane Osmangazi Bursa"},{"il":"Çanakkale","ilce":"Gelibolu","ad":"Yazıcıoğlu Kardeşlerin Türbeleri","zat":"Yazıcıoğlu Mehmed Efendi, Ahmed Bîcan","donem":"15. yüzyıl","hayat":["Yazıcıoğlu Mehmed Efendi ve kardeşi Ahmed Bîcan, Gelibolu'da yaşamış iki büyük âlim ve mutasavvıftır. Mehmed Efendi, Peygamber Efendimizin hayatını anlatan Muhammediye adlı manzum eseriyle tanınır. 1451 yılında vefat etti.","Ahmed Bîcan, Gelibolu'da doğdu ve eserlerinin çoğunu burada yazdı. Ağabeyinin Arapça eserini Envârü'l-Âşıkîn adıyla Türkçeye çevirdi. Bu eser asırlarca halk arasında okundu. 1466 yılında ya da bir süre sonra vefat etti. Çilehanesi Gelibolu'daki Hamzakoyu sahilindeydi.","İki kardeşin kabirleri, Gelibolu'da eski Yazıcıoğlu Mezarlığı'nın bulunduğu, bugün park olan alandadır. Ahmed Bîcan'ın kabri, ağabeyinin kabrinden yaklaşık yüz elli adım ileridedir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Ahmed Bîcan\"","harita":"Yazıcıoğlu Mehmed Efendi Türbesi Gelibolu Çanakkale"},{"il":"Çankırı","ilce":"Eldivan","ad":"Hacı Murad-ı Veli Türbesi","zat":"Hacı Murad-ı Veli","donem":"12. yüzyıl – 13. yüzyıl","hayat":["Hacı Murad-ı Veli, halk arasında Horasan erenlerinden biri olarak bilinen bir velîdir. Rivayete göre 12. yüzyılda Çankırı yöresine yerleşti ve 13. yüzyılın başlarında burada vefat etti.","Hayatına dair bilgiler büyük ölçüde halk rivayetlerine dayanır. Yöre halkı onu Anadolu'nun büyük velîleri arasında sayar ve derin bir saygıyla anar.","Türbesi, Eldivan ilçesine bağlı Seydi köyündedir. Türbe ile birlikte dergâh ve cami de yakın zamanda onarılmıştır. Çevresi, ziyaretçiler için düzenlenmektedir. Türbe, Çankırı'nın en çok ziyaret edilen manevi mekânlarındandır."],"kaynak":"Mynet (İhlas Haber Ajansı), \"Hacı Murad-ı Veli'nin türbesinin çevresi düzenlenecek\"; Kastamonu Üniversitesi, Hacı Murad Veli Türbesi bildirisi","harita":"Hacı Murat Veli Türbesi Seydi Köyü Eldivan Çankırı"},{"il":"Çankırı","ilce":"Merkez","ad":"Emir Karatekin Türbesi","zat":"Emir Karatekin Bey, eşi Meryem Hatun ve iki çocuğu","donem":"11. yüzyıl – 1106","hayat":["Emir Karatekin, Selçuklu döneminde Çankırı'yı fetheden komutandır. Kaynaklara göre Çankırı'yı 1074 yılında aldı. Ardından Kastamonu ve Sinop'u fethederek Batı Karadeniz'in Türk yurdu olmasında önemli rol oynadı.","1106 yılında vefat ettiği kabul edilir. Rivayete göre Çankırı'da vefat ettiği için buraya defnedilmiştir. Eşi Meryem Hatun ile iki çocuğu da aynı türbede yatmaktadır.","Türbe, tarihî Çankırı Kalesi'nin içindedir. Her yıl binlerce kişi tarafından ziyaret edilir. Ziyaretçiler burada Kur'an okuyup dua eder. Halk, onu Çankırı'nın fatihi olarak derin bir saygıyla anar."],"kaynak":"Habertürk (İhlas Haber Ajansı), \"Batı Karadeniz'in fatihi Emir Karatekin Bey'in kabrini her yıl binlerce kişi ziyaret ediyor\"","harita":"Emir Karatekin Türbesi Çankırı Kalesi Çankırı"},{"il":"Çorum","ilce":"Mecitözü","ad":"Elvan Çelebi Türbesi","zat":"Elvan Çelebi","donem":"14. yüzyıl","hayat":["Elvan Çelebi, 14. yüzyılda yaşamış mutasavvıf bir şairdir. Babası, tanınmış sûfî Âşık Paşa'dır. Babaî hareketinin önderi Baba İlyas-ı Horasânî'nin de torununun torunudur. Büyük ihtimalle Kırşehir'de doğdu.","Günümüze ulaşan tek eseri Menâkıbü'l-Kudsiyye adlı manzum menkıbenamedir. Bu eserde ailesinin hayatını anlatır. 1358 yılından birkaç yıl sonra vefat ettiği tahmin edilmektedir.","Elvan Çelebi, adını taşıyan köye yerleşti ve ömrünün sonuna kadar orada kaldı. Zaviyesi ve türbesi, Mecitözü ilçesine bağlı Elvançelebi köyündedir. Zaviye bugün köyün camii olarak kullanılır ve türbe ziyaret edilmeye devam eder."],"kaynak":"TDV İslâm Ansiklopedisi, \"Elvan Çelebi\" ve \"Elvan Çelebi Zâviyesi\"","harita":"Elvan Çelebi Türbesi Elvançelebi Mecitözü Çorum"},{"il":"Denizli","ilce":"Pamukkale","ad":"Teslim Abdal Türbesi","zat":"Teslim Abdal","donem":"17. yüzyıl","hayat":["Teslim Abdal, Bektaşî dervişlerinden biri olarak bilinen bir velîdir. Rivayete göre Sultan IV. Murad döneminde yaşadı ve Yeniçeri Ocağı'nın manevi babalarından sayıldı.","Halk arasında 1638 Bağdat Seferi'ne katıldığı anlatılır. Hayatına dair bilgilerin önemli kısmı rivayetlere dayanır ve kesin doğum ile vefat tarihleri bilinmemektedir.","Türbesi, Denizli'nin Pamukkale ilçesine bağlı Cankurtaran mahallesindedir ve Çukurköy Höyüğü üzerinde yer alır. Türbe, bir dönem bakımsız kaldıktan sonra temizlenerek yeniden ziyarete uygun hâle getirildi. Denizli ve çevresinden ziyaretçilerin uğrak yeridir."],"kaynak":"NTV, \"Teslim Abdal Sultan Türbesi tepkilerin ardından temizlendi\"","harita":"Teslim Abdal Türbesi Cankurtaran Pamukkale Denizli"},{"il":"Diyarbakır","ilce":"Sur","ad":"Hz. Süleyman Camii ve Sahabe Türbesi","zat":"Hz. Halid bin Velid'in oğlu Süleyman ve 27 şehit sahâbî","donem":"7. yüzyıl","hayat":["Hz. Süleyman Camii, Diyarbakır'ın Sur ilçesinde, İçkale'nin içindedir. Rivayete göre Hz. Ömer döneminde Diyarbakır'ın fethi buradan başlamıştır.","Caminin yanındaki türbede, Halid bin Velid'in oğlu Süleyman'ın ve fetih sırasında şehit düşen yirmi yedi sahâbînin yattığı kabul edilir. Bu sebeple mekân, halk arasında Yirmi Yedi Sahabe Türbesi diye de bilinir.","Minaredeki kitabelere göre cami, 1155 ile 1160 yılları arasında Nisanoğlu Ebu'l-Kasım tarafından yaptırılmıştır. Türbe, Diyarbakır'ın en çok ziyaret edilen manevi mekânıdır. Ziyaretçiler burada sahâbîler için Kur'an okuyup dua eder."],"kaynak":"İslam ve İhsan, \"Diyarbakır'daki 27 Sahabeye Büyük İlgi\"; Artuklu Üniversitesi, \"Kutsalın Mekâna Yansıması: Hz. Süleyman Camisi ve 27 Sahabe Türbesi Örneği\"","harita":"Hz. Süleyman Camii İçkale Sur Diyarbakır"},{"il":"Edirne","ilce":"Merkez","ad":"Hasan Sezâî Türbesi","zat":"Hasan Sezâî-yi Gülşenî","donem":"1669 – 1738","hayat":["Hasan Sezâî, 1669 yılında Mora yarımadasındaki Gördüs'te doğdu. Edirne'ye gelerek Gülşenî şeyhi Mehmed Sırrî Efendi'ye intisap etti. Onun vefatından sonra Lâlî Mehmed Fenâî Efendi'nin yanında yetişerek hilafet aldı.","Gülşenî tarikatının Sezâiyye kolunun kurucusudur. Aynı zamanda büyük bir şairdir. Divanı ve mektuplarından oluşan Mektûbât-ı Sezâî adlı eseri tanınır. Niyâzî-i Mısrî'nin bir gazeline de şerh yazdı.","1738 yılında Edirne'de vefat etti. Edirne'deki Gülşenî tekkesinin hazîresine defnedildi. Kabrinin üzerine daha sonra kubbeli bir türbe yapıldı. Tekke binası günümüze ulaşmamış olsa da türbe ayaktadır."],"kaynak":"TDV İslâm Ansiklopedisi, \"Sezâî-yi Gülşenî\"","harita":"Hasan Sezai Türbesi Edirne"},{"il":"Elazığ","ilce":"Merkez","ad":"Arap Baba Türbesi","zat":"Arap Baba","donem":"Selçuklu dönemi","hayat":["Arap Baba Türbesi, Elazığ şehir merkezine yaklaşık beş kilometre uzaklıktaki tarihî Harput'tadır. Selçuklu dönemine ait olduğu kabul edilen türbe, Arap Baba Mescidi'nin alt katında yer alır.","Arap Baba'nın kimliği ve hayatı hakkında kesin bilgi yoktur. Halk arasında mübarek bir zat olarak saygı görür. Menkıbeye göre Harput'ta uzun süren bir kuraklıktan sonra onun vesilesiyle yağmur yağmıştır.","Türbedeki ahşap sandukada bulunan naaşın, asırlar geçmesine rağmen bozulmadan kaldığına inanılır. Bu sebeple türbe, Harput'un en çok ziyaret edilen mekânlarından biridir."],"kaynak":"Küre Ansiklopedisi, \"Arap Baba Türbesi ve Efsanesi\"","harita":"Arap Baba Türbesi Harput Elazığ"},{"il":"Erzincan","ilce":"Merkez","ad":"Terzi Baba Türbesi","zat":"Terzi Baba (Mehmed Vehbi Efendi)","donem":"yaklaşık 1789 – 1848","hayat":["Terzi Baba'nın asıl adı Mehmed Vehbi'dir. Terzilik yaptığı ve uzun boylu olduğu için Terzi Ağa ve Uzun Terzi diye de anıldı. Elli dokuz yaşında vefat ettiği rivayetine göre 1789 yılı civarında doğduğu tahmin edilir.","Gençliğinde Kâdirî şeyhi Şirvanlızâde'ye bağlandı. Daha sonra Hâlid-i Bağdâdî'nin halifelerinden Abdullah Mekkî'den Nakşibendî-Hâlidî hilafeti aldı ve irşat ile meşgul oldu.","1848 yılında Erzincan'da çıkan kolera salgını sırasında vefat etti. İlk türbesi ahşaptı. Bu türbe yanınca 1980'li yıllarda Erzincan Belediyesi tarafından kesme taştan yeni bir türbe yapıldı. Türbe, Erzincan'ın en çok ziyaret edilen manevi mekânıdır."],"kaynak":"TDV İslâm Ansiklopedisi, \"Terzi Baba\"","harita":"Terzi Baba Türbesi Erzincan"},{"il":"Erzurum","ilce":"Palandöken","ad":"Abdurrahman Gazi Türbesi","zat":"Abdurrahman Gazi","donem":"7. yüzyıl (rivayete göre)","hayat":["Abdurrahman Gazi Türbesi, Erzurum'da Palandöken Dağı'nın eteğindedir. Halk arasındaki rivayete göre burada yatan zat, Peygamber Efendimizin sancaktarlığını yapmış bir sahâbîdir.","Bu rivayet tarihî kaynaklarla kesin olarak doğrulanamamaktadır ve kesin vefat tarihi bilinmemektedir. Ancak türbenin 16. yüzyıldan beri ziyaret edildiği bilinmektedir. Erzurum halkı, Abdurrahman Gazi'yi şehrin manevi koruyucularından biri olarak görür.","Türbe, Erzurum'un inanç turizmi merkezlerinin başında gelir. Özellikle bayramlarda ve kandil günlerinde çok sayıda ziyaretçi ağırlar. Türbede son yıllarda restorasyon çalışmaları yapılmaktadır."],"kaynak":"Mynet (İhlas Haber Ajansı), \"Ziyaretçilerin Abdurrahman Gazi'deki manevi yoğunluğu\"; Bengütürk, \"Erzurum'daki inanç turizmi merkezlerinden Abdurrahman Gazi Türbesi restore ediliyor\"","harita":"Abdurrahman Gazi Türbesi Palandöken Erzurum"},{"il":"Eskişehir","ilce":"Seyitgazi","ad":"Seyyid Battal Gazi Türbesi","zat":"Seyyid Battal Gazi","donem":"8. yüzyıl","hayat":["Battal Gazi, Emevîler döneminde Anadolu'da Bizans'a karşı savaşan bir İslam komutanıdır. Kaynakların çoğuna göre asıl adı Abdullah'tır. Battal ise kahramanlığı sebebiyle verilen bir lakaptır. Tarihî kişiliği zamanla menkıbelerle iç içe geçmiştir.","Kaynaklarda farklı tarihler verilse de 730'lu ya da 740'lı yıllarda, bugünkü Seyitgazi yakınlarında şehit düştüğü kabul edilir.","Menkıbeye göre kabri, Selçuklu Sultanı I. Alâeddin Keykubad'ın annesinin gördüğü bir rüya üzerine bulundu. Kabrin üzerine 13. yüzyılın başlarında türbe ve cami yapıldı. Zamanla büyük bir külliyeye dönüşen bu yapı, Seyitgazi ilçesinin de çekirdeğini oluşturdu."],"kaynak":"TDV İslâm Ansiklopedisi, \"Battal Gazi\"","harita":"Seyyid Battal Gazi Külliyesi Seyitgazi Eskişehir"},{"il":"Eskişehir","ilce":"Mihalıççık","ad":"Yunus Emre Türbesi","zat":"Yunus Emre","donem":"yaklaşık 1240 – 1320","hayat":["Yunus Emre, Türk tasavvuf edebiyatının en büyük şairlerindendir. Şeyhi Tapduk Emre'nin yanında yetişti. Sade ve içten Türkçesiyle yazdığı ilahiler, asırlardır dilden dile söylenir.","Beyazıt Kütüphanesi'ndeki bir kayda göre 1240 yılında doğdu ve 1320 yılında seksen iki yaşında vefat etti. Bu tarihler tartışmalı olup kesinlik taşımaz. Anadolu'nun pek çok yerinde ona atfedilen kabirler bulunur.","Araştırmacıların önemli bir kısmı, Sivrihisar yakınlarındaki Sarıköy'deki, bugünkü Yunusemre mahallesindeki kabri gerçek kabri kabul eder. Bu kabir 1946 yılında demir yolu yapımı sırasında açıldı. Bugünkü türbe 1970 yılında yapılmıştır."],"kaynak":"TDV İslâm Ansiklopedisi, \"Yûnus Emre\"","harita":"Yunus Emre Türbesi Yunusemre Mihalıççık Eskişehir"},{"il":"Gaziantep","ilce":"Nurdağı","ad":"Hz. Ukkâşe (Ökkeşiye) Makam Türbesi","zat":"Hz. Ukkâşe bin Mihsan (makam)","donem":"7. yüzyıl – 632","hayat":["Hz. Ukkâşe bin Mihsan, Peygamber Efendimizin sahâbîlerindendir. Bedir, Uhud ve Hendek başta olmak üzere önemli savaşların hepsinde bulundu. Peygamber Efendimiz, hesapsız cennete girecek yetmiş bin kişiden biri olması için onun adına dua etmiştir.","Hz. Ukkâşe, 632 yılında Necid bölgesindeki Büzâha'da keşif görevi sırasında şehit düştü ve orada defnedildi. Adı, Gaziantep ve Kahramanmaraş yöresinde Ökkeş şeklinde yaygınlaşmıştır.","Nurdağı'ndaki Ökkeşiye Türbesi ona atfedilir. Ancak gerçek kabri Necid'de olduğu için burası makam türbe kabul edilir. 2023 depremlerinde yıkılan türbe yeniden inşa edilmektedir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Ukkâşe b. Mihsan\"","harita":"Ökkeşiye Hazretleri Türbesi Nurdağı Gaziantep"},{"il":"Giresun","ilce":"Merkez","ad":"Seyyid Vakkas Türbesi","zat":"Seyyid Vakkas (rivayete göre)","donem":"Tarihi kesin değil","hayat":["Seyyid Vakkas, Giresun halkının yüzyıllardır saygıyla andığı bir şehittir. Menkıbeye göre başını düşmana teslim etmeyen bir kahraman olarak anlatılır. Bu rivayet, onun adını Giresun'da dilden dile dolaşan bir efsaneye dönüştürmüştür.","Türbe, şehir merkezinde bugün Kapu Camii olarak bilinen caminin yakınında bulunur. Bazı tarihçiler, burada yatan kişinin 17. yüzyılın başında Giresun'u yöneten ve bu camiyi yaptıran Seyyid Mehmed Paşa olabileceğini ileri sürer. Bu görüşe göre seyyid unvanı, zamanla Seyyid Vakkas efsanesiyle birleşmiştir.","Kimin yattığı tartışmalı olsa da türbe, Giresunlular için önemli bir manevi mekân olmayı sürdürmektedir."],"kaynak":"DergiPark, \"Mitler ve Gerçekler Arasında: Giresun'da Seyyid Vakkas Efsanesi ve Giresunlu Seyyid Mehmed Paşa\"","harita":"Seyyid Vakkas Türbesi Giresun"},{"il":"Hakkâri","ilce":"Şemdinli","ad":"Seyyid Tâhâ-yı Hakkârî Türbesi","zat":"Seyyid Tâhâ-yı Hakkârî","donem":"19. yüzyıl – 1853","hayat":["Seyyid Tâhâ-yı Hakkârî, Şemdinli'de doğdu ve bölgede seyyid olarak tanınan bir aileden geldi. Bağdat, Süleymaniye, Kerkük ve Erbil'de dinî ilimleri tahsil etti. Hilafetini, Hâlid-i Bağdâdî'nin halifesi olan amcası Seyyid Abdullah'tan aldı.","Nehri'de kırk iki yıl boyunca tekke ve medrese yönetti, pek çok talebe yetiştirdi. Halifeleri arasında kardeşi Muhammed Sâlih, Sıbgatullah Arvâsî ve Fehim Arvâsî bulunur. Sonraki dönemde Doğu Anadolu'daki pek çok Nakşibendî-Hâlidî silsilesi ona dayanır.","1853'te vefat etti ve Nehri'ye defnedildi. Türbesi, bölgenin en çok ziyaret edilen manevi mekânlarından biridir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Tâhâ-yı Hekkârî\"","harita":"Seyyid Taha Türbesi Nehri Şemdinli Hakkari"},{"il":"Hatay","ilce":"Antakya","ad":"Habîb-i Neccâr Türbesi","zat":"Habîb-i Neccâr (rivayete göre)","donem":"Tarihi kesin değil","hayat":["Habîb-i Neccâr, İslâm kaynaklarına göre Yâsîn sûresinde kıssası anlatılan mümin kişidir. Kur'an'da adı geçmez; rivayetlere göre şehrin uzak bir köşesinde yaşıyordu. Şehre gönderilen elçilere inandı, halkını da onlara uymaya çağırdı ve bu yüzden öldürüldü. Kur'an, onun cennete girdiğini haber verir.","Rivayete göre kıssanın geçtiği şehir Antakya'dır. Habîb-i Neccâr Dağı eteğindeki yapının altında bulunan kabirlerden birinin ona ait olduğu ileri sürülür. Yapı, Roma döneminde tapınak, Bizans döneminde kilise iken İslâm döneminde camiye dönüştürüldü.","Habîb-i Neccâr Camii, Anadolu'nun en eski camilerinden biri olarak bilinir. 2023 depremlerinde ağır hasar gördü."],"kaynak":"TDV İslâm Ansiklopedisi, \"Habîb en-Neccâr\"","harita":"Habib-i Neccar Camii Antakya Hatay"},{"il":"Isparta","ilce":"Merkez","ad":"İsmail Dede Türbesi","zat":"Şeyh İsmail Efendi","donem":"Vefatı yaklaşık 1617","hayat":["İsmail Dede Türbesi, Isparta merkeze bağlı Yakaören köyünde bulunur. Isparta'da velî kültü geleneği içinde yapılmış pek çok dede türbesinden biridir. Burada yatan Şeyh İsmail Efendi'nin mezar taşında 1617 yılına denk gelen bir tarih yer alır.","Türbenin kitabesi ve vakfiyesi bulunmadığı için yapım tarihi bilinmemektedir. Yapının 1960'lı yıllarda büyük ölçüde onarıldığı düşünülmektedir. Avlusunda, dedenin yardımcısına ait 1891 tarihli bir mezar taşı daha vardır.","Zamanla yıpranan türbe için il kültür ve turizm müdürlüğü ile birlikte restorasyon projeleri hazırlanmıştır. Amaç, yapıyı aslına yakın biçimde korumak ve ziyaretgâh işlevini sürdürmektir."],"kaynak":"Gökarslan ve Köse, \"Isparta-İsmail Dede Türbesi\", Alevilik-Bektaşilik Araştırmaları Dergisi, 2023","harita":"İsmail Dede Türbesi Yakaören Isparta"},{"il":"Mersin","ilce":"Tarsus","ad":"Dâniyâl Peygamber Makamı","zat":"Hz. Dâniyâl (rivayete göre)","donem":"Milattan önce 6. yüzyıl (kabul edilir)","hayat":["Hz. Dâniyâl, Kitâb-ı Mukaddes'e göre İsrâiloğulları peygamberlerinden biridir. Babil sürgünü döneminde yaşadığı kabul edilir. İslâm kaynaklarında da adı saygıyla anılır.","Tarsus'taki Makam-ı Şerif Camii'nin yanında bulunan kabrin ona ait olduğuna inanılır. Ancak bu bir rivayettir. Bazı İslâm kaynakları, onun naaşının Hz. Ömer döneminde İran'daki Sûs şehrinde bulunduğunu ve oraya defnedildiğini aktarır; bu rivayetler de kesin kabul edilmez.","Bu nedenle Tarsus'taki yer, halk arasında Dâniyâl Peygamber Makamı olarak bilinir. Makam, Tarsus'un en çok ziyaret edilen manevi mekânlarından biridir ve ziyaretçiler burada dua edip Kur'an okur."],"kaynak":"TDV İslâm Ansiklopedisi, \"Dânyâl\"","harita":"Danyal Peygamber Makamı Tarsus Mersin"},{"il":"İstanbul","ilce":"Eyüpsultan","ad":"Eyüp Sultan Türbesi","zat":"Hz. Ebû Eyyûb el-Ensârî","donem":"Vefatı yaklaşık 669","hayat":["Ebû Eyyûb el-Ensârî, Medineli sahâbîlerdendir. Peygamber Efendimiz Medine'ye hicret ettiğinde onu evinde misafir etme şerefine erişti. Bu yüzden Mihmandâr-ı Nebî unvanıyla da anılır.","İleri yaşına rağmen İstanbul üzerine yapılan ilk İslâm seferine katıldı. Kuşatma sırasında hastalandı ve en kuvvetli ihtimalle 669 yılında vefat etti. Vasiyeti üzerine surlara yakın bir yere defnedildi.","İstanbul'un fethinden sonra kabrinin yerini Akşemseddin'in manevi bir keşifle bulduğu rivayet edilir. Fatih Sultan Mehmed döneminde türbe ve cami yaptırıldı. Türbe, bugün İstanbul'un en çok ziyaret edilen manevi mekânlarının başında gelir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Ebû Eyyûb el-Ensârî\"","harita":"Eyüp Sultan Türbesi Eyüpsultan İstanbul"},{"il":"İstanbul","ilce":"Üsküdar","ad":"Aziz Mahmud Hüdâyî Türbesi","zat":"Aziz Mahmud Hüdâyî","donem":"1541 – 1628","hayat":["Aziz Mahmud Hüdâyî, 1541'de Şereflikoçhisar'da doğdu. Çocukluğu Sivrihisar'da geçti ve ilk eğitimini orada aldı. Medrese tahsilinden sonra kadılık yaptı; Bursa'da görevliyken Üftâde'ye intisap ederek tasavvuf yoluna girdi.","Celvetiyye tarikatının kurucusudur. İstanbul'da geniş bir çevreye irşat faaliyetinde bulundu ve döneminin padişahlarının saygısını kazandı. 1628'de vefat etti ve Üsküdar'daki dergâhının içindeki türbesine defnedildi.","On üç köşeli kubbesiyle dikkat çeken türbe, 1850'deki yangından sonra Sultan Abdülmecid döneminde yeniden yaptırıldı. İstanbul'un en çok ziyaret edilen türbelerinden biridir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Azîz Mahmud Hüdâyî\"","harita":"Aziz Mahmud Hüdayi Türbesi Üsküdar İstanbul"},{"il":"İstanbul","ilce":"Beşiktaş","ad":"Yahyâ Efendi Türbesi","zat":"Beşiktaşlı Yahyâ Efendi","donem":"15. yüzyıl sonu – 1571","hayat":["Beşiktaşlı Yahyâ Efendi, müderris, şair ve mutasavvıftır. Trabzon'da doğdu ve Kanûnî Sultan Süleyman'ın süt kardeşi olarak bilinir. İlim tahsilini tamamladıktan sonra bir süre müderrislik yaptı.","Daha sonra Beşiktaş'ta, Boğaz'a bakan bir yamaçta dergâhını kurdu ve ömrünün sonuna kadar burada irşatla meşgul oldu. 1571'de vefat etti ve kurduğu külliyenin içindeki türbeye defnedildi.","Yahyâ Efendi Türbesi, çevresindeki hazireyle birlikte İstanbul'un en çok ziyaret edilen türbelerinden biridir. Hazirede pek çok âlim ve devlet adamı da medfundur."],"kaynak":"TDV İslâm Ansiklopedisi, \"Yahyâ Efendi, Beşiktaşlı\" ve \"Yahyâ Efendi Külliyesi\"","harita":"Yahya Efendi Türbesi Beşiktaş İstanbul"},{"il":"İzmir","ilce":"Ödemiş","ad":"İmam Birgivî Türbesi","zat":"Birgivî Mehmed Efendi","donem":"1523 – 1573","hayat":["Birgivî Mehmed Efendi, 1523'te Balıkesir'de doğdu. Babası Pîr Ali de bir âlim ve müderristi. Tahsilini tamamladıktan sonra Birgi'deki medresede ders vermeye başladı ve Birgivî nisbesiyle tanındı.","Arapça dil bilgisi üzerine yazdığı el-Avâmil ve İzhârü'l-esrâr, Osmanlı medreselerinde yüzyıllarca okutuldu. Halk için yazdığı Vasiyetnâme, Birgivî Risâlesi adıyla yaygınlaştı. et-Tarîkatü'l-Muhammediyye ise en tanınmış eseridir. Rüşveti ve liyakatsiz atamaları cesurca eleştirdi.","1573'te İstanbul'da vebadan vefat etti. Naaşı Birgi'ye getirilerek defnedildi. Türbesi, Birgi'nin tarihî dokusu içinde ziyaretçilerini ağırlar."],"kaynak":"TDV İslâm Ansiklopedisi, \"Birgivî\"; İzmir İl Kültür ve Turizm Müdürlüğü","harita":"İmam Birgivi Türbesi Birgi Ödemiş İzmir"},{"il":"Kars","ilce":"Merkez","ad":"Ebü'l-Hasan Harakānî Türbesi (makam türbe)","zat":"Ebü'l-Hasan Harakānî","donem":"yaklaşık 963 – 1033","hayat":["Ebü'l-Hasan Harakānî, İran'da Bistâm yakınlarındaki Harakān köyünde çiftçi bir ailede doğdu. Şathiyeleriyle tanınan büyük bir mutasavvıftır. 1033'te vefat etti.","Eski kaynakların çoğu kabrinin Harakān'da ya da Bistâm'da olduğunu bildirir. Evliya Çelebi'nin anlattığına göre Kars Kalesi onarılırken bir işçinin gördüğü rüya üzerine, üzerinde onun adı yazılı bir mermer levha bulundu ve kabir ortaya çıktı. Lala Mustafa Paşa da onun adına bir tekke ve cami yaptırdı.","Bu nedenle Kars'taki türbe, makam türbe olarak kabul edilir. Halk arasında onun Kars'ın fethine katılıp burada şehit düştüğüne dair bir inanış da yaygındır."],"kaynak":"TDV İslâm Ansiklopedisi, \"Harakānî\"","harita":"Ebul Hasan Harakani Türbesi Kars"},{"il":"Kastamonu","ilce":"Merkez","ad":"Şeyh Şaban-ı Velî Türbesi","zat":"Şaban-ı Velî","donem":"15. yüzyıl sonu – 1569","hayat":["Şaban-ı Velî, Kastamonu'nun Taşköprü ilçesinde doğdu; doğum yılı kesin olarak bilinmemektedir. Küçük yaşta anne ve babasını kaybetti ve bir hanımın himayesinde büyüdü.","Halvetiyye tarikatının Şâbâniyye kolunun kurucusudur ve Anadolu'nun dört kutbundan biri olarak kabul edilir. Kastamonu'daki tekkesinde uzun yıllar irşat faaliyetinde bulundu. 1569'da vefat etti ve tekkesinin bahçesine defnedildi.","Türbesi, Sultan I. Ahmed'in oğlu Şehzade Osman'ın himayesinde yapılmaya başlandı ve 1611'de tamamlandı. Türbenin yakınındaki Asâ suyu, halk arasında zemzem olarak kabul edilir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Şâban-ı Velî\"","harita":"Şeyh Şaban-ı Veli Türbesi Kastamonu"},{"il":"Kayseri","ilce":"Melikgazi","ad":"Seyyid Burhâneddin Türbesi","zat":"Seyyid Burhâneddin Muhakkık-ı Tirmizî","donem":"Vefatı 1240'lı yıllar","hayat":["Seyyid Burhâneddin Muhakkık-ı Tirmizî, Mevlânâ Celâleddîn-i Rûmî'nin hocasıdır. Mevlânâ'nın babası Bahâeddin Veled'in müritlerindendi. Onun vefatından sonra Konya'ya gelerek genç Mevlânâ'nın manevi eğitimini üstlendi. Mevlânâ'yı yaklaşık dokuz yıl boyunca yetiştirdiği kabul edilir.","Ömrünün son yıllarını Kayseri'de geçirdi ve 1240'lı yıllarda burada vefat etti. Kabri, şehir merkezinde Talas Caddesi üzerindeki Seyyid Burhâneddin Mezarlığı'nda bulunur.","Bugünkü türbe, 1892 yılında kabrin üzerine yapıldı. Türbede, 1414'te vefat eden Seyyid Zeynelâbidin'in kabri de vardır. Kayseri'nin en çok ziyaret edilen manevi mekânlarından biridir."],"kaynak":"TDV İslâm Ansiklopedisi; Küre Ansiklopedi, \"Seyyid Burhaneddin Türbesi\"","harita":"Seyyid Burhaneddin Türbesi Kayseri"},{"il":"Kırşehir","ilce":"Merkez","ad":"Ahi Evran Türbesi","zat":"Ahi Evran (Şeyh Nasîrüddin Mahmûd)","donem":"13. yüzyıl","hayat":["Ahi Evran, asıl adıyla Şeyh Nasîrüddin Mahmûd, Anadolu'daki Ahilik teşkilatının piri olarak kabul edilir. Hayatı hakkındaki bilgiler azdır ve menkıbelerle iç içe geçmiştir. Mevlânâ ve Hacı Bektâş-ı Velî ile çağdaş olduğu rivayet edilir; vefat tarihi tartışmalıdır.","Kırşehir'e yerleşti ve ömrünün sonuna kadar burada yaşadı. Onun adıyla anılan Ahi Evran Zâviyesi, esnaf ve zanaatkârların manevi merkezi oldu. Zâviyenin şeyhleri Ahi Baba unvanını taşıdı.","Ahi Evran Camii ve Türbesi, Kırşehir şehir merkezinde bulunur. Türbe bugün de esnaf ve ziyaretçiler tarafından saygıyla ziyaret edilmektedir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Ahî Evran\"","harita":"Ahi Evran Camii ve Türbesi Kırşehir"},{"il":"Kırşehir","ilce":"Merkez","ad":"Âşık Paşa Türbesi","zat":"Âşık Paşa","donem":"1272 – 1332","hayat":["Âşık Paşa, 1272'de Kırşehir'de doğdu. Babası Muhlis Paşa, dedesi ise Baba İlyas'tır. Vefâiyye tarikatının önde gelen isimlerinden biri olarak tanınır.","En önemli eseri, 1330'da tamamladığı yaklaşık on iki bin beyitlik Garibnâme'dir. Bu mesnevi, Anadolu Türk tasavvuf edebiyatının en eski ve en yaygın eserlerinden biridir. Oğlu Elvan Çelebi de babasının hayatını Menâkıbü'l-kudsiyye adlı eserinde anlatmıştır.","1332'de Mısır'dan dönerken Kırşehir'de hastalandı ve burada vefat etti. Vasiyeti üzerine şehrin kuzeydoğusundaki bir tepede yaptırılan kitabeli türbesine defnedildi."],"kaynak":"TDV İslâm Ansiklopedisi, \"Âşık Paşa\"","harita":"Aşık Paşa Türbesi Kırşehir"},{"il":"Kocaeli","ilce":"Kandıra","ad":"Akçakoca Bey Türbesi (Anıt Mezarı)","zat":"Akçakoca Bey","donem":"Vefatı 1328","hayat":["Akçakoca Bey, Osmanlı Devleti'nin kuruluş döneminde Osman Gazi ve Orhan Gazi'nin silah arkadaşı olan bir gazidir. Karasu'dan Karadeniz Ereğlisi'ne uzanan bölgenin fethinde önemli rol oynadı. Kandıra ve çevresini Osmanlı topraklarına kattığı için Kandıra Fatihi olarak anılır.","1328'de İzmit seferine hazırlanırken vefat etti. Vasiyeti üzerine, çadırının kurulu olduğu Babatepe'ye defnedildi. Kocaeli adının onun adından geldiği kabul edilir.","Kabrin üzerindeki ahşap türbe ve cami zamanla yıkıldı. Bugünkü anıt mezar 1974'te açıldı. 2015'teki düzenlemede ahşap cami de aslına uygun biçimde yeniden yapıldı."],"kaynak":"Küre Ansiklopedi, \"Akçakoca Bey Anıt Mezarı\"; MEB EBA Okul Dışı Öğrenme","harita":"Akçakoca Bey Anıt Mezarı Babatepe Kandıra Kocaeli"},{"il":"Konya","ilce":"Karatay","ad":"Mevlânâ Türbesi","zat":"Mevlânâ Celâleddîn-i Rûmî","donem":"1207 – 1273","hayat":["Mevlânâ Celâleddîn-i Rûmî, 1207'de Horasan bölgesindeki Belh şehrinde doğduğu kabul edilir. Babası Bahâeddin Veled ile birlikte uzun bir yolculuğun ardından Konya'ya yerleşti. Babasının vefatından sonra müderrislik yaptı.","Şems-i Tebrîzî ile karşılaşması hayatında derin bir dönüm noktası oldu. Mesnevî ve Dîvân-ı Kebîr başta olmak üzere, sevgiyi ve hoşgörüyü merkeze alan eserleriyle bütün dünyada tanındı. 1273'te Konya'da vefat etti.","Kabri üzerinde yükselen ve Yeşil Kubbe olarak bilinen türbe, bugün Mevlânâ Müzesi olarak hizmet verir. Türkiye'nin en çok ziyaret edilen manevi mekânlarından biridir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Mevlânâ Celâleddîn-i Rûmî\"; Kültür ve Turizm Bakanlığı","harita":"Mevlana Müzesi Konya"},{"il":"Konya","ilce":"Meram","ad":"Sadreddin Konevî Türbesi","zat":"Sadreddin Konevî","donem":"yaklaşık 1209 – 1274","hayat":["Sadreddin Konevî, yaklaşık 1209'da Malatya'da doğdu. Babası Mecdüddin İshak, Anadolu Selçuklu Devleti'nde âlim, mutasavvıf ve devlet adamıydı. Muhyiddin İbnü'l-Arabî'yi hocası olarak gördü ve onun yanında yetişti.","Yaklaşık 1241'de Konya'ya yerleşti ve ömrünün sonuna kadar burada kaldı. İbnü'l-Arabî'den sonra vahdet-i vücûd düşüncesinin en önemli temsilcisi kabul edilir. Miftâhu'l-gayb başta olmak üzere pek çok eser yazdı. Mevlânâ ile yakın dostluğu olduğu bilinir.","1274'te Konya'da vefat etti. Kabri, Meram'daki Şeyh Sadrettin Mahallesi'nde, Sadreddin Konevî Camii'nin yanındadır."],"kaynak":"TDV İslâm Ansiklopedisi, \"Sadreddin Konevî\"","harita":"Sadreddin Konevi Camii ve Türbesi Meram Konya"},{"il":"Kütahya","ilce":"Merkez","ad":"Ergun Çelebi Türbesi (Kütahya Mevlevîhânesi)","zat":"Celâleddin Ergun Çelebi ve Mevlevî postnişinleri","donem":"Vefatı 1373","hayat":["Celâleddin Ergun Çelebi, Kütahya Mevlevîhânesi'nin kurucusu ve ilk postnişinidir. Bu nedenle dergâh, Erguniyye Dergâhı olarak da bilinir. 1373'te vefat etti.","Rivayete göre dergâhın çekirdeğini, 13. yüzyılda yapılan Hezâr Dînârî Mescidi oluşturur. Ergun Çelebi ve sonraki postnişinler buraya defnedilince yapı türbeye dönüştü, kuzeyine de bir semâhâne eklendi. Kütahya Mevlevîhânesi, Konya ve Afyonkarahisar'dan sonra üçüncü büyük mevlevîhâne olarak kabul edilir.","Türbede Ergun Çelebi'nin yanı sıra oğlu Burhâneddin İlyas ve başka çelebiler de yatmaktadır. Semâhâne bugün Dönenler Camii olarak kullanılmaktadır."],"kaynak":"TDV İslâm Ansiklopedisi, \"Kütahya Mevlevîhânesi\"","harita":"Kütahya Mevlevihanesi Dönenler Camii Kütahya"},{"il":"Malatya","ilce":"Darende","ad":"Somuncu Baba Türbesi","zat":"Şeyh Hamîdüddin (Somuncu Baba), Halil Taybî","donem":"Vefatı 1412","hayat":["Somuncu Baba, asıl adıyla Şeyh Hamîdüddin, Hamîd-i Velî olarak da tanınır. Birçok kaynak onu Kayserili olarak anar; bazı kaynaklar ise Aksaraylı olduğunu yazar. Bursa sokaklarında ekmek pişirip dağıttığı için Somuncu Baba lakabıyla anıldığı rivayet edilir.","Hacı Bayrâm-ı Velî ve Molla Fenârî gibi büyük isimler onun talebeleri arasında yer alır. 1412'de vefat etti.","Darende'deki türbesi, oğlu Halil Taybî'nin kabriyle birlikte Tohma Çayı kenarındaki külliyede bulunur ve her yıl çok sayıda ziyaretçi ağırlar. Bazı kaynaklar ise kabrinin Aksaray'da olduğunu kaydeder; Aksaray'da da onun adına bir türbe vardır."],"kaynak":"TDV İslâm Ansiklopedisi, \"Somuncu Baba\"","harita":"Somuncu Baba Türbesi Darende Malatya"},{"il":"Manisa","ilce":"Akhisar","ad":"Şeyh İsa Türbesi","zat":"Şeyh Mecdüddin İsa","donem":"yaklaşık 1447 – 1531","hayat":["Şeyh İsa, asıl adıyla Mecdüddin İsa, Hacı Bayrâm-ı Velî'nin yolunu takip eden Bayramî şeyhlerindendir. Fatih Sultan Mehmed'den Kanûnî Sultan Süleyman'a uzanan dönemde yaşadı. Doğum yılının 1447 civarı olduğu tahmin edilir.","Ömrünün büyük bölümünü Akhisar'da geçirdi; Bursa, Sivas, Bağdat ve Şam gibi şehirlere de irşat ve öğretim için gitti. Müritlerine ilimle birlikte bir zanaat öğrenmelerini ve kimseye muhtaç olmamalarını tavsiye ederdi. 1531'de vefat ettiği kaydedilir.","Türbesi, Akhisar'da onun adını taşıyan Şeyh İsa Mahallesi'nde, Şeyh İsa Camii'nin yanında bulunur. Hayatını oğlu İlyas kaleme almıştır."],"kaynak":"Mehmet Demirci, \"Akhisarlı Şeyh İsa\", Yeni Asır, 2016","harita":"Şeyh İsa Camii Akhisar Manisa"},{"il":"Kahramanmaraş","ilce":"Afşin","ad":"Ashâb-ı Kehf Külliyesi (makam)","zat":"Ashâb-ı Kehf (rivayete göre)","donem":"Rivayete göre 3. yüzyıl","hayat":["Ashâb-ı Kehf, Kur'an-ı Kerim'in Kehf sûresinde kıssası anlatılan, inançlarını korumak için bir mağaraya sığınan gençlerdir. Rivayete göre putperest bir hükümdarın zulmünden kaçan bu gençler, köpekleriyle birlikte mağarada uzun yıllar uyumuştur. Kıssa, Hristiyan geleneğinde de Yedi Uyurlar olarak bilinir.","Afşin ilçe merkezinin yaklaşık yedi kilometre kuzeybatısındaki mağaranın, kıssada anlatılan mağara olduğuna inanılır. Ancak bu bir rivayettir; başka yerler de aynı kıssayla anılır. Burası bir türbe değil, mağara etrafında oluşmuş bir ziyaretgâhtır.","Mağaranın çevresine Anadolu Selçukluları döneminde cami, ribat ve han yapıldı. Daha sonra Dulkadiroğulları ve Osmanlılar döneminde medrese ve başka yapılar eklendi."],"kaynak":"Küre Ansiklopedi, \"Eshâb-ı Kehf Külliyesi\"; Kültür ve Turizm Bakanlığı","harita":"Eshab-ı Kehf Külliyesi Afşin Kahramanmaraş"},{"il":"Mardin","ilce":"Nusaybin","ad":"Zeynelâbidin Türbesi","zat":"Molla Zeynelâbidin, Sitti Zeynep","donem":"Tarihi kesin değil","hayat":["Zeynelâbidin Türbesi, Nusaybin'de aynı adı taşıyan caminin içinde bulunur. Burada, Hz. Hüseyin'in on üçüncü kuşaktan torunu olarak kabul edilen Molla Zeynelâbidin yatmaktadır. Hemen yanındaki türbede ise kız kardeşi Sitti Zeynep medfundur.","Kitabelere göre yapı, Artuklular döneminde 12. yüzyılda inşa edildi. Sitti Zeynep türbesinin cephesinde 1821 tarihli bir onarım kitabesi bulunur. Külliye; cami, minare, iki türbe, şadırvan, medrese odaları ve hazireden oluşur.","Kubbeli iki türbe, Ehl-i Beyt'e duyulan sevgi nedeniyle bölge halkı için büyük manevi değer taşır ve yıl boyunca ziyaret edilir."],"kaynak":"Mardin İl Kültür ve Turizm Müdürlüğü, \"Zeynel Abidin Cami ve Türbesi\"","harita":"Zeynel Abidin Camii ve Türbesi Nusaybin Mardin"},{"il":"Muş","ilce":"Merkez","ad":"Abdülvahap Gazi Türbesi","zat":"Abdülvahap Gazi, Şeyh Şeref, Hacı Tayyip Efendi","donem":"Rivayete göre vefatı 731","hayat":["Abdülvahap Gazi'nin, Emevîler döneminde Anadolu seferlerine katılmış bir gazi olduğu rivayet edilir. Doğum tarihi bilinmemektedir. Rivayete göre 731 yılında şehit düşmüştür.","Türbe, Muş şehir merkezine yedi ile sekiz kilometre uzaklıktaki Çatbaşı köyündedir. Dikdörtgen planlı ve beşik tonozlu yapının içinde üç kabir bulunur. Bunlar Abdülvahap Gazi, Silvanlı Şeyh Şeref ve Muşlu âlim Hacı Tayyip Efendi'ye aittir.","Türbenin doğusunda, ziyaretçilerin ibadet ve konaklaması için yapıldığı düşünülen eski bir cami vardır. Cami ile türbe, ahşap direkli ve üstü kapalı bir geçitle birbirine bağlanır."],"kaynak":"İhlas Haber Ajansı, \"Abdulvahap Gazi Türbesi\", 2026","harita":"Abdulvahap Gazi Türbesi Çatbaşı Muş"},{"il":"Nevşehir","ilce":"Hacıbektaş","ad":"Hacı Bektâş-ı Velî Türbesi","zat":"Hacı Bektâş-ı Velî","donem":"13. yüzyıl – yaklaşık 1271","hayat":["Hacı Bektâş-ı Velî, Horasan erenlerinden olup 13. yüzyılda Moğol istilası sonrasındaki göçler sırasında Anadolu'ya geldiği kabul edilir. Muhtemelen bir Türkmen topluluğuyla gelerek Sulucakarahöyük'e, yani bugünkü Hacıbektaş'a yerleşti.","Burada kurduğu dergâhta halkı irşat etti. Vefat tarihi kesin değildir; genellikle 1271 civarı kabul edilir. Hayatı ve menkıbeleri, Vilâyetnâme adlı eserde anlatılır.","Türbesi ve çevresinde gelişen külliye, Hacıbektaş ilçesindedir. Bugün Hacıbektaş Veli Müzesi olarak hizmet veren külliye, Türkiye'nin önemli inanç merkezlerinden biridir ve her yıl çok sayıda ziyaretçi ağırlar."],"kaynak":"TDV İslâm Ansiklopedisi, \"Hacı Bektâş-ı Velî\"","harita":"Hacı Bektaş Veli Müzesi Hacıbektaş Nevşehir"},{"il":"Niğde","ilce":"Merkez","ad":"Hüdâvend Hatun Kümbeti","zat":"Hüdâvend Hatun","donem":"Vefatı 1332","hayat":["Hüdâvend Hatun, Anadolu Selçuklu sultanlarından Kılıçarslan'ın kızıdır. Kendi adını taşıyan kümbeti, kitabesine göre 1312 yılında yaptırdı. 1332'de vefat ettiği ve bu kümbete defnedildiği kabul edilir.","Kümbet, Niğde şehir merkezindedir ve İlhanlı dönemi Anadolu mimarisinin en güzel örneklerinden biri sayılır. Sekizgen gövdesi yukarıda on altı köşeye dönüşür. Dış yüzeyi, zengin taş süslemeleri ve figürlü kabartmalarıyla dikkat çeker.","Kümbette Hüdâvend Hatun ile birlikte başka kabirler de bulunur. Niğde'nin en bilinen türbesi olan yapı, şehrin simgelerinden biridir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Niğde\" ve \"Hudâvend Hatun Türbesi\"","harita":"Hüdavend Hatun Kümbeti Niğde"},{"il":"Ordu","ilce":"Ünye","ad":"Yunus Emre Makamı","zat":"Yunus Emre (makam)","donem":"13. yüzyıl – 14. yüzyıl","hayat":["Yunus Emre, 13. ve 14. yüzyıllarda yaşamış, sade Türkçesiyle ilahi aşkı ve insan sevgisini dile getiren büyük bir mutasavvıf şairdir. Şiirleri yüzyıllardır dilden dile dolaşır.","Anadolu'nun birçok yerinde Yunus Emre'ye atfedilen kabir ve makamlar bulunur. Bunlardan biri de Ünye'dedir. Gerçek kabrinin yeri kesin olarak bilinmediği için Ünye'deki yer, makam olarak kabul edilir. Bazı araştırmacılar, burada yatan kişinin aynı adı taşıyan başka bir şeyh olabileceğini ileri sürer.","Ünye'deki Yunus Emre Külliyesi, anma programlarına ve sempozyumlara ev sahipliği yapar."],"kaynak":"Haberler.com, \"Yunus Emre Ünye'de Anıldı\", 2016; M. Güneş, \"Ünye'de Şeyh Yunus Emre Türbesi\", Söğüt, 2021","harita":"Yunus Emre Türbesi Ünye Ordu"},{"il":"Sakarya","ilce":"Pamukova","ad":"Karaca Ahmed Türbesi","zat":"Karaca Ahmed","donem":"14. yüzyıl","hayat":["Karaca Ahmed, Orhan Gazi döneminde yaşamış, Abdalân-ı Rûm denilen Türkmen dervişlerindendir. Hastalara, özellikle ruh hastalarına şifa dağıttığına inanılan bir velî olarak tanınır. 14. yüzyılın son çeyreğinde vefat ettiği tahmin edilir.","Geyve Akhisarı'nın fethine katıldı ve bu bölgeye yerleşti. Pamukova'nın Paşalar köyü civarında bir zaviye kurarak pek çok derviş yetiştirdi.","Pamukova'daki türbe yaklaşık 700 yıllık geçmişe sahiptir ve yakın zamanda restore edilmiştir. Anadolu'nun pek çok yerinde, İstanbul Üsküdar da dahil olmak üzere, ona atfedilen türbe ve makamlar vardır; bunlardan hangisinin gerçek kabri olduğu kesin değildir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Karaca Ahmed\"; Sakarya Büyükşehir Belediyesi Turizm Broşürü","harita":"Karaca Ahmet Türbesi Pamukova Sakarya"},{"il":"Samsun","ilce":"İlkadım","ad":"Seyyid Kutbiddin Camii ve Türbesi","zat":"Seyyid Kutbiddin","donem":"13. yüzyıl","hayat":["Seyyid Kutbiddin, Samsun'un en eski ziyaretgâhlarından birinde yatan bir zattır. Kimliği kesin olarak bilinmemektedir. Rivayete göre Abdülkādir-i Geylânî'nin torunudur ve bölgede İslâm'ın yayılmasına hizmet etmiştir.","Türbe, Kökçüoğlu Mahallesi'ndeki eski mezarlığın içinde, adını taşıyan caminin güney duvarına bitişiktir. Caminin giriş kitabesinde 1292 yılı, türbedeki Arapça kitabede ise sonraki bir onarıma ait 1404 yılı yazılıdır. Çevresindeki mezarlık, Selçuklu ve Osmanlı mezar taşlarıyla şehrin en eski kabristanlarından biridir.","Halk arasında anlatılan bir rivayete göre, 1853 yılında Rus gemileri Samsun'u bombaladığında bu mezarlıktan açılan ateş gemileri geri çekilmeye zorlamıştır."],"kaynak":"Samsun İl Kültür ve Turizm Müdürlüğü, \"Seyyid Kutbiddin Cami ve Türbesi\"","harita":"Seyyid Kutbiddin Camii ve Türbesi İlkadım Samsun"},{"il":"Siirt","ilce":"Aydınlar","ad":"İsmâil Fakîrullah Türbesi","zat":"İsmâil Fakîrullah","donem":"1657 – 1734","hayat":["İsmâil Fakîrullah, 1657 yılında Siirt'in Aydınlar ilçesine bağlı Tillo'da doğdu. İlk eğitimini babası Molla Kasım ve dedesinden aldı. İlim ve tasavvufta yetişerek bölgenin en tanınmış mürşitlerinden biri oldu.","Mârifetnâme yazarı Erzurumlu İbrâhim Hakkı, onun müridi ve halifesidir. İsmâil Fakîrullah 1734 yılında Tillo'da vefat etti. Kabri üzerine yaptırılan türbe, bugün de bölge halkı ve uzaktan gelenler tarafından sürekli ziyaret edilir.","Türbe, ışık düzeneğiyle ünlüdür. 21 Mart ve 23 Eylül günlerinde güneş ışığı küçük bir pencereden girip kubbedeki bir düzenekle sandukanın baş kısmını aydınlatırdı. Kaynaklar, bu sistemin bugün bozulmuş olduğunu belirtir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Fakîrullah\"","harita":"İsmail Fakirullah Türbesi Aydınlar Siirt"},{"il":"Siirt","ilce":"Baykan","ad":"Veysel Karanî Makamı ve Külliyesi","zat":"Veysel Karanî","donem":"? – 657","hayat":["Veysel Karanî, Yemenli bir tâbiîdir. Peygamber Efendimiz'i görmeden ona derin bir sevgiyle bağlanmış, annesine hizmeti ve zühdüyle tanınmıştır. Genel kabule göre 657 yılında Hz. Ali'nin safında Sıffîn Savaşı'na katılmış ve şehit olmuştur.","Gömüldüğü yer kesin olarak bilinmemektedir. Yemen, İran, Suriye ve Anadolu'nun pek çok yerinde ona nispet edilen makamlar vardır. Savaşın Rakka yakınlarında yapıldığı düşünülürse, asıl kabrinin orada olması daha kuvvetli bir ihtimaldir.","Siirt'in Baykan ilçesindeki cami ve türbeden oluşan külliye, Anadolu'daki en meşhur Veysel Karanî makamlarından biridir. Burası bir makam türbedir ve her yıl çok sayıda ziyaretçiyi ağırlar."],"kaynak":"TDV İslâm Ansiklopedisi, \"Veysel Karanî\"","harita":"Veysel Karani Türbesi Baykan Siirt"},{"il":"Sinop","ilce":"Merkez","ad":"Seyyid Bilal Türbesi","zat":"Seyyid Bilal","donem":"Dönemi kesin bilinmiyor","hayat":["Seyyid Bilal, Sinop'un en çok ziyaret edilen türbesinde yatan zattır. Resmî tanıtımlarda Seyyid İbrahim Bilal adıyla da anılır. Hayatı ve yaşadığı dönem hakkında kesin bilgi azdır. Taşıdığı \"seyyid\" unvanı, halk arasında Ehl-i Beyt soyundan geldiğine inanıldığını gösterir.","Türbe, şehir merkezinde, geniş bir hazîrenin içindedir. Bu hazîredeki eski mezar taşları, akademik çalışmalara konu olacak kadar önemlidir.","Kültür ve Turizm Bakanlığı, Seyyid Bilal Türbesi'ni şehrin en önemli inanç turizmi merkezi olarak tanıtır. Sinop'a gelen ziyaretçilerin önemli bir kısmı, şehir gezisine bu türbeyi ziyaret ederek başlar."],"kaynak":"Sinop İl Kültür ve Turizm Müdürlüğü tanıtım broşürü; Ondokuz Mayıs Üniversitesi, \"Sinop Seyyid Bilal Türbesi Haziresi'ndeki Mezar Taşları\"","harita":"Seyyid Bilal Türbesi Sinop"},{"il":"Sivas","ilce":"Merkez","ad":"Şemseddin Sivâsî Türbesi","zat":"Şemseddin Sivâsî","donem":"1520 – 1597","hayat":["Şemseddin Sivâsî, 1520 yılında Tokat'ın Zile ilçesinde doğdu. İstanbul'da tahsil gördü, ardından Abdülmecîd Şirvânî'ye intisap ederek Halvetî yolunda yetişti. Halvetiyye'nin Şemsiyye kolunun kurucusudur. Şiirlerinde \"Şemsî\" mahlasını kullandı.","Sivas valisi Hasan Paşa'nın daveti üzerine ailesi ve talebeleriyle Sivas'a geldi. Meydan Camii'nde vaaz verdi ve burada bir tekke açtı. Mevlid, Gülşen-âbâd ve Menâkıb-ı Çehâr Yâr-ı Güzîn gibi pek çok eser yazdı.","1597 yılında Sivas'ta vefat etti ve Meydan Camii'nin hazîresine defnedildi. Türbesi vefatından üç yıl sonra yaptırıldı ve bugün şehrin en önemli ziyaretgâhlarından biridir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Şemseddin Sivâsî\"; TDV İslâm Ansiklopedisi, \"Sivas\"","harita":"Şemsi Sivasi Türbesi Meydan Camii Sivas"},{"il":"Sivas","ilce":"Merkez","ad":"Abdülvehhâb Gazi Türbesi","zat":"Abdülvehhâb Gazi","donem":"? – 731","hayat":["Abdülvehhâb Gazi, Emevî Halifesi Hişâm bin Abdülmelik döneminde Anadolu'ya yapılan seferlere katılan bir Arap komutandır. Kaynaklara göre Sivas ve çevresini ele geçirdi.","Bizanslılar ertesi yıl şehri geri aldı. Abdülvehhâb Gazi bu sırada, 731 yılında şehit düştü. Şehrin İslâm'la tanışmasının sembol isimlerinden biri olarak anılır.","Türbesi, şehrin yaklaşık bir kilometre doğusundaki Akkaya tepesinde, bir caminin içindedir. 1321 tarihli bir vakfiye, çevresinde o dönemde bir mezarlık oluştuğunu gösterir. Eski cami 1971 yılında yıkılarak yerine yenisi yapıldı. Türbe, Sivaslıların en çok ziyaret ettiği manevi mekânlardan biridir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Sivas\"","harita":"Abdulvahap Gazi Türbesi Sivas"},{"il":"Tekirdağ","ilce":"Hayrabolu","ad":"Sârbân Ahmed Türbesi","zat":"Sârbân Ahmed (Ahmed-i Sârbân)","donem":"? – 1545","hayat":["Sârbân Ahmed, Hayrabolu'da doğmuş, Bayramî Melâmîliği'ne mensup bir sûfî ve şairdir. Kanûnî Sultan Süleyman'ın Irakeyn Seferi'nde ordunun develerinden sorumlu olarak görev yaptı. \"Sârbân\" yani deveci lakabı buradan gelir.","Kaynaklara göre sefer sırasında Karaman'da Pîr Ali Aksarâyî ile tanıştı ve ona intisap etti. Ardından memleketi Hayrabolu'ya dönerek burada insanları irşat etmeye devam etti.","1545 yılında Hayrabolu'da vefat etti. Kabri üzerine yaptırılan türbe birkaç kez onarıldı ve son olarak sade bir şekilde yeniden inşa edildi. Türbe bugün Hayrabolu Kur'an Kursu'nun bahçesinde bulunur."],"kaynak":"TDV İslâm Ansiklopedisi, \"Sârbân Ahmed\"","harita":"Ahmed-i Sarban Türbesi Hayrabolu Tekirdağ"},{"il":"Tokat","ilce":"Niksar","ad":"Melik Dânişmend Gazi Türbesi","zat":"Melik Ahmed Dânişmend Gazi","donem":"? – yaklaşık 1085","hayat":["Dânişmend Gazi, Dânişmendliler hanedanının kurucusudur. Türkmen bir aileden geldiği kabul edilir. Sultan Alparslan ile seferlere katıldı ve Malazgirt Zaferi'nde bulundu.","Zaferden sonra Sivas'ı merkez edinerek Tokat, Amasya, Niksar ve Kayseri gibi şehirleri fethetti. Bu bölgelerin Türkleşip İslâmlaşmasında önemli rol oynadı. Hayatı, Dânişmendnâme adlı destanda menkıbelerle anlatılmıştır.","Vefat tarihi kesin değildir; tarihçiler yaklaşık 1085 yılında vefat ettiğini düşünür. Dânişmendnâme'ye göre Niksar'da vefat etti ve oraya defnedildi. Niksar'daki türbesi, fethin yıl dönümlerinde düzenlenen anma törenleriyle de ziyaret edilen bir mekândır."],"kaynak":"TDV İslâm Ansiklopedisi, \"Dânişmend Gazi\"","harita":"Melik Danişment Gazi Türbesi Niksar Tokat"},{"il":"Trabzon","ilce":"Ortahisar","ad":"Gülbahar Hatun Türbesi","zat":"Gülbahar Hatun","donem":"16. yüzyıl başı","hayat":["Gülbahar Hatun, Yavuz Sultan Selim'in annesidir. Oğlu Trabzon'da sancak beyi iken bu şehirde yaşadı. Hayır işleriyle tanınır ve Trabzon halkı arasında hâlâ saygıyla anılır.","Adını taşıyan külliyeyi yaptırdı. Külliyenin en önemli yapısı, beş kubbeli son cemaat yeri olan Gülbahar Hatun Camii'dir. Halk arasında Hatuniye veya İmaret Camii olarak da bilinir.","Gülbahar Hatun, 16. yüzyılın başlarında vefat etti ve caminin yanındaki türbeye defnedildi. Kitabesine göre türbe yaklaşık 1505 yılında yapılmıştır. Sekizgen gövdeli ve kubbeli bu türbe, bugün Atapark semtinde ziyaret edilebilir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Gülbahar Hatun Camii ve Türbesi\"; Trabzon İl Kültür ve Turizm Müdürlüğü","harita":"Gülbahar Hatun Türbesi Ortahisar Trabzon"},{"il":"Tunceli","ilce":"Mazgirt","ad":"Elti Hatun Türbesi","zat":"Elti Hatun","donem":"13. yüzyıl","hayat":["Elti Hatun Türbesi, Mazgirt ilçe merkezinde, adını taşıyan caminin yakınındadır. Kültür ve Turizm Bakanlığı kayıtlarına göre 13. yüzyıldan kalmadır.","Yanındaki caminin hasarlı kitabesine göre cami, Mengücekli ailesinden Ahmed Şah'ın kızı Elti Hatun adına yaptırılmıştır. Caminin 1252 ile 1257 yılları arasında inşa edildiği tahmin edilir. Türbenin de Elti Hatun için yapıldığı kabul edilir.","Sekizgen gövdeli bir kümbet olan türbenin içinde ikisi büyük, biri küçük üç mezar bulunur. Cami ve türbe, Tunceli'nin Selçuklu dönemine ait en önemli yapıları arasında sayılır."],"kaynak":"Tunceli İl Kültür ve Turizm Müdürlüğü, \"Cami ve Türbeler\"","harita":"Elti Hatun Camii ve Türbesi Mazgirt Tunceli"},{"il":"Şanlıurfa","ilce":"Eyyübiye","ad":"Hz. Eyyûb Sabır Makamı","zat":"Hz. Eyyûb","donem":"Peygamber","hayat":["Hz. Eyyûb, Kur'an-ı Kerim'de sabrıyla övülen bir peygamberdir. Ağır hastalıklara ve kayıplara uğradığı hâlde Allah'a teslimiyetini hiç kaybetmemiştir. Bu yüzden sabrın sembolü olarak anılır.","Şanlıurfa'nın Eyyübiye ilçesinde, şehir merkezine yaklaşık üç kilometre uzaklıktaki bu alan, halk arasında onun sabırla bekleyip şifa bulduğu yer olarak bilinir. Burada bir mağara, şifa kuyusu, küçük bir mescit ve bir türbe bulunur.","Türbedeki mezar sembolik bir mezardır ve tarihî olarak doğrulanmamıştır. Bu nedenle burası bir makam olarak ziyaret edilir. Ziyaretçiler, Hz. Eyyûb'un şifa bulduğuna inanılan kuyunun suyundan içer."],"kaynak":"Kure Ansiklopedi, \"Hz. Eyüp Sabır Makamı\"; Şanlıurfa İl Kültür ve Turizm Müdürlüğü","harita":"Hz. Eyyüp Peygamber Makamı Eyyübiye Şanlıurfa"},{"il":"Şanlıurfa","ilce":"Harran","ad":"Şeyh Hayat el-Harrânî Türbesi","zat":"Hayât bin Kays el-Harrânî","donem":"? – 1185","hayat":["Hayât bin Kays el-Harrânî, Harran'da yaşamış büyük bir sûfîdir. Güzel ahlakı, cömertliği, gece ibadetleri ve kerametleriyle tanındı. Adını taşıyan caminin yanında bir zaviye işletti ve bölgenin en saygın şeyhi oldu.","Sultan Nûreddin Zengî ve Selâhaddîn-i Eyyûbî onu ziyaret etti. Nûreddin Zengî'yi Haçlılara karşı mücadelede cesaretlendirdi. 1185 yılında, seksenli yaşlarında vefat etti.","Kabri, Harran surlarının dışında, şehrin batısındadır. Türbesini 1196 yılında oğlu Ömer yaptırdı. Halk, günümüzde de türbeyi ziyaret eder ve yağmur dualarında onu anar."],"kaynak":"TDV İslâm Ansiklopedisi, \"Harrânî, Hayât b. Kays\"","harita":"Şeyh Hayat el-Harrani Türbesi Harran Şanlıurfa"},{"il":"Uşak","ilce":"Sivaslı","ad":"Hacım Sultan Türbesi","zat":"Hacım Sultan","donem":"14. yüzyıl","hayat":["Hacım Sultan, Batı Anadolu'daki göçebe Türkmenler arasında tasavvufi geleneğin yayılmasında rol oynayan bir derviştir. Koluaçık Hacım Sultan olarak da anılır. Muhtemelen 14. yüzyılda yaşamıştır. Hayatı, büyük ölçüde Hacım Sultan Vilâyetnâmesi'ndeki menkıbelerden bilinir.","Menkıbelere göre Hacı Bektaş-ı Velî'nin yol arkadaşıdır. Ancak tarihçiler, ikisinin aynı dönemde yaşamış olmasının zor olduğunu belirtir.","Türbesi, Sivaslı ilçesine bağlı Hacım köyünün mezarlığındadır. Buradaki zaviye, 1321 yılında Germiyanoğlu Birinci Yakub Bey tarafından yaptırıldı. Zaviyeden günümüze yalnızca türbe ulaşmıştır."],"kaynak":"TDV İslâm Ansiklopedisi, \"Hacım Sultan\"; Uşak İl Kültür ve Turizm Müdürlüğü","harita":"Hacım Sultan Türbesi Sivaslı Uşak"},{"il":"Van","ilce":"Gevaş","ad":"Halime Hatun Kümbeti","zat":"Halime Hatun","donem":"14. yüzyıl","hayat":["Halime Hatun Kümbeti, Gevaş'taki tarihî Selçuklu mezarlığının yanında yükselen, Van'ın en tanınmış türbe yapısıdır. Kaynaklara göre Halime Hatun, bölgenin yöneticisi Melik İzzeddin'in kızıdır. Gevaş, Van Gölü'nün güney kıyısında yer alır.","Kümbet, 1335 yılında babası tarafından kızı için yaptırılmıştır. Ustası Ahlatlı Pehlivan oğlu Esed'dir. İki katlı yapının alt katında mezar odası bulunur.","Zarif taş işçiliği ve süslemeleriyle Osmanlı öncesi Türk mimarisinin güzel örneklerinden sayılır. Hemen yanındaki tarihî mezarlıkla birlikte Gevaş'ın en çok ziyaret edilen yerlerinden biridir."],"kaynak":"Kültür ve Turizm Bakanlığı GoTürkiye, \"Van\"; TDV İslâm Ansiklopedisi, \"Ahlat\"; GZT, \"Van Gevaş'taki Selçuklu Mezarlığı ve Halime Hatun Türbesi\"","harita":"Halime Hatun Kümbeti Gevaş Van"},{"il":"Yozgat","ilce":"Merkez","ad":"Emirci Sultan Türbesi","zat":"Emirci Sultan (Şerefüddin İsmâil)","donem":"? – 1240","hayat":["Emirci Sultan'ın asıl adı Şerefüddin İsmâil'dir. Yozgat yöresinde yaşamış bir Türkmen şeyhidir. Yesevî geleneğine bağlı bir derviş olarak anılır. Kaynaklara göre bölgeye 1203 yılı civarında geldi.","Vilâyetnâme, onu Hacı Bektaş-ı Velî'nin çevresinde gösterir. Ahmed Yesevî ile doğrudan bağı olduğuna dair menkıbeler ise tarihçilerce kabul görmez. Türbedeki asıl kitabe, 1240 yılını gösterir.","Zaviyesi ve türbesi, Yozgat'a bağlı Osmanpaşa Tekkesi'ndedir. Zaviye 1925'e kadar faaliyet gösterdi ve sonra yıkıldı, ancak türbe ayakta kaldı. Türbe, bugün de yöre halkının önemli bir ziyaretgâhıdır."],"kaynak":"Kure Ansiklopedi, \"Emirci Sultan\"; Yozgat Valiliği","harita":"Emirci Sultan Türbesi Osmanpaşa Yozgat"},{"il":"Zonguldak","ilce":"Devrek","ad":"Hızır Bey Türbesi","zat":"Hızır Bey","donem":"14. yüzyıl","hayat":["Hızır Bey Türbesi, Devrek ilçesine bağlı Özbağı köyündedir. Yerel kaynaklara göre burada, Osmanlı Sultanı Orhan Bey döneminde yaşamış bir komutan olan Hızır Bey yatmaktadır.","Hızır Bey'in hayatı hakkında ayrıntılı tarihî bilgi yoktur. Türbe, halk arasında onun kabri olarak kabul edilir ve köyün manevi bir mekânı olarak korunur.","Zonguldak'ta büyük ziyaretgâhlar azdır. Bu nedenle Hızır Bey Türbesi, yöre halkının bildiği ve ziyaret ettiği sayılı türbelerden biridir. Ziyaret ederken yerel halktan bilgi almak faydalı olur."],"kaynak":"Yerel basın (Yeni Bakış Gazetesi, \"Zonguldak'ta hangi türbeler var?\")","harita":"Hızır Bey Türbesi Özbağı Devrek Zonguldak"},{"il":"Aksaray","ilce":"Merkez","ad":"Pîr Ali Aksarâyî Türbesi","zat":"Pîr Ali Aksarâyî","donem":"yaklaşık 1477 – 1539","hayat":["Pîr Ali Aksarâyî, Aksaray'da doğdu. Halk arasında Sultan Pîr Ali olarak tanınır. Bayramî Melâmîliği'nin önde gelen isimlerindendir. Mürşidi Bünyâmin Ayâşî'dir ve bu yolun kutbu kabul edilmiştir.","Pek çok mürit yetiştirdi. Hayrabolulu Sârbân Ahmed, Kanûnî'nin seferi sırasında ona intisap edenlerden biridir. Oğlu İsmâil Ma'şûkî de onun yolunu sürdürdü.","Kaynaklarda vefatı için farklı tarihler verilir; en kuvvetli rivayete göre 1539 yılında Kayseri'de, halifesinin evinde vefat etti. Vasiyeti üzerine naaşı Aksaray'a getirildi ve bugün türbesinin bulunduğu yere defnedildi. Türbesi Taşpazar Mahallesi'ndedir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Pîr Ali Aksarâyî\"","harita":"Pir Ali Aksarayi Türbesi Aksaray"},{"il":"Bayburt","ilce":"Merkez","ad":"Dede Korkut Türbesi","zat":"Dede Korkut","donem":"Dönemi kesin bilinmiyor","hayat":["Dede Korkut, Oğuz Türklerinin bilge ve ozan kişiliğidir. Destanlarda boyların danışmanı ve dua eden ulusu olarak yer alır. Oğuzların İslâm'ı kabulüyle birlikte halk arasında bir evliya olarak da anılmıştır. Hikâyeleri sözlü olarak yaşamış ve 16. yüzyılda yazıya geçirilmiştir.","Yaşadığı dönem kesin olarak belirlenememiştir. Türk dünyasının pek çok yerinde ona nispet edilen mezarlar vardır.","Bayburt'taki türbe, şehir merkezine yaklaşık 39 kilometre uzaklıktaki Masat vadisindedir. Rivayete göre Dede Korkut'un kabridir. Kesme taştan yapılmış sekizgen bir türbedir ve yapım tarihi bilinmemektedir. Her yıl düzenlenen Dede Korkut şöleninde burada anma yapılır."],"kaynak":"Bayburt İl Kültür ve Turizm Müdürlüğü, \"Dede Korkut\"; Bayburt Valiliği","harita":"Dede Korkut Türbesi Masat Bayburt"},{"il":"Karaman","ilce":"Merkez","ad":"Mâder-i Mevlânâ Türbesi (Karaman Mevlevîhânesi)","zat":"Mümine Hatun, Muhammed Alâeddin","donem":"13. yüzyıl","hayat":["Mümine Hatun, Mevlânâ Celâleddîn-i Rûmî'nin annesidir. Bahâeddin Veled ve ailesi, Horasan'dan Konya'ya gelmeden önce bir süre Lârende, yani bugünkü Karaman'da yaşadı. Mümine Hatun burada vefat etti ve buraya defnedildi.","Aynı yerde Mevlânâ'nın ağabeyi Muhammed Alâeddin de yatmaktadır. Bu mezarların bulunduğu yere, 14. yüzyılın başlarında bir Mevlevî tekkesi kuruldu.","Yapı zamanla Ak Tekke ve Mâder-i Mevlânâ adlarıyla da anıldı. Bugün Karaman Mevlevîhânesi olarak bilinir ve cami ile ziyaretgâh olarak kullanılır. Mevlânâ'yı sevenler, Konya yolculuğunda çoğu zaman annesinin türbesini de ziyaret eder."],"kaynak":"TDV İslâm Ansiklopedisi, \"Karaman Mevlevîhânesi\"; TDV İslâm Ansiklopedisi, \"Mâder-i Mevlânâ Tekkesi\"","harita":"Mader-i Mevlana Camii ve Türbesi Aktekke Karaman"},{"il":"Kırıkkale","ilce":"Merkez","ad":"Hasandede Camii ve Türbesi","zat":"Hasan Dede","donem":"Dönemi kesin bilinmiyor","hayat":["Hasandede Türbesi, Kırıkkale'ye bağlı ve adını bu zattan alan Hasandede yerleşiminde bulunur. Kırıkkale'nin en bilinen ziyaretgâhıdır. Hasan Dede'nin hayatı hakkında kesin tarihî bilgi yoktur. Yerel kaynaklara göre türbede Hasan Dede ile oğulları ve kızı yatmaktadır.","Türbenin yanındaki caminin 1605 yılına ait olduğu belirtilir. Kalın kesme taş duvarları ve tuğla minaresiyle dikkat çeker.","Hasandede, Alevî ve Bektaşî inancına mensup ziyaretçilerin de büyük ilgi gösterdiği bir yerdir. Özellikle bahar ve yaz aylarında Türkiye'nin pek çok yerinden gelen ziyaretçileri ağırlar."],"kaynak":"Kırıkkale İl Kültür ve Turizm Müdürlüğü, \"Camiler ve Türbeler\"; Kırıkkale Valiliği","harita":"Hasandede Türbesi Kırıkkale"},{"il":"Batman","ilce":"Hasankeyf","ad":"İmam Abdullah Türbesi ve Zaviyesi","zat":"İmam Abdullah","donem":"Dönemi kesin bilinmiyor","hayat":["İmam Abdullah, Hasankeyf'te yatan ve bölge halkının büyük saygı gösterdiği bir zattır. Rivayete göre soyu Ehl-i Beyt'e dayanır ve bölgeye irşat için gelmiştir. Yaşadığı dönem kesin olarak bilinmemektedir.","Türbe ve zaviyesi, eski Hasankeyf'te Dicle kıyısında bulunuyordu. Ilısu Barajı nedeniyle alan su altında kalacağından türbe taşındı. Naaşı 2019 yılında dualarla Hasankeyf Kültür Parkı'ndaki yeni türbesine nakledildi.","Türbenin çevresindeki yüzlerce mezar da yeni alana taşındı. Hasankeyf'e gelen ziyaretçiler, tarihî eserlerin yanı sıra İmam Abdullah Türbesi'ni de ziyaret eder."],"kaynak":"TRT Haber, \"İmam Abdullah'ın müzede korunan naaşı yeni yerine nakledildi\" (2019); TDV İslâm Ansiklopedisi, \"Hasankeyf\"","harita":"İmam Abdullah Türbesi Hasankeyf Batman"},{"il":"Şırnak","ilce":"Cizre","ad":"Hz. Nuh Türbesi","zat":"Hz. Nuh","donem":"Peygamber","hayat":["Hz. Nuh, Kur'an-ı Kerim'de adı geçen büyük peygamberlerdendir. Kavmini uzun yıllar tevhide davet etmiş, tufandan sonra gemisi Cûdî Dağı'na oturmuştur. Cûdî Dağı, Cizre'nin hemen yakınındadır.","Cizre'deki Hz. Nuh Türbesi, halk arasında onun kabri olarak kabul edilir. Ancak bu tarihî olarak kesin değildir. Bu yüzden burası bir makam türbe olarak ziyaret edilir.","Türbe, Nuh Peygamber Camii ile birlikte bir külliye oluşturur. Özellikle Ramazan aylarında ve her yıl düzenlenen anma etkinliklerinde çok sayıda ziyaretçiyi ağırlar."],"kaynak":"TDV İslâm Ansiklopedisi, \"Cizre\"; İstiklal Gazetesi, \"Hz. Nuh Peygamber ve Ebul-İz El-Cezeri türbeleri restore edilecek\"","harita":"Hz. Nuh Türbesi Cizre Şırnak"},{"il":"Şırnak","ilce":"Cizre","ad":"Molla Cezerî Türbesi (Kırmızı Medrese)","zat":"Molla Cezerî (Şeyh Ahmed el-Cezerî)","donem":"16. yüzyıl – 1640","hayat":["Molla Cezerî, asıl adıyla Şeyh Ahmed bin Muhammed el-Cezerî, Cizreli bir sûfî ve şairdir. Doğum tarihi kesin bilinmemektedir; 16. yüzyılın ikinci yarısında Cizre'de doğduğu tahmin edilir.","Kürtçe yazdığı Dîvân'ı ile tanınır. Bu eserde çoğu gazel olmak üzere 114 şiir bulunur. Şiirlerinde ilahî aşkı ve tasavvufi düşünceleri işlemiştir.","1640 yılında vefat etti. Ders verdiği Cizre'deki Kırmızı Medrese'nin alt katına defnedildi. Kabri, bugün önemli bir ziyaretgâhtır. Kırmızı Medrese, Cizre'nin en tanınmış tarihî yapılarından biridir ve ziyaretçiler şairin kabrini burada ziyaret eder."],"kaynak":"TDV İslâm Ansiklopedisi, \"Molla Cezerî\"","harita":"Kırmızı Medrese Molla Cezeri Türbesi Cizre Şırnak"},{"il":"Bartın","ilce":"Merkez","ad":"Ebû Derdâ Makamı","zat":"Ebû Derdâ (makam)","donem":"? – 652","hayat":["Ebû Derdâ, Medineli bir sahâbîdir. Kur'an'ı ezberleyen, ilmi ve zühdüyle tanınan sahâbîlerdendir. Hz. Ömer döneminde Şam'a gönderildi ve orada kadılık yaptı. 652 yılında Şam'da vefat etti.","Gerçek kabri Şam'dadır. Anadolu'nun bazı yerlerinde ise ona nispet edilen makamlar bulunur. Bartın'daki türbe de bunlardan biridir ve bir makam türbedir.","Türbe, Bartın şehir merkezinde, Tuna Caddesi üzerindedir. Yanında küçük bir mescit, bir çeşme ve bir kuyu bulunur. Bartınlılar burayı Ebû Derdâ'nın hatırasına saygıyla ziyaret eder."],"kaynak":"TDV İslâm Ansiklopedisi, \"Ebü'd-Derdâ\"; yerel basın","harita":"Ebu Derda Türbesi Bartın"},{"il":"Ardahan","ilce":"Damal","ad":"Şeyh Ahmed-i Kebir Türbesi","zat":"Şeyh Ahmed-i Kebir, Şeyh Mehmed-i Kebir","donem":"Dönemi kesin bilinmiyor","hayat":["Şeyh Ahmed-i Kebir Türbesi, Damal ilçesine bağlı Seyitören köyünde, Ilgar Dağı'nın güneyindedir. Ardahan'ın bilinen sayılı ziyaretgâhlarından biridir.","Burada Şeyh Ahmed-i Kebir ve Şeyh Mehmed-i Kebir'e ait taş sandukalı mezarlar bulunur. Bu zatların hayatları ve yaşadıkları dönem hakkında kesin bilgi yoktur. Mezarların yalın yapısı, buranın eski bir ziyaret yeri olduğunu düşündürür.","Yöre halkı bu mezarları saygıyla ziyaret eder. Türbe, yaklaşık on metre çapında konik bir tepeciğin üzerindedir. Ziyaret öncesinde yol ve ulaşım bilgisi için köy halkına danışmak faydalı olur."],"kaynak":"Yerel basın (Yeni Bakış Gazetesi, \"Ardahan'da hangi türbeler var?\")","harita":"Seyitören Köyü Damal Ardahan"},{"il":"Iğdır","ilce":"Merkez","ad":"Kul Yusuf Kümbeti (Çakırtaş Kümbeti)","zat":"Kul Yusuf","donem":"15. yüzyıl","hayat":["Kul Yusuf Kümbeti, Iğdır'ın yaklaşık 11 kilometre kuzeyinde, Çakırtaş köyünün batısındaki eski bir mezarlıkta bulunur. Iğdır'ın en eski ve en önemli türbe yapısıdır.","Kitabesine göre 1485 yılında yapılmıştır. Burada yatan Kul Yusuf, bölgede saygı gören bir zattır. Hayatı hakkında ayrıntılı bilgi yoktur.","Kesme taştan, iki katlı ve sekizgen gövdeli bir kümbettir. Mimarı bilinmemektedir, ancak üslubu Akkoyunlu dönemine işaret eder. Kümbetin çevresindeki eski mezarlık bugün neredeyse tamamen kaybolmuştur. 1967 yılında incelenen taş sandukalar da günümüze ulaşmamıştır."],"kaynak":"Iğdır İl Kültür ve Turizm Müdürlüğü, \"Kümbetler\"","harita":"Çakırtaş Kümbeti Iğdır"},{"il":"Yalova","ilce":"Altınova","ad":"Hersekzâde Ahmed Paşa Camii ve Türbesi","zat":"Hersekzâde Ahmed Paşa","donem":"? – 1517","hayat":["Hersekzâde Ahmed Paşa, İkinci Bayezid ve Yavuz Sultan Selim dönemlerinde birkaç kez sadrazamlık yapmış bir Osmanlı devlet adamıdır. Edirne, İzmir, Kütahya ve Aydın gibi pek çok şehirde hayır eserleri yaptırdı.","Yalova'nın Altınova ilçesine bağlı Hersek köyünde de bir cami yaptırdı. Caminin vakfiyesi 1511 yılında tescil edildi. Türbesi caminin sağ tarafında yer alır.","Türbe, dokuz basamakla çıkılan ve mermer korkulukla çevrili yüksek bir taş sekinin üzerindedir. Cami, 1766 depreminde zarar gördü ve 1773 yılında onarıldı. Yalova'nın en önemli tarihî türbesidir."],"kaynak":"TDV İslâm Ansiklopedisi, \"Hersekzâde Ahmed Paşa Camii ve Türbesi\"","harita":"Hersekzade Ahmet Paşa Camii Hersek Altınova Yalova"},{"il":"Karabük","ilce":"Safranbolu","ad":"Hacı Emin Efendi Türbesi","zat":"Hacı Emin Efendi","donem":"19. yüzyıl","hayat":["Hacı Emin Efendi, 19. yüzyılda Safranbolu'da yaşamış bir Halvetî şeyhidir. Şehrin manevi hayatında önemli bir yere sahiptir.","Türbesi, Safranbolu'nun Mescit Mahallesi'nde, Zulmiye Camii'nin yanındadır. Yerel kaynaklara göre türbe, 1866 ile 1867 yılları arasında yaptırılmıştır.","Türbede Hacı Emin Efendi'nin yanı sıra bir başka Halvetî şeyhi ve oğlu da yatmaktadır. Safranbolu'yu gezenler, tarihî çarşının yakınındaki bu türbeyi de ziyaret eder. Safranbolu, UNESCO Dünya Mirası Listesi'nde yer alan tarihî bir şehirdir. Şehirdeki Halvetî tekkeleri ve türbeleri, bu manevi geleneğin izlerini bugüne taşır."],"kaynak":"Yerel basın (Yeni Bakış Gazetesi, \"Karabük'te hangi türbeler var?\")","harita":"Hacı Emin Efendi Türbesi Zulmiye Camii Safranbolu Karabük"},{"il":"Kilis","ilce":"Merkez","ad":"Şeyh Muhammed Bedevî Türbesi","zat":"Şeyh Muhammed Bedevî (Şeyh Muhammed Rıttâlî)","donem":"? – 639 (rivayet)","hayat":["Şeyh Muhammed Bedevî, Şeyh Muhammed Rıttâlî veya Arabî olarak da anılır. Rivayete göre Hz. Ömer'in halifeliği döneminde Ebû Ubeyde bin Cerrah komutasındaki İslâm ordusuyla bölgeye gelmiş bir sahâbîdir.","Savaşta ve barışta askerlere hurma dağıttığı anlatılır. Rivayete göre 639 yılında burada şehit düşmüştür. Sandukasında kimliğini doğrulayan bir yazı yoktur. Bu bilgi, Evliya Çelebi'nin Seyahatname'sindeki kayda dayanır.","Türbe, Kilis'in batısındaki Kalleş Tepesi'nin güneyinde, yüksek bir yerdedir. 14. yüzyılın ikinci yarısında yapıldığı sanılır. Kare planlı ve sivri kubbelidir. İçinde yeşil örtülü ahşap bir sanduka bulunur."],"kaynak":"Kilis İl Kültür ve Turizm Müdürlüğü, \"Şeyh Muhammed Bedevi Türbesi\"","harita":"Şeyh Muhammed Bedevi Türbesi Kilis"},{"il":"Osmaniye","ilce":"Kadirli","ad":"Hasan Dede Türbesi","zat":"Hasan Dede","donem":"14. yüzyıl (tahmini)","hayat":["Hasan Dede Türbesi, Kadirli ilçesine bağlı İlbastı köyünün mezarlığındadır. Osmaniye'nin bilinen ziyaretgâhlarından biridir. Hasan Dede'nin hayatı hakkında belgelenmiş bilgi yoktur.","Halk arasındaki inanca göre Hoca Ahmed Yesevî'nin Anadolu'ya gönderdiği dervişlerdendir. Bir menkıbeye göre kimsenin kaldıramadığı bir değirmen taşını yerinden oynatmış, ardından kaybolmuş ve hırkasını bugünkü türbenin olduğu yerde bırakmıştır.","Türbe, yaklaşık beş metre çapında, kubbeli ve yuvarlak bir yapıdır. İçinde ahşap bir sanduka bulunur. Tarihi kesin değildir ve 14. yüzyıla ait olduğu tahmin edilir."],"kaynak":"Yerel basın (Yeni Bakış Gazetesi, \"Osmaniye'de hangi türbeler var?\")","harita":"Hasan Dede Türbesi İlbastı Kadirli Osmaniye"},{"il":"Düzce","ilce":"Merkez","ad":"Konuralp Türbesi","zat":"Konur Alp, Ali Hamza","donem":"14. yüzyıl","hayat":["Konur Alp, Osman Gazi'nin silah arkadaşlarından biridir. Batı Karadeniz bölgesinin Osmanlı topraklarına katılmasında önemli rol oynadı. Kültür ve Turizm Bakanlığı kayıtlarına göre 1323 yılında şehri Bizanslılardan aldı. Bugünkü Konuralp Mahallesi adını ondan alır.","Türbe, Düzce'nin Konuralp Mahallesi'ndedir ve Konur Alp'e ait olarak bilinir. İçindeki üç mezardan birinin, Konur Alp'in yakınlarından Ali Hamza'ya ait olduğu kabul edilir.","Türbe bugün yeni bir yapı görünümündedir. Konuralp'teki antik kent ve müzeyi gezenler, türbeyi de ziyaret eder."],"kaynak":"Düzce İl Kültür ve Turizm Müdürlüğü, \"Konuralp Türbesi\"","harita":"Konuralp Türbesi Düzce"}];

let turbeGate=false;
const trLow=s=>String(s||"").toLocaleLowerCase("tr").replace(/[âà]/g,"a").replace(/[îì]/g,"i").replace(/[ûù]/g,"u");
const mapUrl=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
function uyariHTML(full){const [b,...r]=TURBE_UYARI.split(": ");return `<div class="card uyari${full?" full":""}" role="note"><b>${esc(b)}:</b> ${esc(r.join(": "))}</div>`}

      <p class="small muted">Kabir ziyaretinde ölülere selam verilir, onlar için Fâtiha okunur ve dua edilir. İstek ve dua yalnızca Allah'a yöneltilir.</p>
      <button class="btn" id="gok" style="width:100%">Okudum, anladım</button></div>`;
    $("#gok").onclick=()=>{turbeGate=true;vTurbeler()};window.scrollTo(0,0);return}
  const q=store.get("turbeQ","");
  const ils=[...new Set(TURBE.map(t=>t.il))];const mine=ils.find(i=>trLow(i)===trLow(loc.name));
  const order=mine?[mine,...ils.filter(i=>i!==mine)]:ils;
  view.innerHTML=`${uyariHTML(false)}
